; Easy Articles module (free): tabs of Joomla article cards, as a grid or a slider.

MOD_EASY_ARTICLES="Easy Articles"
MOD_EASY_ARTICLES_DESC="Shows Joomla articles - latest, featured, most read or recently read, from any categories, in any order - as a grid or a slider. Several tabs, each with its own selection, render as a tab strip whose tabs load when opened."
MOD_EASY_ARTICLES_TABS_LBL="Tabs"
MOD_EASY_ARTICLES_TABS_DESC="Each row is one listing with its own selection. One row shows as a plain list; two or more show as tabs, in this order."

MOD_EASY_ARTICLES_TAB_LABEL_LBL="Label"
MOD_EASY_ARTICLES_TAB_LABEL_DESC="The tab's title. Empty = the category names, or the source's name when no category is chosen. A language key is translated."
MOD_EASY_ARTICLES_TAB_LABEL_HINT="Auto"
MOD_EASY_ARTICLES_SOURCE_LBL="Show"
MOD_EASY_ARTICLES_SOURCE_DESC="Articles: all articles, or those of the chosen categories, in the chosen order. Featured: only featured articles. Most read orders by hits. Recently read is the visitor's own reading in this session, recorded on the article pages where an Easy Articles module is published."
MOD_EASY_ARTICLES_SOURCE_ARTICLES="Articles"
MOD_EASY_ARTICLES_SOURCE_FEATURED="Featured"
MOD_EASY_ARTICLES_SOURCE_MOST_READ="Most read"
MOD_EASY_ARTICLES_SOURCE_RECENTLY_READ="Recently read"
MOD_EASY_ARTICLES_CATEGORIES_LBL="Categories"
MOD_EASY_ARTICLES_CATEGORIES_DESC="None = all categories. Subcategories follow the Articles options' Include Subcategories setting."
MOD_EASY_ARTICLES_CATEGORIES_HINT="All categories"
MOD_EASY_ARTICLES_ORDERING_LBL="Order"
MOD_EASY_ARTICLES_ORDERING_DESC="Applies to Articles and Featured; Most read and Recently read keep their own ranking."
MOD_EASY_ARTICLES_ORDER_NEWEST="Newest first"
MOD_EASY_ARTICLES_ORDER_OLDEST="Oldest first"
MOD_EASY_ARTICLES_ORDER_MODIFIED="Recently updated"
MOD_EASY_ARTICLES_ORDER_TITLE_ASC="Title (A-Z)"
MOD_EASY_ARTICLES_ORDER_TITLE_DESC="Title (Z-A)"
MOD_EASY_ARTICLES_ORDER_CUSTOM_ASC="Article order (first to last)"
MOD_EASY_ARTICLES_ORDER_CUSTOM_DESC="Article order (last to first)"
MOD_EASY_ARTICLES_ORDER_FEATURED="Featured order"
MOD_EASY_ARTICLES_ORDER_RANDOM="Random"
MOD_EASY_ARTICLES_LIMIT_LBL="Number of articles"
MOD_EASY_ARTICLES_LIMIT_DESC="Articles shown in this tab."
MOD_EASY_ARTICLES_TAB_LINK_LBL="View all link"
MOD_EASY_ARTICLES_TAB_LINK_DESC="A link below the articles: one category leads to that category's page, a featured tab without categories to the featured articles page. Other tabs have no page to link to."
MOD_EASY_ARTICLES_TAB_CARD_LBL="Card settings"


MOD_EASY_ARTICLES_CARD_IMAGE_LBL="Image"
MOD_EASY_ARTICLES_CARD_IMAGE_DESC="Which article image a card shows. Intro image uses the full article image when an article has no intro image. A breakpoint can hide the image, or show it again."
MOD_EASY_ARTICLES_CARD_IMAGE_INTRO="Intro image"
MOD_EASY_ARTICLES_CARD_IMAGE_FULL="Full article image"
MOD_EASY_ARTICLES_CARD_IMAGE_NONE="No image"
MOD_EASY_ARTICLES_CARD_INTRO_LBL="Intro text length (characters)"
MOD_EASY_ARTICLES_CARD_INTRO_DESC="How much of the intro text a card shows, as plain text. 0 shows none. The same on every screen; Intro text lines can shorten it per breakpoint."
MOD_EASY_ARTICLES_CARD_DATE_LBL="Date"
MOD_EASY_ARTICLES_CARD_DATE_DESC="The article's publishing date."
MOD_EASY_ARTICLES_CARD_CATEGORY_LBL="Category"
MOD_EASY_ARTICLES_CARD_CATEGORY_DESC="The article's category, beside the date."
MOD_EASY_ARTICLES_CARD_AUTHOR_LBL="Author"
MOD_EASY_ARTICLES_CARD_AUTHOR_DESC="The article's author (or its author alias), beside the date."
MOD_EASY_ARTICLES_CARD_READMORE_LBL="Read more"
MOD_EASY_ARTICLES_CARD_READMORE_DESC="A 'Read more' cue at the bottom of the card. The whole card is the link either way."
MOD_EASY_ARTICLES_CARD_HEADING_LBL="Title heading"
MOD_EASY_ARTICLES_CARD_HEADING_DESC="The heading level of a card's title. Pick the level that follows the heading above the module on your pages. The same on every screen."
MOD_EASY_ARTICLES_CARD_STYLE_LBL="Card style"
MOD_EASY_ARTICLES_CARD_STYLE_DESC="Standard: the image above the text. Overlay: the image fills the card and the text sits over it on a dark gradient."
MOD_EASY_ARTICLES_CARD_STYLE_STANDARD="Standard"
MOD_EASY_ARTICLES_CARD_STYLE_OVERLAY="Overlay"
MOD_EASY_ARTICLES_CARD_TEXT_POSITION_LBL="Text position"
MOD_EASY_ARTICLES_CARD_TEXT_POSITION_DESC="Where the text sits on an overlay card."
MOD_EASY_ARTICLES_CARD_TEXT_POSITION_BOTTOM="Bottom"
MOD_EASY_ARTICLES_CARD_TEXT_POSITION_MIDDLE="Middle"
MOD_EASY_ARTICLES_CARD_TEXT_POSITION_TOP="Top"
MOD_EASY_ARTICLES_CARD_IMAGE_FIT_LBL="Image fit"
MOD_EASY_ARTICLES_CARD_IMAGE_FIT_DESC="Cover: the image fills its frame and its edges are trimmed. Contain: the whole image shows inside the frame. Original shape: no frame, every image keeps its own shape, so cards in a row can differ in height. An overlay card always uses Cover."
MOD_EASY_ARTICLES_CARD_IMAGE_FIT_COVER="Cover"
MOD_EASY_ARTICLES_CARD_IMAGE_FIT_CONTAIN="Contain"
MOD_EASY_ARTICLES_CARD_IMAGE_FIT_NATURAL="Original shape"
MOD_EASY_ARTICLES_CARD_IMAGE_RATIO_LBL="Image frame"
MOD_EASY_ARTICLES_CARD_IMAGE_RATIO_DESC="The shape of the image frame. On an overlay card it is the card's smallest height: a longer text makes the card taller."
MOD_EASY_ARTICLES_CARD_IMAGE_RATIO_16_9="16:9 (wide)"
MOD_EASY_ARTICLES_CARD_IMAGE_RATIO_16_10="16:10"
MOD_EASY_ARTICLES_CARD_IMAGE_RATIO_4_3="4:3"
MOD_EASY_ARTICLES_CARD_IMAGE_RATIO_1_1="1:1 (square)"
MOD_EASY_ARTICLES_CARD_IMAGE_RATIO_3_4="3:4 (portrait)"
MOD_EASY_ARTICLES_CARD_IMAGE_FOCUS_LBL="Crop focus"
MOD_EASY_ARTICLES_CARD_IMAGE_FOCUS_DESC="Which part of a trimmed image stays in view. Top keeps the heads in portraits."
MOD_EASY_ARTICLES_CARD_IMAGE_FOCUS_CENTER="Centre"
MOD_EASY_ARTICLES_CARD_IMAGE_FOCUS_TOP="Top"
MOD_EASY_ARTICLES_CARD_TITLE_LINES_LBL="Title lines"
MOD_EASY_ARTICLES_CARD_TITLE_LINES_DESC="A longer title ends with an ellipsis after this many lines. 0 = no limit. The whole title stays in the page for search engines and screen readers."
MOD_EASY_ARTICLES_CARD_TITLE_WEIGHT_LBL="Title weight"
MOD_EASY_ARTICLES_CARD_TITLE_WEIGHT_DESC="How heavy the title's letters are. Empty keeps the weight the site's stylesheet gives headings."
MOD_EASY_ARTICLES_CARD_TITLE_WEIGHT_300="Light (300)"
MOD_EASY_ARTICLES_CARD_TITLE_WEIGHT_400="Normal (400)"
MOD_EASY_ARTICLES_CARD_TITLE_WEIGHT_500="Medium (500)"
MOD_EASY_ARTICLES_CARD_TITLE_WEIGHT_600="Semi-bold (600)"
MOD_EASY_ARTICLES_CARD_TITLE_WEIGHT_700="Bold (700)"
MOD_EASY_ARTICLES_CARD_TITLE_WEIGHT_800="Extra-bold (800)"
MOD_EASY_ARTICLES_CARD_INTRO_LINES_LBL="Intro text lines"
MOD_EASY_ARTICLES_CARD_INTRO_LINES_DESC="A longer intro text ends with an ellipsis after this many lines. 0 = no limit. Intro text length still decides how much text the page carries."
MOD_EASY_ARTICLES_CARD_RADIUS_LBL="Card corners (px)"
MOD_EASY_ARTICLES_CARD_RADIUS_DESC="How round the card's corners are, each on its own: top left, top right, bottom right, bottom left. The lock sets all four at once. 0 = square; empty = the site's own corners (4 px unless its stylesheet sets another size)."
MOD_EASY_ARTICLES_CARD_IMAGE_RADIUS_LBL="Image corners (px)"
MOD_EASY_ARTICLES_CARD_IMAGE_RADIUS_DESC="How round the image's corners are on a standard card, each on its own: top left, top right, bottom right, bottom left. The lock sets all four at once. 0 = square; empty = as the site's stylesheet draws them. An overlay card's image fills the card, so Card corners round it."
MOD_EASY_ARTICLES_CARD_SHADOW_LBL="Shadow"
MOD_EASY_ARTICLES_CARD_SHADOW_DESC="The card's shadow: any CSS box-shadow, such as 0 4px 12px rgb(0 0 0 / 0.15). Empty = none, unless the site sets one."
MOD_EASY_ARTICLES_CARD_SHADOW_HOVER_LBL="Shadow on hover"
MOD_EASY_ARTICLES_CARD_SHADOW_HOVER_DESC="The shadow while the pointer is over the card or it holds keyboard focus, eased in. Empty = no change, unless the site sets one."
MOD_EASY_ARTICLES_CARD_SHOW_INTRO_LBL="Intro text"
MOD_EASY_ARTICLES_CARD_SHOW_INTRO_DESC="Show the beginning of the article's intro text on the card."
MOD_EASY_ARTICLES_CARD_OVERLAY_BACKGROUND_LBL="Overlay background"
MOD_EASY_ARTICLES_CARD_OVERLAY_BACKGROUND_DESC="What an overlay card's text sits on: any CSS background, such as a colour (#000000cc) or a gradient. Empty = the module's gradient, shown in the box (for text at the bottom; it runs the other way at the top, and is a plain band in the middle)."
MOD_EASY_ARTICLES_CARD_IMAGE_POSITION_LBL="Image position"
MOD_EASY_ARTICLES_CARD_IMAGE_POSITION_DESC="Where the image sits on a standard card: above the text, beside it on the left or the right, or under it."
MOD_EASY_ARTICLES_CARD_IMAGE_POSITION_TOP="Top"
MOD_EASY_ARTICLES_CARD_IMAGE_POSITION_LEFT="Left"
MOD_EASY_ARTICLES_CARD_IMAGE_POSITION_RIGHT="Right"
MOD_EASY_ARTICLES_CARD_IMAGE_POSITION_BOTTOM="Bottom"
MOD_EASY_ARTICLES_CARD_IMAGE_WIDTH_LBL="Image width (%)"
MOD_EASY_ARTICLES_CARD_IMAGE_WIDTH_DESC="For an image on the left or the right: its share of the card's width, from 10 to 90. Empty = 40."
MOD_EASY_ARTICLES_CARD_IMAGE_HEIGHT_LBL="Max image height (px)"
MOD_EASY_ARTICLES_CARD_IMAGE_HEIGHT_DESC="The tallest an image may be. Empty or 0 = no limit."
MOD_EASY_ARTICLES_CARD_IMAGE_FOCUS_BOTTOM="Bottom"
MOD_EASY_ARTICLES_CARD_IMAGE_FOCUS_LEFT="Left"
MOD_EASY_ARTICLES_CARD_IMAGE_FOCUS_RIGHT="Right"
MOD_EASY_ARTICLES_CARD_HINT_NO_LIMIT="No limit"
MOD_EASY_ARTICLES_CARD_BORDER_LBL="Card border (px)"
MOD_EASY_ARTICLES_CARD_BORDER_DESC="The card's border width on each side: top, right, bottom, left. 0 removes it on that side, so a border on one side only makes a separator. The lock sets all four at once. Empty = the module's own 1 px line, in the Lines and borders colour."
MOD_EASY_ARTICLES_SIDE_TOP="Top"
MOD_EASY_ARTICLES_SIDE_RIGHT="Right"
MOD_EASY_ARTICLES_SIDE_BOTTOM="Bottom"
MOD_EASY_ARTICLES_SIDE_LEFT="Left"
MOD_EASY_ARTICLES_CORNER_TL="Top left"
MOD_EASY_ARTICLES_CORNER_TR="Top right"
MOD_EASY_ARTICLES_CORNER_BR="Bottom right"
MOD_EASY_ARTICLES_CORNER_BL="Bottom left"
MOD_EASY_ARTICLES_SIDES_LOCK="Same value for all"
MOD_EASY_ARTICLES_SIDES_UNLOCK="Separate values"


MOD_EASY_ARTICLES_VIEW_ALL="View all"
MOD_EASY_ARTICLES_READ_MORE="Read more"
MOD_EASY_ARTICLES_EMPTY="No articles to show."
MOD_EASY_ARTICLES_PREVIOUS="Previous"
MOD_EASY_ARTICLES_NEXT="Next"
MOD_EASY_ARTICLES_GO_TO_SLIDE="Go to slide %d"
MOD_EASY_ARTICLES_ERROR_NOT_FOUND="This module is not available."

MOD_EASY_ARTICLES_STYLE_FIELDSET="Style"
MOD_EASY_ARTICLES_STYLE_NOTE="Colours and shape"
MOD_EASY_ARTICLES_STYLE_NOTE_DESC="Leave these empty and the module keeps its own colours, in light and dark mode; an empty box shows the value in use. Fill one in and only this module changes. Every colour is a CSS variable, named under it, so a site's stylesheet (or Custom CSS on the Advanced tab) can set it too."
MOD_EASY_ARTICLES_STYLE_SURFACE_LBL="Card background"
MOD_EASY_ARTICLES_STYLE_SURFACE_DESC="The cards' and the slider arrows' background. Variables: --easy-articles-surface, which follows the site's --easy-surface."
MOD_EASY_ARTICLES_STYLE_SURFACE_DARK_LBL="Card background (dark)"
MOD_EASY_ARTICLES_STYLE_SURFACE_DARK_DESC="Used when the page is in dark mode. Empty keeps the module's own dark colour."
MOD_EASY_ARTICLES_STYLE_TEXT_LBL="Text"
MOD_EASY_ARTICLES_STYLE_TEXT_DESC="Writing inside the module. Empty follows the page's own text colour. Variables: --easy-articles-surface-color, which follows the site's --easy-surface-color."
MOD_EASY_ARTICLES_STYLE_TEXT_DARK_LBL="Text (dark)"
MOD_EASY_ARTICLES_STYLE_TEXT_DARK_DESC="Used when the page is in dark mode. Empty keeps the module's own dark colour."
MOD_EASY_ARTICLES_STYLE_MUTED_LBL="Secondary text"
MOD_EASY_ARTICLES_STYLE_MUTED_DESC="Text that should recede: the date line and the empty-state message. Variables: --easy-articles-muted, which follows the site's --easy-muted-color."
MOD_EASY_ARTICLES_STYLE_MUTED_DARK_LBL="Secondary text (dark)"
MOD_EASY_ARTICLES_STYLE_MUTED_DARK_DESC="Used when the page is in dark mode. Empty keeps the module's own dark colour."
MOD_EASY_ARTICLES_STYLE_HAIRLINE_LBL="Lines and borders"
MOD_EASY_ARTICLES_STYLE_HAIRLINE_DESC="Card outlines and the line under the tabs. Variables: --easy-articles-hairline, which follows the site's --easy-hairline."
MOD_EASY_ARTICLES_STYLE_HAIRLINE_DARK_LBL="Lines and borders (dark)"
MOD_EASY_ARTICLES_STYLE_HAIRLINE_DARK_DESC="Used when the page is in dark mode. Empty keeps the module's own dark colour."
MOD_EASY_ARTICLES_STYLE_ACCENT_LBL="Accent"
MOD_EASY_ARTICLES_STYLE_ACCENT_DESC="The active tab, the arrows, the active dot, 'Read more' and the view-all link. Variables: --mod-easy-articles-accent, which follows the site's --easy-action-primary-bg."
MOD_EASY_ARTICLES_STYLE_ACCENT_DARK_LBL="Accent (dark)"
MOD_EASY_ARTICLES_STYLE_ACCENT_DARK_DESC="Used when the page is in dark mode. Empty keeps the module's own dark colour."
