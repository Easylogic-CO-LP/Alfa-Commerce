MOD_EASY_ARTICLES_LOOK_FOLD_TAB_DESC="Anything set here applies to this tab only. An empty setting follows the module's Style tab."
MOD_EASY_ARTICLES_LOOK_DEVICES="Screen"
MOD_EASY_ARTICLES_LOOK_DEVICE_ALL="All screens"
MOD_EASY_ARTICLES_LOOK_DEVICE_TABLET="Tablet"
MOD_EASY_ARTICLES_LOOK_DEVICE_MOBILE="Mobile"
MOD_EASY_ARTICLES_LOOK_VARIABLES="CSS variables:"
MOD_EASY_ARTICLES_STYLE_GROUP_COLOURS="Colours"
MOD_EASY_ARTICLES_CARD_BODY_PADDING_LBL="Text padding (px)"
MOD_EASY_ARTICLES_CARD_BODY_PADDING_DESC="The space around the card's text on each side: top, right, bottom, left. The lock sets all four at once. Empty = 16 px; an overlay card leaves 48 px where its gradient fades into the image."
MOD_EASY_ARTICLES_CUSTOM_CSS_LBL="Custom CSS"
MOD_EASY_ARTICLES_CUSTOM_CSS_DESC="Your own CSS, added to the page after the module's, so it wins. Start a rule with .mod-easy-articles-ID (the module's id, from the Modules list) to reach this module only. A card is .teaser, with .teaser-image, .teaser-body, .teaser-title, .teaser-meta (.teaser-date, .teaser-category, .teaser-author), .teaser-intro and .teaser-more inside it."
MOD_EASY_ARTICLES_CUSTOM_CSS_HINT=".mod-easy-articles-123 .teaser-title { letter-spacing: 0.02em; }"
MOD_EASY_ARTICLES_CUSTOM_JS_LBL="Custom JavaScript"
MOD_EASY_ARTICLES_CUSTOM_JS_DESC="Your own script, added to the page with the module. Plain JavaScript, without script tags."
MOD_EASY_ARTICLES_CARD_PER_VIEW_LBL="Cards per view"
MOD_EASY_ARTICLES_CARD_PER_VIEW_DESC="How many cards a slider shows side by side. Every screen has its own number: until you set one for a breakpoint it shows 2 up to a tablet's width and 1 on anything narrower than 768 px, whatever wider screens show."
MOD_EASY_ARTICLES_CARD_SPACING_LBL="Space between slides (px)"
MOD_EASY_ARTICLES_CARD_SPACING_DESC="The space between a slider's cards."
MOD_EASY_ARTICLES_CARD_AUTOPLAY_LBL="Autoplay (seconds)"
MOD_EASY_ARTICLES_CARD_AUTOPLAY_DESC="The slider moves on by itself after this many seconds; it waits while the pointer is over it or it holds keyboard focus, and never plays for a visitor who asked for reduced motion. Empty or 0 = off."
MOD_EASY_ARTICLES_CARD_LOOP_LBL="Loop"
MOD_EASY_ARTICLES_CARD_LOOP_DESC="After the last card the slider starts again from the first."
MOD_EASY_ARTICLES_CARD_ARROWS_LBL="Arrows"
MOD_EASY_ARTICLES_CARD_ARROWS_DESC="The previous and next arrows. They are never shown where every card fits."
MOD_EASY_ARTICLES_CARD_DOTS_LBL="Dots"
MOD_EASY_ARTICLES_CARD_DOTS_DESC="One dot per position, under the slider. They are never shown where every card fits."
MOD_EASY_ARTICLES_CARD_TITLE_SIZE_LBL="Title size"
MOD_EASY_ARTICLES_CARD_TITLE_SIZE_DESC="The font size of the title: a number and its unit (px, em, rem or %). Empty = as the site's stylesheet sets it."
MOD_EASY_ARTICLES_CARD_HINT_OFF="Off"
MOD_EASY_ARTICLES_CARD_HINT_INHERITED="inherited"
MOD_EASY_ARTICLES_LOOK_UNIT="Unit"
MOD_EASY_ARTICLES_STYLE_GROUP_LOOK="Grid or slider, and cards"
MOD_EASY_ARTICLES_CARD_META_SIZE_LBL="Date line size"
MOD_EASY_ARTICLES_CARD_META_SIZE_DESC="The font size of the line with the date, the category and the author: a number and its unit. Empty = as the site's stylesheet sets it."
MOD_EASY_ARTICLES_CARD_INTRO_SIZE_LBL="Intro text size"
MOD_EASY_ARTICLES_CARD_INTRO_SIZE_DESC="The font size of the intro text: a number and its unit. Empty = as the site's stylesheet sets it."
MOD_EASY_ARTICLES_CARD_MORE_SIZE_LBL="Read more size"
MOD_EASY_ARTICLES_CARD_MORE_SIZE_DESC="The font size of the read more link: a number and its unit. Empty = as the site's stylesheet sets it."
MOD_EASY_ARTICLES_LOOK_GROUP_DISPLAY="Grid or slider"
MOD_EASY_ARTICLES_CARD_DISPLAY_LBL="Show as"
MOD_EASY_ARTICLES_CARD_DISPLAY_DESC="A grid of cards, or a slider. The same on every screen: the page is built with it."
MOD_EASY_ARTICLES_CARD_DISPLAY_GRID="Grid"
MOD_EASY_ARTICLES_CARD_DISPLAY_SLIDER="Slider"
MOD_EASY_ARTICLES_CARD_COLUMNS_LBL="Columns"
MOD_EASY_ARTICLES_CARD_COLUMNS_DESC="How many cards a grid shows in a row. Every screen has its own number: until you set one for a breakpoint it shows 2 on tablets and 1 on mobiles, whatever wider screens show."
MOD_EASY_ARTICLES_CARD_GAP_LBL="Gap (px)"
MOD_EASY_ARTICLES_CARD_GAP_DESC="Space between the cards of a grid."
