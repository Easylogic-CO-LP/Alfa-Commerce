MOD_EASY_ARTICLES_LOOK_NOTE_UP_TO="Screens up to %dpx: what you fill in here changes there; the rest stays as on wider screens."
MOD_EASY_ARTICLES_LOOK_FIXED="The same on every screen: the page is built with it."
