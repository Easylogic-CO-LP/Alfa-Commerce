; Alfa Catalog module (free)

MOD_ALFA_CATALOG="Alfa Catalog"
MOD_ALFA_CATALOG_DESC="Shows products, categories or manufacturers as a grid, a slider or a list. Each tab has its own selection: products (all, on sale, new arrivals, best sellers, recently viewed; by category, manufacturer or label), categories (chosen ones or the ones inside a category, also as a navigation tree) or manufacturers. Several tabs show as a tab strip."
