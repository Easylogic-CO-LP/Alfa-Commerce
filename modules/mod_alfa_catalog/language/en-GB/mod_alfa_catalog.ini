MOD_ALFA_CATALOG_LOOK_INHERIT_TAB="- Module default -"
MOD_ALFA_CATALOG_LOOK_INHERIT_WIDER="- As on wider screens -"
MOD_ALFA_CATALOG_LOOK_NOTE_EVERY_SCREEN="Every screen. Pick a breakpoint to set anything again just for it."
MOD_ALFA_CATALOG_LOOK_NOTE_UP_TO="Screens up to %dpx: what you fill in here changes there; the rest stays as on wider screens."
MOD_ALFA_CATALOG_LOOK_FIXED="The same on every screen: the page is built with it."
MOD_ALFA_CATALOG_LOOK_FOLD_TAB="Grid, slider or list, and card settings for this tab"
MOD_ALFA_CATALOG_LOOK_FOLD_TAB_DESC="Anything set here applies to this tab only. An empty setting follows the module's Style tab."
MOD_ALFA_CATALOG_LOOK_DEVICES="Screen"
MOD_ALFA_CATALOG_LOOK_DEVICE_ALL="All screens"
MOD_ALFA_CATALOG_LOOK_VARIABLES="CSS variables:"
MOD_ALFA_CATALOG_STYLE_GROUP_COLOURS="Colours"
MOD_ALFA_CATALOG_CUSTOM_CSS_LBL="Custom CSS"
MOD_ALFA_CATALOG_CUSTOM_CSS_DESC="Your own CSS, added to the page after the module's, so it wins. Start a rule with .mod-alfa-catalog-ID (the module's id, from the Modules list) to reach this module only. A card is .item-card, with .item-card-image, .item-card-body and .item-card-title inside it, and data-kind says whether it is a product, a category or a manufacturer. A list row is .entry, with .entry-link, .entry-image, .entry-name and .entry-count inside it."
MOD_ALFA_CATALOG_CUSTOM_CSS_HINT=".mod-alfa-catalog-123 .item-card-title { letter-spacing: 0.02em; }"
MOD_ALFA_CATALOG_CUSTOM_JS_LBL="Custom JavaScript"
MOD_ALFA_CATALOG_CUSTOM_JS_DESC="Your own script, added to the page with the module. Plain JavaScript, without script tags."
MOD_ALFA_CATALOG_LOOK_DEVICE_TABLET="Tablet"
MOD_ALFA_CATALOG_LOOK_DEVICE_MOBILE="Mobile"
MOD_ALFA_CATALOG_CARD_PER_VIEW_LBL="Cards per view"
MOD_ALFA_CATALOG_CARD_PER_VIEW_DESC="How many cards a slider shows side by side. Every screen has its own number: until you set one for a breakpoint it shows 2 up to a tablet's width and 1 on anything narrower than 768 px, whatever wider screens show."
MOD_ALFA_CATALOG_CARD_SPACING_LBL="Space between slides (px)"
MOD_ALFA_CATALOG_CARD_SPACING_DESC="The space between a slider's cards."
MOD_ALFA_CATALOG_CARD_AUTOPLAY_LBL="Autoplay (seconds)"
MOD_ALFA_CATALOG_CARD_AUTOPLAY_DESC="The slider moves on by itself after this many seconds; it waits while the pointer is over it or it holds keyboard focus, and never plays for a visitor who asked for reduced motion. Empty or 0 = off."
MOD_ALFA_CATALOG_CARD_LOOP_LBL="Loop"
MOD_ALFA_CATALOG_CARD_LOOP_DESC="After the last card the slider starts again from the first."
MOD_ALFA_CATALOG_CARD_ARROWS_LBL="Arrows"
MOD_ALFA_CATALOG_CARD_ARROWS_DESC="The previous and next arrows. They are never shown where every card fits."
MOD_ALFA_CATALOG_CARD_DOTS_LBL="Dots"
MOD_ALFA_CATALOG_CARD_DOTS_DESC="One dot per position, under the slider. They are never shown where every card fits."
MOD_ALFA_CATALOG_CARD_TITLE_SIZE_LBL="Name size"
MOD_ALFA_CATALOG_CARD_TITLE_SIZE_DESC="The font size of the item name: a number and its unit (px, em, rem or %). Empty = as the site's stylesheet sets it."
MOD_ALFA_CATALOG_CARD_HINT_OFF="Off"
MOD_ALFA_CATALOG_CARD_HINT_INHERITED="inherited"
MOD_ALFA_CATALOG_LOOK_UNIT="Unit"
MOD_ALFA_CATALOG_STYLE_GROUP_LOOK="Grid, slider or list, and cards"
MOD_ALFA_CATALOG_LOOK_GROUP_DISPLAY="Grid, slider or list"
MOD_ALFA_CATALOG_CARD_DISPLAY_LBL="Show as"
MOD_ALFA_CATALOG_CARD_DISPLAY_DESC="A grid of cards, a slider of cards, or a list of plain rows. The same on every screen: the page is built with it. A list of the categories inside a category is a navigation tree."
MOD_ALFA_CATALOG_CARD_DISPLAY_GRID="Grid"
MOD_ALFA_CATALOG_CARD_DISPLAY_SLIDER="Slider"
MOD_ALFA_CATALOG_CARD_COLUMNS_LBL="Columns"
MOD_ALFA_CATALOG_CARD_COLUMNS_DESC="How many cards a grid shows in a row. Every screen has its own number: until you set one for a breakpoint it shows 2 on tablets and 1 on mobiles, whatever wider screens show."
MOD_ALFA_CATALOG_CARD_GAP_LBL="Gap (px)"
MOD_ALFA_CATALOG_CARD_GAP_DESC="Space between the cards of a grid."
MOD_ALFA_CATALOG_ITEM_UNNAMED="Item %s"
MOD_ALFA_CATALOG_ERROR_REQUEST_VALUE="The tab could not be loaded: the request sent a list where one value is expected."

