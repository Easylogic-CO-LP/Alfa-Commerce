MOD_ALFA_CATALOG_MAN_LIMIT_LBL="How many"
MOD_ALFA_CATALOG_MAN_LIMIT_DESC="The most manufacturers to show. 0 shows them all. With a number set, the View all link leads to the rest."
MOD_ALFA_CATALOG_MAN_SHOW_COUNT_LBL="Number of products"
MOD_ALFA_CATALOG_MAN_SHOW_COUNT_DESC="Show with each manufacturer how many products of the shop it has."
MOD_ALFA_CATALOG_CARD_DISPLAY_LIST="List"
