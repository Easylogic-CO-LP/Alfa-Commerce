MOD_ALFA_CATALOG_KIND_DESC="What this tab shows: products, categories or manufacturers. The options below change with the choice."
MOD_ALFA_CATALOG_KIND_PRODUCTS="Products"
MOD_ALFA_CATALOG_KIND_CATEGORIES="Categories"
MOD_ALFA_CATALOG_KIND_MANUFACTURERS="Manufacturers"
MOD_ALFA_CATALOG_MANUFACTURERS_LBL="Manufacturers"
MOD_ALFA_CATALOG_MANUFACTURERS_DESC="Only products of these manufacturers, whatever the source. None: every manufacturer."
MOD_ALFA_CATALOG_MANUFACTURERS_HINT="- Any manufacturer -"
MOD_ALFA_CATALOG_AUTO_LBL="One tab for each"
MOD_ALFA_CATALOG_AUTO_DESC="Makes several tabs from this one row: one tab for each category, manufacturer or label chosen above, every one of them, named after it and showing its products, with the source, the order and the number set here. Only the first tab is loaded with the page, the others when opened. With nothing chosen the row stays one tab."
MOD_ALFA_CATALOG_AUTO_NONE="- No, one tab -"
MOD_ALFA_CATALOG_AUTO_CATEGORY="Chosen category"
MOD_ALFA_CATALOG_AUTO_MANUFACTURER="Chosen manufacturer"
