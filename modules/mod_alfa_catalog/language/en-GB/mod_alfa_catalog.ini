MOD_ALFA_CATALOG_CAT_SELECT_LBL="Which categories"
MOD_ALFA_CATALOG_CAT_SELECT_DESC="The categories inside a category (or the shop's main categories), or the ones you choose."
MOD_ALFA_CATALOG_CAT_SELECT_CHILDREN="Inside a category"
MOD_ALFA_CATALOG_CAT_SELECT_CHOSEN="Chosen categories"
MOD_ALFA_CATALOG_CAT_PARENT_LBL="Start from"
MOD_ALFA_CATALOG_CAT_PARENT_DESC="The categories shown are the ones inside this category. Top level shows the shop's main categories."
MOD_ALFA_CATALOG_CAT_PARENT_TOP="Top level"
MOD_ALFA_CATALOG_CAT_IDS_LBL="Categories"
MOD_ALFA_CATALOG_CAT_IDS_DESC="The categories to show."
MOD_ALFA_CATALOG_CAT_ORDERING_LBL="Order"
MOD_ALFA_CATALOG_CAT_ORDERING_DESC="In the order of the Categories list, or by name."
MOD_ALFA_CATALOG_CAT_ORDERING_ORDERING="As in the Categories list"
MOD_ALFA_CATALOG_CAT_ORDERING_NAME="Name"
MOD_ALFA_CATALOG_CAT_LIMIT_LBL="How many"
MOD_ALFA_CATALOG_CAT_LIMIT_DESC="The most categories to show; in a tree, the most at its first level. 0 shows them all. With a number set, the View all link leads to the page of the category they are inside, where the rest are; the top level has no page of its own, so there the number is all a visitor sees."
MOD_ALFA_CATALOG_CAT_SHOW_COUNT_LBL="Number of products"
MOD_ALFA_CATALOG_CAT_SHOW_COUNT_DESC="Show with each category how many products it holds, its subcategories included."
MOD_ALFA_CATALOG_CAT_SHOW_DESC_LBL="Description"
MOD_ALFA_CATALOG_CAT_SHOW_DESC_DESC="Show the start of the category's description on its card (grid and slider)."
MOD_ALFA_CATALOG_CAT_LEVELS_LBL="Levels (list)"
MOD_ALFA_CATALOG_CAT_LEVELS_DESC="For a tab shown as a list: how many levels of categories the tree shows, from 1 to 10. The tree reads one level at a time, and below the first level only the categories that are open."
MOD_ALFA_CATALOG_CAT_OPEN_LBL="Open (list)"
MOD_ALFA_CATALOG_CAT_OPEN_DESC="For a tab shown as a list: which categories show the categories inside them, only the ones leading to the category the visitor is in, or all of them. The visitor's category is always marked."
MOD_ALFA_CATALOG_CAT_OPEN_CURRENT="The visitor's category"
MOD_ALFA_CATALOG_CAT_OPEN_ALL="All"
MOD_ALFA_CATALOG_MAN_IDS_LBL="Manufacturers"
MOD_ALFA_CATALOG_MAN_IDS_DESC="The manufacturers to show. Leave empty to show every manufacturer the shop shows."
