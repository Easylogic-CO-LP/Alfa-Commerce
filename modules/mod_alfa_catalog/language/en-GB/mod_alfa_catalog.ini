; Alfa Catalog module (free): tabs of products, categories or manufacturers, as a grid, a slider or a list.

MOD_ALFA_CATALOG="Alfa Catalog"
MOD_ALFA_CATALOG_DESC="Shows products, categories or manufacturers as a grid, a slider or a list. Each tab has its own selection: products (all, on sale, new arrivals, best sellers, recently viewed; by category, manufacturer or label), categories (chosen ones or the ones inside a category, also as a navigation tree) or manufacturers. Several tabs show as a tab strip."
MOD_ALFA_CATALOG_TABS_LBL="Tabs"
MOD_ALFA_CATALOG_TABS_DESC="Each row is one listing with its own selection. One row shows alone; two or more show as tabs, in this order."
MOD_ALFA_CATALOG_BESTSELLERS_DAYS_LBL="Best sellers period (days)"
MOD_ALFA_CATALOG_BESTSELLERS_DAYS_DESC="Count the units sold in the last N days. 0 = all time. Cancelled orders never count."
MOD_ALFA_CATALOG_BESTSELLERS_CACHE_LBL="Refresh the best-sellers ranking every (minutes)"
MOD_ALFA_CATALOG_BESTSELLERS_CACHE_DESC="The sales ranking is recomputed at most this often; the items themselves are always shown live, with current prices and stock. 0 = recompute on every page view."
MOD_ALFA_CATALOG_CARD_IMAGE_FIT_LBL="Image fit"
MOD_ALFA_CATALOG_CARD_IMAGE_FIT_DESC="Cover: the item image fills its frame and its edges are trimmed. Contain: the whole image shows inside the frame. Original shape: no frame, every image keeps its own shape, so cards in a row can differ in height."
MOD_ALFA_CATALOG_CARD_IMAGE_FIT_COVER="Cover"
MOD_ALFA_CATALOG_CARD_IMAGE_FIT_CONTAIN="Contain"
MOD_ALFA_CATALOG_CARD_IMAGE_FIT_NATURAL="Original shape"
MOD_ALFA_CATALOG_CARD_IMAGE_RATIO_LBL="Image frame"
MOD_ALFA_CATALOG_CARD_IMAGE_RATIO_DESC="The shape of the image frame (Cover and Contain). On an overlay card it is the card's smallest height: a longer name and buy form make the card taller."
MOD_ALFA_CATALOG_CARD_IMAGE_RATIO_16_9="16:9 (wide)"
MOD_ALFA_CATALOG_CARD_IMAGE_RATIO_16_10="16:10"
MOD_ALFA_CATALOG_CARD_IMAGE_RATIO_4_3="4:3"
MOD_ALFA_CATALOG_CARD_IMAGE_RATIO_1_1="1:1 (square)"
MOD_ALFA_CATALOG_CARD_IMAGE_RATIO_3_4="3:4 (portrait)"
MOD_ALFA_CATALOG_CARD_IMAGE_FOCUS_LBL="Crop focus"
MOD_ALFA_CATALOG_CARD_IMAGE_FOCUS_DESC="Which part of a trimmed image stays in view (Cover)."
MOD_ALFA_CATALOG_CARD_IMAGE_FOCUS_CENTER="Centre"
MOD_ALFA_CATALOG_CARD_IMAGE_FOCUS_TOP="Top"
MOD_ALFA_CATALOG_CARD_TITLE_LINES_LBL="Name lines"
MOD_ALFA_CATALOG_CARD_TITLE_LINES_DESC="A longer item name ends with an ellipsis after this many lines. 0 = no limit. The whole name stays in the page for search engines and screen readers."
MOD_ALFA_CATALOG_CARD_RADIUS_LBL="Card corners (px)"
MOD_ALFA_CATALOG_CARD_RADIUS_DESC="How round the card's corners are, each on its own: top left, top right, bottom right, bottom left. The lock sets all four at once. Empty or 0 = square."
MOD_ALFA_CATALOG_CARD_IMAGE_RADIUS_LBL="Image corners (px)"
MOD_ALFA_CATALOG_CARD_IMAGE_RADIUS_DESC="How round the item image's corners are on a standard card, each on its own: top left, top right, bottom right, bottom left. The lock sets all four at once. Empty or 0 = square. An overlay card's image fills the card, so Card corners round it."

MOD_ALFA_CATALOG_TAB_LABEL_LBL="Label"
MOD_ALFA_CATALOG_TAB_LABEL_DESC="The tab's title. Empty = what the tab shows: the category names, or the name of the source or of the kind. A language key is translated. A row that makes one tab per category, manufacturer or label names each tab after its own."
MOD_ALFA_CATALOG_TAB_LABEL_HINT="Auto"
MOD_ALFA_CATALOG_SOURCE_LBL="Which products"
MOD_ALFA_CATALOG_SOURCE_DESC="Items: the catalogue, or the chosen categories, in the chosen order. On sale: only items with an active discount. New arrivals: only the products the shop counts as new (Options, General, Products). Best sellers and Recently viewed keep their own ranking."
MOD_ALFA_CATALOG_SOURCE_ITEMS="Items"
MOD_ALFA_CATALOG_SOURCE_ON_SALE="On sale"
MOD_ALFA_CATALOG_SOURCE_NEW="New arrivals"
MOD_ALFA_CATALOG_SOURCE_BEST_SELLERS="Best sellers"
MOD_ALFA_CATALOG_SOURCE_RECENTLY_VIEWED="Recently viewed"
MOD_ALFA_CATALOG_LABELS_LBL="Labels"
MOD_ALFA_CATALOG_LABELS_DESC="Only products that tick one of these labels (Labels, in the menu), whatever the source. None: every product."
MOD_ALFA_CATALOG_LABELS_HINT="- Any label -"
MOD_ALFA_CATALOG_CATEGORIES_LBL="Categories"
MOD_ALFA_CATALOG_CATEGORIES_DESC="None = the whole catalogue. One category = that category's listing. Several = the products of all of them. Subcategories follow the catalogue's Include Subcategories setting."
MOD_ALFA_CATALOG_CATEGORIES_HINT="All categories"
MOD_ALFA_CATALOG_ORDERING_LBL="Order"
MOD_ALFA_CATALOG_ORDERING_DESC="Applies to Items and On sale; Best sellers and Recently viewed keep their own ranking."
MOD_ALFA_CATALOG_ORDER_NEWEST="Newest first"
MOD_ALFA_CATALOG_ORDER_OLDEST="Oldest first"
MOD_ALFA_CATALOG_ORDER_CUSTOM_ASC="Custom order (first to last)"
MOD_ALFA_CATALOG_ORDER_CUSTOM_DESC="Custom order (last to first)"
MOD_ALFA_CATALOG_ORDER_NAME_ASC="Name (A-Z)"
MOD_ALFA_CATALOG_ORDER_NAME_DESC="Name (Z-A)"
MOD_ALFA_CATALOG_ORDER_PRICE_ASC="Price (low to high)"
MOD_ALFA_CATALOG_ORDER_PRICE_DESC="Price (high to low)"
MOD_ALFA_CATALOG_ORDER_DISCOUNT_AMOUNT_DESC="Biggest saving first"
MOD_ALFA_CATALOG_ORDER_DISCOUNT_PERCENT_DESC="Highest discount % first"
MOD_ALFA_CATALOG_LIMIT_LBL="Number of products"
MOD_ALFA_CATALOG_LIMIT_DESC="Products shown in this tab, from 1 to 60."
MOD_ALFA_CATALOG_TAB_LINK_LBL="View all link"
MOD_ALFA_CATALOG_TAB_LINK_DESC="A link below the tab. Products: one category leads to that category's page, several to the catalogue filtered to them, none to the whole catalogue, with the manufacturers, the labels, the sale filter and the order of this tab; best sellers and recently viewed link to their single category only. Categories inside a category lead to that category's page. Manufacturers lead to the shop's Manufacturers page."
MOD_ALFA_CATALOG_TAB_CARD_LBL="Card settings"
MOD_ALFA_CATALOG_CARD_STYLE_LBL="Card style"
MOD_ALFA_CATALOG_CARD_STYLE_DESC="Standard: the image above the name and the buy form. Overlay: the image fills the card and the name and the buy form sit over it on a dark gradient."
MOD_ALFA_CATALOG_CARD_STYLE_STANDARD="Standard"
MOD_ALFA_CATALOG_CARD_STYLE_OVERLAY="Overlay"
MOD_ALFA_CATALOG_CARD_TEXT_POSITION_LBL="Text position"
MOD_ALFA_CATALOG_CARD_TEXT_POSITION_DESC="Where the name and the buy form sit on an overlay card."
MOD_ALFA_CATALOG_CARD_TEXT_POSITION_BOTTOM="Bottom"
MOD_ALFA_CATALOG_CARD_TEXT_POSITION_MIDDLE="Middle"
MOD_ALFA_CATALOG_CARD_TEXT_POSITION_TOP="Top"
MOD_ALFA_CATALOG_CARD_OVERLAY_BACKGROUND_LBL="Overlay background"
MOD_ALFA_CATALOG_CARD_OVERLAY_BACKGROUND_DESC="What the name and the buy form sit on in an overlay card: any CSS background, such as a colour (#000000cc) or a gradient. Empty = the module's gradient, shown in the box (for text at the bottom; it runs the other way at the top, and is a plain band in the middle)."
MOD_ALFA_CATALOG_CARD_IMAGE_POSITION_LBL="Image position"
MOD_ALFA_CATALOG_CARD_IMAGE_POSITION_DESC="Where the image sits on a standard card: above the name and the buy form, beside them on the left or the right, or under them."
MOD_ALFA_CATALOG_CARD_IMAGE_POSITION_TOP="Top"
MOD_ALFA_CATALOG_CARD_IMAGE_POSITION_LEFT="Left"
MOD_ALFA_CATALOG_CARD_IMAGE_POSITION_RIGHT="Right"
MOD_ALFA_CATALOG_CARD_IMAGE_POSITION_BOTTOM="Bottom"
MOD_ALFA_CATALOG_CARD_IMAGE_WIDTH_LBL="Image width (%)"
MOD_ALFA_CATALOG_CARD_IMAGE_WIDTH_DESC="For an image on the left or the right: its share of the card's width, from 10 to 90. Empty = 40."
MOD_ALFA_CATALOG_CARD_IMAGE_HEIGHT_LBL="Max image height (px)"
MOD_ALFA_CATALOG_CARD_IMAGE_HEIGHT_DESC="The tallest an item image may be. Empty or 0 = no limit."
MOD_ALFA_CATALOG_CARD_IMAGE_FOCUS_BOTTOM="Bottom"
MOD_ALFA_CATALOG_CARD_IMAGE_FOCUS_LEFT="Left"
MOD_ALFA_CATALOG_CARD_IMAGE_FOCUS_RIGHT="Right"
MOD_ALFA_CATALOG_CARD_TITLE_WEIGHT_LBL="Name weight"
MOD_ALFA_CATALOG_CARD_TITLE_WEIGHT_DESC="How heavy the item name's letters are. Empty keeps the weight the site's stylesheet gives it."
MOD_ALFA_CATALOG_CARD_TITLE_WEIGHT_300="Light (300)"
MOD_ALFA_CATALOG_CARD_TITLE_WEIGHT_400="Normal (400)"
MOD_ALFA_CATALOG_CARD_TITLE_WEIGHT_500="Medium (500)"
MOD_ALFA_CATALOG_CARD_TITLE_WEIGHT_600="Semi-bold (600)"
MOD_ALFA_CATALOG_CARD_TITLE_WEIGHT_700="Bold (700)"
MOD_ALFA_CATALOG_CARD_TITLE_WEIGHT_800="Extra-bold (800)"
MOD_ALFA_CATALOG_CARD_SHADOW_LBL="Shadow"
MOD_ALFA_CATALOG_CARD_SHADOW_DESC="The card's shadow: any CSS box-shadow, such as 0 4px 12px rgb(0 0 0 / 0.15). Empty = none."
MOD_ALFA_CATALOG_CARD_SHADOW_HOVER_LBL="Shadow on hover"
MOD_ALFA_CATALOG_CARD_SHADOW_HOVER_DESC="The shadow while the pointer is over the card or it holds keyboard focus, eased in. Empty = no change."
MOD_ALFA_CATALOG_CARD_BORDER_LBL="Card border (px)"
MOD_ALFA_CATALOG_CARD_BORDER_DESC="The card's border width on each side: top, right, bottom, left. 0 removes it on that side, so a border on one side only makes a separator. The lock sets all four at once. Empty = the module's own 1 px line."
MOD_ALFA_CATALOG_SIDE_TOP="Top"
MOD_ALFA_CATALOG_SIDE_RIGHT="Right"
MOD_ALFA_CATALOG_SIDE_BOTTOM="Bottom"
MOD_ALFA_CATALOG_SIDE_LEFT="Left"
MOD_ALFA_CATALOG_CORNER_TL="Top left"
MOD_ALFA_CATALOG_CORNER_TR="Top right"
MOD_ALFA_CATALOG_CORNER_BR="Bottom right"
MOD_ALFA_CATALOG_CORNER_BL="Bottom left"
MOD_ALFA_CATALOG_SIDES_LOCK="Same value for all"
MOD_ALFA_CATALOG_SIDES_UNLOCK="Separate values"
MOD_ALFA_CATALOG_CARD_HINT_NO_LIMIT="No limit"
MOD_ALFA_CATALOG_VIEW_ALL="View all"
MOD_ALFA_CATALOG_EMPTY="Nothing to show."
MOD_ALFA_CATALOG_PREVIOUS="Previous"
MOD_ALFA_CATALOG_NEXT="Next"
MOD_ALFA_CATALOG_GO_TO_SLIDE="Go to slide %d"
MOD_ALFA_CATALOG_ERROR_NOT_FOUND="This module is not available."

MOD_ALFA_CATALOG_STYLE_FIELDSET="Style"
MOD_ALFA_CATALOG_STYLE_NOTE="Colours and shape"
MOD_ALFA_CATALOG_STYLE_NOTE_DESC="Leave these empty and the module follows the storefront's colours, in light and dark mode, so one setting in the template moves the whole shop at once; an empty box shows the value used while the storefront sets none. Fill one in and only this module changes. Every colour is a CSS variable, named under it, so a site's stylesheet (or Custom CSS on the Advanced tab) can set it too."
MOD_ALFA_CATALOG_STYLE_SURFACE_LBL="Background"
MOD_ALFA_CATALOG_STYLE_SURFACE_DESC="The ground of the slider's arrows. Variables: --mod-alfa-catalog-surface, which follows the site's --alfa-surface."
MOD_ALFA_CATALOG_STYLE_HAIRLINE_LBL="Lines and borders"
MOD_ALFA_CATALOG_STYLE_HAIRLINE_DESC="The line under the tabs and the slider arrows' outline. Variables: --mod-alfa-catalog-hairline, which follows the site's --alfa-hairline."
MOD_ALFA_CATALOG_STYLE_ACCENT_LBL="Accent"
MOD_ALFA_CATALOG_STYLE_ACCENT_DESC="The active tab, the arrows, the active dot and the view-all link. Variables: --mod-alfa-catalog-accent, which follows the site's --alfa-action-primary-bg."

MOD_ALFA_CATALOG_STYLE_SURFACE_DARK_LBL="Background (dark)"
MOD_ALFA_CATALOG_STYLE_SURFACE_DARK_DESC="Used when the page is in dark mode. Empty keeps the module's own dark colour."
MOD_ALFA_CATALOG_STYLE_HAIRLINE_DARK_LBL="Lines and borders (dark)"
MOD_ALFA_CATALOG_STYLE_HAIRLINE_DARK_DESC="Used when the page is in dark mode. Empty keeps the module's own dark colour."
MOD_ALFA_CATALOG_STYLE_ACCENT_DARK_LBL="Accent (dark)"
MOD_ALFA_CATALOG_STYLE_ACCENT_DARK_DESC="Used when the page is in dark mode. Empty keeps the module's own dark colour."

MOD_ALFA_CATALOG_STYLE_TEXT_LBL="Text"
MOD_ALFA_CATALOG_STYLE_TEXT_DESC="Writing inside the module. Empty follows the page's own text colour. Variables: --mod-alfa-catalog-surface-color, which follows the site's --alfa-surface-color."
MOD_ALFA_CATALOG_STYLE_TEXT_DARK_LBL="Text (dark)"
MOD_ALFA_CATALOG_STYLE_TEXT_DARK_DESC="Used when the page is in dark mode. Empty keeps the module's own dark colour."

MOD_ALFA_CATALOG_STYLE_MUTED_LBL="Secondary text"
MOD_ALFA_CATALOG_STYLE_MUTED_DESC="Text that should recede: the empty-state message. Variables: --mod-alfa-catalog-muted, which follows the site's --alfa-muted-color."
MOD_ALFA_CATALOG_STYLE_MUTED_DARK_LBL="Secondary text (dark)"
MOD_ALFA_CATALOG_STYLE_MUTED_DARK_DESC="Used when the page is in dark mode. Empty keeps the module's own dark colour."
MOD_ALFA_CATALOG_CARD_PADDING_LBL="Card padding (px)"
MOD_ALFA_CATALOG_CARD_PADDING_DESC="The space inside the card on each side: top, right, bottom, left. The lock sets all four at once. Empty = 10 px. On an overlay card it is the space around the name and the buy form, which otherwise leave 3 rem where the gradient fades into the image."
MOD_ALFA_CATALOG_LOOK_GROUP_LAYOUT="Layout"
MOD_ALFA_CATALOG_LOOK_GROUP_IMAGE="Image"
MOD_ALFA_CATALOG_LOOK_GROUP_TEXT="Name"
MOD_ALFA_CATALOG_LOOK_GROUP_BOX="Border, corners and shadow"
