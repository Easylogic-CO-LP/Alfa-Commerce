name: Code Quality

on:
  pull_request:
    branches: [main, developer]
  push:
    branches: [main, developer]

jobs:
  php-cs-fixer:
    name: PHP CS Fixer
    # Auto-fix + commit only on PRs (head feature branch is pushable); a push to the
    # protected main/developer branches is rejected by the ruleset.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: php-cs-fixer

      - name: Run PHP CS Fixer
        run: php-cs-fixer fix --config=.php-cs-fixer.php --allow-risky=yes --diff

      - name: Commit fixes
        uses: stefanzweifel/git-auto-commit-action@778341af668090896ca464160c2def5d1d1a3eb0 # v6.0.1
        with:
          commit_message: "style: auto-fix code style with PHP CS Fixer"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

  copy-clean:
    name: Copy-clean
    # The shipped comments and the texts a person reads stay clean: no box banners, no em-dashes or
    # typographic artifacts, no names of other products (the rules are in the gate's docblock).
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"

      - name: Run the copy-clean gate
        run: php scripts/copy-clean/copy-clean-gate.php --package=. --allow=scripts/copy-clean/copy-clean-allow.json

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # PHP 8.3, the oldest PHP Alfa supports, and an exact PHPStan release: the same findings on every run.
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: phpstan:2.3.5

      # The installed phar is the 2.3.5 release asset, byte for byte.
      - name: Check the PHPStan release
        env:
          PHPSTAN_SHA256: 4b3ed7850a20b092331bd1040e4f54a1d3c0559b4cf006431073997ebcb4324b
        run: |
          echo "$PHPSTAN_SHA256  $(command -v phpstan)" | sha256sum --check --strict
          phpstan --version

      # An exact Joomla release, checked against the checksum Joomla publishes with it, so a new Joomla
      # release never changes what this gate reports. Raise both lines together, in a pull request.
      - name: Fetch Joomla 6.2.0 (PHPStan symbol resolution)
        env:
          JOOMLA_URL: https://github.com/joomla/joomla-cms/releases/download/6.2.0/Joomla_6.2.0-Stable-Full_Package.zip
          JOOMLA_SHA256: eaafc68b5990d7b9dd9156656d4c3c3547743d1d7a85682a92e2f9121b58f018
        run: |
          curl -fsSL -o /tmp/joomla.zip "$JOOMLA_URL"
          echo "$JOOMLA_SHA256  /tmp/joomla.zip" | sha256sum --check --strict
          mkdir -p joomla && unzip -q /tmp/joomla.zip -d joomla

      # Blocking: any finding PHPStan reports fails this job and the run.
      - name: Run PHPStan
        run: phpstan analyse --configuration=phpstan.neon --memory-limit=1G --error-format=github
