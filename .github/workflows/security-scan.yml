name: Security Scan

on:
  pull_request:
    branches: [main, developer]
  push:
    branches: [main, developer]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:javascript-typescript"

  php-security:
    # Semgrep reads the PHP that Alfa Commerce ships (the component, its plugins and modules, the
    # install script) with its PHP security rules: code run from a string, shell commands, request
    # values reaching output, SQL, files, URLs or class names, unsafe transport and weak secrets.
    # Any finding fails the job. The bundled libraries under libraries/ are not read: they are laid
    # exactly as their upstream releases, and a finding in them is answered by an upstream release.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The rules at an exact commit of their repository, so a rule added or changed there never
      # changes what this job reports. Raise the commit in a pull request, with Semgrep's version.
      - name: Fetch the Semgrep PHP rules
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: semgrep/semgrep-rules
          ref: a5ad1714f00c9f7fde980cab0ea1d6dc6d414fd2
          path: .semgrep-rules
          sparse-checkout: php/lang/security
          persist-credentials: false

      # Semgrep 1.185.0, its image pinned by digest, run with no network, so a run never sends
      # anything and every run reads the same rules with the same engine.
      # Three rules of the set flag every call of a function, whatever it is given, and are left
      # out: weak-crypto (every md5() and sha1(); Alfa uses them for cache keys and fingerprints,
      # md5-used-as-password stays on for passwords), unlink-use (every unlink() of a path held in a
      # variable; tainted-filename stays on for a path taken from the request) and unserialize-use
      # (every unserialize(); the one in Alfa reads its own cache entry with only stdClass allowed).
      - name: Run Semgrep
        run: |
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/src" -w /src \
            semgrep/semgrep:1.185.0@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d \
            semgrep scan --metrics=off --disable-version-check --error \
              --config .semgrep-rules/php/lang/security \
              --exclude-rule semgrep-rules.php.lang.security.weak-crypto \
              --exclude-rule semgrep-rules.php.lang.security.unlink-use \
              --exclude-rule semgrep-rules.php.lang.security.unserialize-use \
              administrator site api plugins modules script.php

  secret-scanning:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@3bd2b5887eb0efb8fa18bfd1d296032924e4ffdc # v3.99.9
        with:
          version: 3.99.9
          extra_args: --only-verified
