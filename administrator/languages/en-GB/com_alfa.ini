COM_ALFA_CONFIG_INVENTORY_MIN_QTY_DESC="Units subtracted from what the shop is willing to sell, so it stops selling before the shelf is actually empty: salable = physical stock - safety stock - already reserved. On its own it blocks nothing; it only lowers that number. It stops a customer only when Backorders is set to Deny: with 10 in the warehouse and a safety stock of 2, the cart then refuses to go past 8. If backorders are allowed the customer can still order any quantity; you simply start owing them one unit sooner. This value applies to EVERY item, which is why 0 is normally right here: a fixed number means very different things to an item stocked in thousands and one stocked in threes. Set it per item instead."
COM_ALFA_CONFIG_INVENTORY_OVER_SHIPMENT_LABEL="Over-shipment: may a delivery note exceed the order?"
COM_ALFA_CONFIG_INVENTORY_OVER_SHIPMENT_DESC="Compares the quantity you type on a stock-affecting document (delivery note, invoice) against the quantity on the order line it is issued for. Partial shipments are normal and add up: 4 now and 6 next week against an order of 10 is fine. What this catches is the second note written for 10 when 8 has already gone: 18 shipped against an order of 10. No stock check would notice: if you hold 500 the deduction is perfectly valid and the ledger balances; you have simply given away 8 units nobody paid for. Reject refuses the whole document and rolls back every line."
COM_ALFA_CONFIG_INVENTORY_OVER_SHIPMENT_STRICT="Reject: refuse the document, change nothing"
COM_ALFA_CONFIG_INVENTORY_OVER_SHIPMENT_ALLOW_WARN="Allow, and write a warning to the log"
COM_ALFA_CONFIG_INVENTORY_NEGATIVE_PHYSICAL_LABEL="Allow negative physical stock"
COM_ALFA_CONFIG_INVENTORY_NEGATIVE_PHYSICAL_DESC="Checked when goods actually leave, not when they are ordered. Off means a deduction cannot push a location below zero: you may accept a backorder for 10 while holding 3, but you cannot ship all 10 until the stock arrives. Leave this off unless your stock counts are maintained outside Alfa; it is what keeps the ledger honest."

