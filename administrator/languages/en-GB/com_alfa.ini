; Search engines
COM_ALFA_CONFIG_TAB_SEARCH="Search"
; Tools: rebuild a search engine's index. Owned by the component, not by any engine:
; the operation is identical whichever engine is installed, and a merchant reading two
; different descriptions of the same button would reasonably expect two different
; jobs. An engine that wants its own name on the button ships its own label key.
COM_ALFA_SEARCH_REBUILD_LABEL="Rebuild search index"
COM_ALFA_SEARCH_REBUILD_DESC="Rebuilds the prepared copy of your catalogue that the search engine reads. Runs in chunks and is safe on large catalogues: the current index keeps serving customers until the new one is complete, and items edited while it runs are picked up before the switch. Use after changing what is searchable in Options &rarr; Search, after a bulk import, or after restoring a database."
COM_ALFA_SEARCH_REBUILD_OWED="The search settings have changed since this index was built, so it no longer matches what you asked to be searchable. Until you rebuild, customers are served from the live item tables instead: the same results, just slower."
COM_ALFA_SEARCH_REBUILD_DONE="Search index rebuilt: %1$d items indexed. In addition to names, codes and item field values, it now covers: %2$s."
COM_ALFA_SEARCH_REBUILD_CORE_ONLY="nothing further"
COM_ALFA_SEARCH_PART_ALIASES="aliases"
COM_ALFA_SEARCH_PART_MANUFACTURERS="manufacturer names"
COM_ALFA_SEARCH_PART_CATEGORIES="category names"
COM_ALFA_SEARCH_PART_SHORT_DESC="short descriptions"
COM_ALFA_SEARCH_PART_FULL_DESC="full descriptions"
COM_ALFA_SEARCH_PART_META_TEXT="meta titles and meta descriptions"
COM_ALFA_SEARCH_REBUILD_FAILED="The search index could not be rebuilt: %s. The previous index is untouched and customers are unaffected."

COM_ALFA_CONFIG_SEARCH_ENGINE="Search engine"
COM_ALFA_CONFIG_SEARCH_ENGINE_DESC="Which engine answers catalogue searches. The database search is built into Alfa Commerce, needs nothing installed and always works: it reads the item tables directly and covers item names, item and variant codes, searchable field values and whatever the settings below declare searchable; right for most shops. A search engine plugin adds itself to this list, answers the same settings faster on a large catalogue and reads prepared, cleaned text. If a chosen engine becomes unavailable or its index falls out of date, the database search answers instead, so search never stops working."
COM_ALFA_CONFIG_SEARCH_ENGINE_AUTO="Database search (built into Alfa Commerce)"
COM_ALFA_CONFIG_SEARCH_ENGINE_NOT_READY="not ready"

; Search: engine capabilities
COM_ALFA_CONFIG_SEARCH_CAPABILITY_NOTE="What the search engine adds"
COM_ALFA_CONFIG_SEARCH_CAPABILITY_NOTE_DESC="Every mode finds the same items for the same settings below; that never changes with the engine. What a higher engine adds is understanding of the query: the database search matches text as typed; an indexed engine answers the same coverage faster; the Enterprise engine also ranks by relevance and offers type-ahead suggestions, including turning a query typed in Latin characters into the native-script word to search for. Suggestions appear in the search module only while an engine that provides them is selected and its index is built."

; Search: what the index covers
COM_ALFA_CONFIG_SEARCH_INDEX_NOTE="What customers can search for"
COM_ALFA_CONFIG_SEARCH_INDEX_NOTE_DESC="Item names, item and variant codes (SKU, GTIN, MPN) and searchable item field values are always covered and cannot be switched off. The settings below decide everything else, and every search mode honours them. The database search reads the description column as it is stored (formatted text included), so it can occasionally match a word that is part of the formatting rather than the visible text. A search engine prepares descriptions at indexing time (formatting removed, text cleaned), so it answers the same setting more precisely and faster; with an engine, changes below take effect after its index is rebuilt."
COM_ALFA_CONFIG_SEARCH_INDEX_ALIASES="Search aliases (URL slugs)"
COM_ALFA_CONFIG_SEARCH_INDEX_ALIASES_DESC="Every item, brand, category and field value carries an alias: the form of its name used in web addresses, written without accents and in Latin letters. Searching aliases lets a query typed without accents, or in Latin characters, still find the item. On by default; switch off only if your aliases carry wording you do not want searched, in which case names are matched exactly as written."
COM_ALFA_CONFIG_SEARCH_INDEX_MANUFACTURERS="Search manufacturer names"
COM_ALFA_CONFIG_SEARCH_INDEX_MANUFACTURERS_DESC="Customers searching for a brand find that brand's items, even when the brand is not part of the item name. Unpublished manufacturers are never searchable. A manufacturer whose name has not been translated into a language is not searchable in that language."
COM_ALFA_CONFIG_SEARCH_INDEX_CATEGORIES="Search category names"
COM_ALFA_CONFIG_SEARCH_INDEX_CATEGORIES_DESC="Off by default, because the database search has no way to rank results: searching for a category name returns everything in that category, which can bury the one item actually named that way. Useful in small catalogues, or where customers search by category wording that does not appear in item names."
COM_ALFA_CONFIG_SEARCH_INDEX_SHORT_DESC="Search short descriptions"
COM_ALFA_CONFIG_SEARCH_INDEX_SHORT_DESC_DESC="Finds items by wording that appears in the short description but not in the name. Every added word also makes common search terms match more items, so results become broader and less precise. Up to 4000 characters per item per language are searched. With the database search this reads the stored column text; an engine reads cleaned, prepared text."
COM_ALFA_CONFIG_SEARCH_INDEX_FULL_DESC="Search full descriptions"
COM_ALFA_CONFIG_SEARCH_INDEX_FULL_DESC_DESC="The widest possible search, and the biggest loss of precision: with long descriptions, everyday words appear in almost every item and stop narrowing anything down. Turn on when customers search for specifications or details that appear nowhere else. Up to 4000 characters per item per language are searched. With the database search this reads the stored column text; an engine reads cleaned, prepared text."
COM_ALFA_CONFIG_SEARCH_INDEX_META_TEXT="Search meta title and meta description"
COM_ALFA_CONFIG_SEARCH_INDEX_META_TEXT_DESC="Meta text is written for search engines rather than for customers, and is often repeated across many items, so it can match far more than intended. Turn on only if your meta text carries wording that customers actually search for. With the database search this reads the stored column text; an engine reads cleaned, prepared text."
COM_ALFA_CONFIG_STOCK_ACTION_LABEL="Default stock action"
COM_ALFA_CONFIG_STOCK_ACTION_DESC="What the storefront does with an item that has no salable stock. Every item set to &quot;From configuration&quot; follows this setting."

