COM_ALFA_INVENTORY_AUDIT_CORRECT_BTN="Record a correction"
COM_ALFA_INVENTORY_AUDIT_CORRECT_HINT="Records a new resolution that takes the place of this one; the recorded one is kept. Possible only while no stock has been reserved or moved for the line on its recorded stock identity since the resolution was recorded."
COM_ALFA_INVENTORY_AUDIT_PRIORITISE_BTN="Serve this order first"
COM_ALFA_INVENTORY_AUDIT_PRIORITISE_REASON="Why order #%d is served first (required)"
COM_ALFA_INVENTORY_AUDIT_PRIORITISE_HINT="Moves every open reservation of the order ahead of the other reservations on the stock records it stands on, recorded under your name with your reason. The stock on hand then covers it first, and the reservations it moves ahead of wait for stock where the stock no longer covers them. Its stock movements still owed are applied at once where the stock allows; no other stock moves."
COM_ALFA_INVENTORY_AUDIT_PRIORITISE_REASON_REQUIRED="A reason is required to serve an order first."
COM_ALFA_INVENTORY_AUDIT_PRIORITISE_REFUSED="Order #%1$d was not served first: %2$s"
COM_ALFA_INVENTORY_AUDIT_PRIORITISE_BUSY="Order #%d was not served first: its stock was in use by another stock change at that moment, so nothing was changed. Try again."
COM_ALFA_INVENTORY_AUDIT_PRIORITISE_NOTHING="Order #%d already comes first on every stock record its reservations stand on; nothing was changed."
COM_ALFA_INVENTORY_AUDIT_PRIORITISE_DONE="Order #%1$d is now served first (operation %2$s) on %3$d stock records, before %4$s. Those reservations wait for stock where the stock on hand no longer covers them."
