COM_ALFA_RECORD_REFUND_PENDING_UNKNOWN="the payment provider has not completed refund %1$s yet (reported %2$s), and its amount cannot be reserved exactly in the order's currency: it is recorded once the provider settles it. Until then no new refund starts on this order, unless the provider reports that it failed or was cancelled"
