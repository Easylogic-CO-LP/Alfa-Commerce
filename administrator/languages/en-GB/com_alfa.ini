COM_ALFA_REFUND_RESERVATIONS_TITLE="Reserved: refunds not completed yet"
COM_ALFA_REFUND_RESERVATIONS_INTRO="Each amount below is reserved: it is kept out of what this order can still refund until its refund is completed (it is then recorded once) or fails or is cancelled (it is then released). It is not refunded money in the books yet and never marks a payment refunded, so Record this refund waits for the provider. A new refund may start for what is left, and on a payment for no more than that payment has left."
