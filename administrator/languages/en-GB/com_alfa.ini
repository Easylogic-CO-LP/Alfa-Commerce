COM_ALFA_DOCUMENT_POSITIONS_NOTE_TITLE="How layouts, positions and sections work"
COM_ALFA_DOCUMENT_POSITIONS_NOTE_BODY="<p>The selected <strong>rendering layout</strong> is the page design used to print, PDF and email this series' documents. It defines <strong>positions</strong> (editable text slots, each shown below as one editor per language) and <strong>sections</strong>, the structural blocks (header, buyer details, lines, totals, footer) rendered from the frozen document data. Choosing a different layout refreshes the editors below automatically.</p><p><strong>Tokens</strong> such as <code>{number}</code> or <code>{buyer_name}</code> can be inserted into any position; select a token chip to add it. They are replaced with the document's frozen data whenever it renders.</p><p><strong>Sections &amp; the eye toggle.</strong> Each structural block carries an eye button: switch it off to leave that section out of this series' documents (all languages). The block's data stays frozen on the document; only the printout changes. Section labels themselves are translations; reword one globally via <em>System -> Manage -> Language Overrides</em>.</p><p><strong>Customising the design.</strong> The layouts ship with the component, so edit them through a template override rather than the originals (overrides survive updates). Go to <em>System -> Templates -> Administrator templates</em>, open your active admin template (currently <strong>%1$s</strong>), open its <em>Create Overrides</em> tab, then choose <em>Layouts -> com_alfa -> documents</em>; Joomla copies the folder into the template for you to edit (the invoice lives in <code>documents/core/invoice/default.php</code>, shared blocks in <code>documents/partials/</code>). By hand instead: create <code>administrator/templates/%1$s/html/layouts/com_alfa/documents/...</code> and copy the file there.</p><p><strong>Your own layout &amp; positions.</strong> Drop a new PHP file next to a type's <code>default.php</code> (say <code>branded.php</code>) and it appears in the layout list automatically as <em>Branded</em>. Inside it, call <code>$position('banner')</code> / <code>$hasPosition('banner')</code> for each text slot you want (every one becomes an editor here) and <code>$render('documents.partials.lines')</code> for each structural block (every one gets an eye toggle). Optional naming constants, update-safe via Language Overrides (Location: <em>Administrator</em>): <code>COM_ALFA_DOCUMENT_LAYOUT_BRANDED</code> for the picker label, and for a position named <code>banner</code>: <code>COM_ALFA_DOCUMENT_POSITION_BANNER</code> (editor label) and <code>COM_ALFA_DOCUMENT_DEFAULT_BANNER</code> (default content, seeded into new series and written by <em>Restore defaults</em>).</p><p><strong>PDF-safe HTML.</strong> These pages are also rendered to PDF by dompdf, which understands a CSS 2.1 subset: use tables and floats for layout and the DejaVu Sans font. Flexbox, grid, external images/fonts and JavaScript silently break the PDF while the browser print looks fine; always check the PDF button after design changes.</p><p>If you switch layouts and the previous one had positions the new one does not, any content already written is preserved under a <em>Carried over</em> section so it can be moved into a current position. Clear it and save to remove it.</p>"
