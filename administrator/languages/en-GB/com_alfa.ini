COM_ALFA_INVENTORY_AUDIT_WRITEOFF_REFUSED_OPEN_LINES="The stock held on %1$s cannot be written off while %2$d open order lines whose stock moves against it still need it: %3$s. Fulfil or cancel those orders first."
COM_ALFA_INVENTORY_AUDIT_WRITEOFF_REFUSED_CURRENT="%s is still part of the current catalogue, so it cannot be written off here; change its stock in the item's editor instead."
