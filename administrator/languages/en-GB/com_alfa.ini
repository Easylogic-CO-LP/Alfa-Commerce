COM_ALFA_PAYMENT_REFUND_REQUEST_FIXED="Refund #%1$d is a refund request its payment gateway sent, not settled yet: it is not settled here, and its reference and amount are not changed here. Its gateway books it when the payment provider confirms it; a provider refund report on the payment goes through Record this refund, reconcile to an existing refund, or a duplicate or invalid report. It may still be set failed or cancelled once the provider shows that nothing was refunded."
