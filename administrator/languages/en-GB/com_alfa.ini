; Reset to default and Clear everything (Tools, Reset and clear)
COM_ALFA_ACCESS_DATA_CLEAR="Clear Alfa data"
COM_ALFA_ACCESS_DATA_CLEAR_DESC="Allows users in this group to run Clear everything in Tools (core's Alfa tables and the purchased files are removed, every installed Alfa plugin clears its own data, and a fresh installation of Alfa Commerce is made again) and to clear one extension's data in Tools, Extensions. Granted to no group: only a Super User can do it until a Super User grants it."
COM_ALFA_TOOLS_TAB_DATA="Reset and clear"
COM_ALFA_TOOLS_RESET_DESC="Gives the Alfa Options back the values an installation writes, and rebuilds the price display of every customer group from them. The next page lists every setting that would change before anything is changed. No catalogue, customer, order, document, payment, stock or other data, and no file, is touched."
COM_ALFA_TOOLS_RESET_BTN="Reset to default"
COM_ALFA_TOOLS_RESET_NOT_PERMITTED="Reset to default takes the Tools permission and the Configure permission of Alfa Commerce."
COM_ALFA_TOOLS_CLEAR_DESC="Removes core's Alfa tables and the purchased files, runs the Clear Data of every installed Alfa plugin that supports it, then makes a fresh installation of Alfa Commerce again: the shop keeps Alfa and its extensions installed at their versions, without any previous shop data. The next page lists exactly what would be removed and, for each Alfa plugin, whether it supports Clear Data and, when the plugin describes it, what it clears and keeps."
COM_ALFA_TOOLS_CLEAR_BTN="Clear everything"
COM_ALFA_TOOLS_CLEAR_NOT_PERMITTED="Clear everything takes the permission to clear Alfa data, which a Super User grants."

COM_ALFA_RESET_TITLE="Reset to default"
COM_ALFA_RESET_INTRO_TITLE="Keep the shop and its data, restore the default settings"
COM_ALFA_RESET_INTRO_DESC="The Alfa Options get back the values an installation of this version writes; an Option without an installed value is removed, so it uses its built-in default. The download store stays where it is, the delivery destination keeps the mapping the shop has, and the record of the menu items the setup created is kept. Every customer group gets the default price display and follows the shop's Options again. Nothing else changes: no catalogue, customer, order, document, payment, stock or history data, no file, scheduled task, guided tour, permission or setting of another extension."
