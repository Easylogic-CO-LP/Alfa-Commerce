; Tools: catalogue projections (search has its own tool, contributed by the engine plugin)
COM_ALFA_TOOLS_PROJECTIONS_TITLE="Rebuild catalogue projections"
COM_ALFA_TOOLS_PROJECTIONS_DESC="Rebuilds the prepared price and item-field data that filtering and sorting read. Use after a bulk import, after changing prices or discounts in the database directly, or if filters look out of date. Use it also after customers or customer groups were changed anywhere but in Users > Groups and the user edit screen (for example with Batch or an import), so that list prices follow the customers' groups (a combination of groups it finds new is then prepared by the scheduled task: see List prices for customer groups). Runs in chunks, safe for large catalogues. Search has its own tool, provided by whichever search engine you have installed."
COM_ALFA_TOOLS_PROJECTIONS_DONE="Catalogue projections rebuilt: prices and item field values refreshed for %d items."
COM_ALFA_TOOLS_PRICE_SETS_TITLE="List prices for customer groups"
COM_ALFA_TOOLS_PRICE_SETS_DESC="Customers whose groups carry prices of their own (a price, a discount or a tax for a customer group) are sorted and filtered by figures prepared for their combination of groups. A combination nobody held before is prepared by the scheduled task &quot;Alfa - Prepare list prices for customer groups&quot; (System &rarr; Scheduled Tasks), never while a customer, a group or a rule is being saved. Until it is prepared, its customers see every item at its correct price, but a price filter, &quot;on sale&quot; and &quot;save at least&quot; show them no item, the price slider is hidden and sorting by price follows the catalogue order (by item). An item whose price cannot be computed is left out of the combination until it is saved again. The button shows the current state; it prepares nothing."
COM_ALFA_TOOLS_PRICE_SETS_WAITING="%1$d combination(s) of customer groups wait to be prepared, the oldest since %2$s: %3$s."
COM_ALFA_TOOLS_PRICE_SETS_SET="%1$s (%2$d%% done)"
COM_ALFA_TOOLS_PRICE_SETS_NO_GROUP="no customer group"
COM_ALFA_TOOLS_PRICE_SETS_NONE_WAITING="Nothing waits: the list prices of every combination of customer groups are prepared."
COM_ALFA_TOOLS_PRICE_SETS_NEVER_RUN="The scheduled task has not run yet."
COM_ALFA_TOOLS_PRICE_SETS_LEFT_OUT="%1$d item(s) could not be priced when a combination of customer groups was prepared, so its customers see no list figure for them (item ids: %2$s). Saving such an item prices it again; the log of the scheduled task names the error."
COM_ALFA_TOOLS_PRICE_SETS_LAST_RUN_OK="The scheduled task last ran on %1$s and finished."
COM_ALFA_TOOLS_PRICE_SETS_LAST_RUN_RESUME="The scheduled task last ran on %1$s and will go on at its next run."
COM_ALFA_TOOLS_PRICE_SETS_LAST_RUN_FAILED="The scheduled task last ran on %1$s and failed (exit code %2$d); see its log under System &rarr; Scheduled Tasks."
COM_ALFA_TOOLS_PRICE_SETS_NO_TASK="No scheduled task prepares them on its own: under System &rarr; Scheduled Tasks, create one of the type &quot;Alfa - Prepare list prices for customer groups&quot; with a schedule (not Manual), or enable the one there is."
COM_ALFA_TOOLS_STOCK_EFFECTS_TITLE="Apply outstanding stock movements"
COM_ALFA_TOOLS_STOCK_EFFECTS_DESC="An order status change or an issued document changes stock straight away. If that failed or was cut off, the movement is kept and waits here. Runs in chunks, and never applies the same movement twice."
COM_ALFA_TOOLS_STOCK_EFFECTS_OWED="Some stock movements were never applied. Run this to apply them."
COM_ALFA_TOOLS_STOCK_EFFECTS_DONE="All stock movements are applied."
COM_ALFA_TOOLS_STOCK_EFFECTS_REMAINING="%d stock movement(s) could not be applied. Open the order's activity log to see why, fix the cause, and run this again."
COM_ALFA_NOTIFY_STOCK_ORDER_TITLE="Order #%d: stock was not adjusted"
COM_ALFA_NOTIFY_STOCK_ORDER_MSG="The order changed status but its stock movement failed (%s). Go to Tools -> Database Sync and run Apply outstanding stock movements. This notice clears itself once the movement is applied."
COM_ALFA_NOTIFY_STOCK_DOCUMENT_TITLE="Document %s: stock was not adjusted"
COM_ALFA_NOTIFY_STOCK_DOCUMENT_MSG="The document was issued but its stock movement failed (%s). Go to Tools -> Database Sync and run Apply outstanding stock movements. This notice clears itself once the movement is applied."
COM_ALFA_NOTIFY_STOCK_STRANDED_TITLE="Stock movements still owed"
COM_ALFA_NOTIFY_STOCK_STRANDED_MSG="%d stock movement(s) were never applied, usually because a request was interrupted. Go to Tools -> Database Sync and run Apply outstanding stock movements."

