; com_alfa: System language file (en-GB)
; Loaded OUTSIDE the running component: the Components admin menu/submenu,
; the Extensions install/uninstall manager, and the "New Menu Item" dialog.
; Runtime page strings belong in com_alfa.ini, not here.

; Extension
COM_ALFA="Alfa Commerce"
COM_ALFA_XML_DESCRIPTION="The smartest, fastest and easiest ecommerce solution for companies, developed with love by Easylogic."

; Installer refusals (script.php preflight)
; A clean install has no com_alfa language on disk when preflight runs, so
; script.php carries the same English wording as a fallback.
COM_ALFA_INSTALL_ERROR_MINIMUM_JOOMLA="Alfa Commerce %1$s requires Joomla %2$s or newer; this site runs Joomla %3$s. Update Joomla first, then install Alfa Commerce again. Nothing was installed and the site was not modified."
COM_ALFA_INSTALL_ERROR_UNTESTED_JOOMLA="Alfa Commerce %1$s is tested on Joomla %2$s only; this site runs Joomla %3$s, which it is not tested on yet. Nothing was installed and the site was not modified."
COM_ALFA_INSTALL_ERROR_MINIMUM_PHP="Alfa Commerce %1$s requires PHP %2$s or newer; this site runs PHP %3$s. Nothing was installed and the site was not modified."
COM_ALFA_INSTALL_ERROR_PHP_EXTENSIONS="Alfa Commerce %1$s requires the PHP extensions %2$s; this site's PHP is missing %3$s. Enable the missing extensions, then install Alfa Commerce again. Nothing was installed and the site was not modified."
COM_ALFA_INSTALL_ERROR_CLEAN_INSTALL_ONLY="Alfa Commerce %1$s requires a clean installation and cannot upgrade the Alfa Commerce %2$s already on this site. Nothing was modified: no file was replaced and no database change was made. Remove the existing installation and install %1$s fresh."
COM_ALFA_INSTALL_ERROR_KEPT_DATA_UNMARKED="Alfa Commerce %1$s requires a clean installation and cannot use the Alfa Commerce tables an earlier version left in this site's database (their names start with %2$s). Nothing was modified: no file was replaced and no database change was made. Back up the database, delete those tables, then install %1$s again."
COM_ALFA_INSTALL_ERROR_KEPT_DATA_SCHEMA="Alfa Commerce %1$s cannot reconnect the Alfa Commerce data kept in this site's database: its tables are at database schema %2$s, and this package installs schema %3$s. Reinstalling does not convert a database. Nothing was modified: no file was replaced and no database change was made. Install Alfa Commerce %2$s to reconnect the data, then update it."
COM_ALFA_INSTALL_COMPLETED_UNFINISHED="Alfa Commerce %1$s found an installation that had stopped before it finished, and completed its database tables; existing tables and rows were left as they were."
COM_ALFA_INSTALL_ERROR_UNFINISHED="Alfa Commerce %1$s found an installation that had stopped before it finished, and could not complete its database tables: the database refused a statement of the installation SQL. No file was replaced. Correct the cause, then install %1$s again."

