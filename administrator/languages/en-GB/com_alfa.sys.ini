; com_alfa: System language file (en-GB)
; Loaded OUTSIDE the running component: the Components admin menu/submenu,
; the Extensions install/uninstall manager, and the "New Menu Item" dialog.
; Runtime page strings belong in com_alfa.ini, not here.

; Extension
COM_ALFA="Alfa Commerce"
COM_ALFA_XML_DESCRIPTION="The smartest, fastest and easiest ecommerce solution for companies, developed with love by Easylogic."

; Installer refusals (script.php preflight)
; A clean install has no com_alfa language on disk when preflight runs, so
; script.php carries the same English wording as a fallback.
COM_ALFA_INSTALL_ERROR_MINIMUM_JOOMLA="Alfa Commerce %1$s requires Joomla %2$s or newer; this site runs Joomla %3$s. Update Joomla first, then install Alfa Commerce again. Nothing was installed and the site was not modified."
COM_ALFA_INSTALL_ERROR_UNTESTED_JOOMLA="Alfa Commerce %1$s is tested on Joomla %2$s only; this site runs Joomla %3$s, which it is not tested on yet. Nothing was installed and the site was not modified."
COM_ALFA_INSTALL_ERROR_MINIMUM_PHP="Alfa Commerce %1$s requires PHP %2$s or newer; this site runs PHP %3$s. Nothing was installed and the site was not modified."
COM_ALFA_INSTALL_ERROR_PHP_EXTENSIONS="Alfa Commerce %1$s requires the PHP extensions %2$s; this site's PHP is missing %3$s. Enable the missing extensions, then install Alfa Commerce again. Nothing was installed and the site was not modified."
COM_ALFA_INSTALL_ERROR_OLDER_LINE="Alfa Commerce %1$s updates Alfa Commerce %3$s or later, and this site has Alfa Commerce %2$s. Update it to Alfa Commerce %4$s first, then install %1$s. Nothing was modified: no file was replaced and no database change was made."
COM_ALFA_INSTALL_ERROR_KEPT_DATA_UNMARKED="Alfa Commerce %1$s requires a clean installation and cannot use the Alfa Commerce tables an earlier version left in this site's database (their names start with %2$s). Nothing was modified: no file was replaced and no database change was made. Back up the database, delete those tables, then install %1$s again."
COM_ALFA_INSTALL_ERROR_KEPT_DATA_SCHEMA="Alfa Commerce %1$s cannot reconnect the Alfa Commerce data kept in this site's database: its tables are at database schema %2$s, and this package installs schema %3$s. Reinstalling does not convert a database. Nothing was modified: no file was replaced and no database change was made. Install Alfa Commerce %2$s to reconnect the data, then update it."
COM_ALFA_INSTALL_COMPLETED_UNFINISHED="Alfa Commerce %1$s found an installation that had stopped before it finished, and completed its database tables; existing tables and rows were left as they were."
COM_ALFA_INSTALL_ERROR_UNFINISHED="Alfa Commerce %1$s found an installation that had stopped before it finished, and could not complete its database tables: the database refused a statement of the installation SQL. No file was replaced. Correct the cause, then install %1$s again."
COM_ALFA_INSTALL_RESET_UNFINISHED="Alfa Commerce is in maintenance after an unfinished Clear everything: run it again in Tools > Reset and clear. The installation steps that write Alfa data were left to it."
COM_ALFA_INSTALL_ERROR_RESET_SCHEMA="Alfa Commerce %1$s could not prepare its update over the unfinished Clear everything: %2$s No file was replaced and no table was changed."
COM_ALFA_INSTALL_CRON_KEY_FAILED="Alfa Commerce %1$s could not make the web cron's key: %2$s The cron command still runs the background work."
COM_ALFA_INSTALL_WORK_DECLARATIONS_FAILED="Alfa Commerce %1$s could not write the background work it declares: %2$s Install the package again."

COM_ALFA_INSTALL_PLACE_RULES_REBUILD="Alfa Commerce %1$s: a discount or a tax scoped to a place now reaches every place inside it, as the shipping taxes already did; the shipping taxes now follow the goods' order. The product list's prices are being rebuilt in the background (Tools > Tasks). Until that ends, for a customer whose place is inside a place with its own discounts or taxes, the product list may sort and filter by the earlier prices, while the product pages and the cart already show the new ones."
COM_ALFA_INSTALL_PLACE_RULES_REBUILD_FAILED="Alfa Commerce %1$s could not start the rebuild of the product list's prices: %2$s Run Rebuild catalogue projections in Tools, so the product list follows the discounts and taxes that now reach the places inside theirs."
COM_ALFA_INSTALL_PLACE_RULES_REACH="These published rules are scoped to a place that has published places inside it, and now reach those places too: discounts %1$s; taxes %2$s."
COM_ALFA_INSTALL_PLACE_RULES_REACH_NONE="none"
COM_ALFA_INSTALL_PLACES_SEED_FAILED="Alfa Commerce %1$s could not bring the countries up to ISO 3166-1: %2$s The places are as they were."

; The update builds the price index again, the previous one read until the new one is complete (script.php postflight)
COM_ALFA_INSTALL_PRICE_INDEX_BUILD="Alfa Commerce %1$s builds the product list's price index again, for every combination of each product and every period: %2$d items, in the background (Tools &gt; Rebuild catalogue projections shows how far it is). Until it is complete, the product list filters and sorts by the prices of the version before; it then switches by itself."
COM_ALFA_INSTALL_PRICE_VALUES_FAILED="Alfa Commerce %1$s could not store the product prices as exact decimals: %2$s Install the package again."
COM_ALFA_INSTALL_META_VALUES_FAILED="Alfa Commerce %1$s could not widen the facts table for the price check's stored findings: %2$s Install the package again."
COM_ALFA_INSTALL_PRICE_INDEX_BUILD_FAILED="Alfa Commerce %1$s could not prepare the product list's price index: %2$s Install the package again."

; The update raises a thumbnail size stored below 500 x 500 (script.php postflight).
COM_ALFA_INSTALL_THUMBNAIL_BOX_RAISED="Alfa Commerce %1$s: the thumbnail size stored in Options > Images was %2$d x %3$d, below the default of 500 x 500, and is now %4$d x %5$d. New images get thumbnails of the new size; Tools, Media, Create missing thumbnails makes the smaller thumbnails already made again at it."
COM_ALFA_INSTALL_THUMBNAIL_BOX_FAILED="Alfa Commerce %1$s could not check the thumbnail size stored in Options > Images: %2$s If it is below 500 x 500, set it there."
; The update owes the rebuild of the list prices of products sold from more than one piece (script.php postflight)
; The update owes the rebuild of the list prices of products sold from more than one piece (script.php postflight)
COM_ALFA_INSTALL_SKU_REGISTRY_DUPLICATES="Alfa Commerce %1$s: a SKU now names one product or variant. These SKUs are held by more than one, and the REST API cannot find them until each has its own (the setup checklist lists them): %2$s."
COM_ALFA_INSTALL_SKU_REGISTRY_FAILED="Alfa Commerce %1$s could not list the SKUs in use: %2$s Run the update again; until then the REST API may not find a product or a variant by its SKU."
COM_ALFA_INSTALL_PLACES_SEED_NONE="none"
COM_ALFA_INSTALL_PLACES_SEED="Alfa Commerce %1$s brought the countries up to ISO 3166-1. Corrected where the shop had not changed them, each keeping its number: %2$s. Added, unpublished: %3$s. The places inside Greece (its 13 regions and Mount Athos) and inside Spain (the Canary Islands, Ceuta and Melilla) are not added by the update: in Countries/States, select Greece or Spain and press Add subdivisions to add them, unpublished."
COM_ALFA_INSTALL_PLACES_SEED_KEPT="These countries were left as the shop changed them: %s."
COM_ALFA_INSTALL_PLACES_SEED_KEPT_SHIPS="(shipped as %s)"
COM_ALFA_INSTALL_PLACES_SEED_CURRENCY_SET="#%1$s %2$s (default currency %3$s)"
COM_ALFA_INSTALL_PLACES_SEED_KEPT_CURRENCY="#%1$s %2$s (shipped with the default currency %3$s)"
COM_ALFA_INSTALL_PLACES_SEED_NOT_ISO="These rows are not ISO 3166-1 countries and were kept, since addresses, prices and rules may name them: %s. The Netherlands Antilles were dissolved in 2010 (now Bonaire, Sint Eustatius and Saba, Curaçao and Sint Maarten), the second East Timor is Timor-Leste, St. Eustatius is part of Bonaire, Sint Eustatius and Saba, and the Canary Islands are a part of Spain: move what names them to the country it belongs to (the Canary Islands to the place of that name inside Spain, once added), then unpublish them."
COM_ALFA_INSTALL_PLACES_SEED_LARISA="The place #%1$d %2$s, inside Greece, came from Alfa Commerce's own test data and is no longer shipped. It was kept, since addresses, prices and rules may name it. Once Greece's regions are added, publish Thessaly and then move it under Thessaly, or unpublish it if the shop does not use it."
COM_ALFA_INSTALL_PLACES_SEED_CURRENCIES="The default currency of these countries was left as it is, though the one shipped was withdrawn or missing; set it in Countries/States if the shop sells there: %s."

; The update removes the files earlier versions left in Alfa Commerce's folders (script.php postflight)
COM_ALFA_INSTALL_OBSOLETE_REMOVED="Alfa Commerce %1$s removed these files, which an earlier version left in its folders and this version no longer ships: %2$s."
COM_ALFA_INSTALL_OBSOLETE_FOLDERS="Alfa Commerce %1$s also removed the folders those files leave empty: %2$s."
COM_ALFA_INSTALL_OBSOLETE_KEPT="Alfa Commerce %1$s kept these files, which an earlier version left in its folders and this version no longer ships: their content is not what a release installed, so they stay for you to check in Tools > Security: %2$s."
COM_ALFA_INSTALL_OBSOLETE_FAILED="Alfa Commerce %1$s could not remove these files, which an earlier version left in its folders and this version no longer ships: %2$s. Remove them by hand; Tools > Security lists them until they are gone."
COM_ALFA_INSTALL_OBSOLETE_UNREAD="Alfa Commerce %1$s removed none of the files earlier versions left in its folders: it could not read which files this package installs (%2$s). Tools > Security lists any that remain."
COM_ALFA_INSTALL_OBSOLETE_LANGUAGE_KEPT="Alfa Commerce %1$s kept these language files, which an earlier version installed and this version no longer ships: their content is not what that version installed, so they may be yours. Remove them by hand if you do not need them: %2$s."
COM_ALFA_INSTALL_OBSOLETE_LANGUAGE_FAILED="Alfa Commerce %1$s could not remove these language files, which an earlier version installed and this version no longer ships: %2$s. Remove them by hand."

; The update lists the files among the product images that are not images, deleting nothing.
COM_ALFA_INSTALL_THUMBNAILS_NOT_IMAGES="Alfa Commerce %1$s found files among the product images that are not images: %2$s. Such a file may be a copy of a file of the site that a thumbnail once named, published for anyone to download. Nothing was deleted: look at each file and, if it is not yours to publish, delete it by hand and choose a new thumbnail for the rows named."
COM_ALFA_INSTALL_EMAIL_LAYOUTS_SITE_TEMPLATE="Alfa Commerce %1$s reads the e-mail layout overrides from the default administrator template only. These files in a site template are no longer read: %2$s. Copy each one you want to keep into the same subfolder (order or partials) under %3$s. Nothing was moved or deleted."
COM_ALFA_INSTALL_LEFTOVER_COLUMNS_FAILED="Alfa Commerce %1$s could not drop columns no code reads: %2$s. The shop works with them; the next installation drops them."
COM_ALFA_INSTALL_NEW_COLUMNS_FAILED="Alfa Commerce %1$s could not add columns this version needs: %2$s. Install the package again; the pages that read them need them."
COM_ALFA_INSTALL_NEW_TABLES_FAILED="Alfa Commerce %1$s could not create tables this version needs: %2$s. Install the package again; the pages that read them need them."

; The update keeps a plugin of the package that staff disabled disabled, and names it.
COM_ALFA_INSTALL_PLUGINS_KEPT_DISABLED="Alfa Commerce %1$s kept these plugins of its package disabled, as they were before the update: %2$s. Enable one in System > Manage > Plugins if the shop needs it."
; The installation and the update name the installed Alfa extensions not known to work with this version.


; The uninstall removes every Alfa Commerce language pack through Joomla's installer (script.php uninstall)
COM_ALFA_UNINSTALL_LANGUAGE_PACKS_REMOVED="Alfa Commerce %1$s also uninstalled these language packs, which only work with it: %2$s."
COM_ALFA_UNINSTALL_LANGUAGE_PACKS_FAILED="Alfa Commerce %1$s could not uninstall these language packs: %2$s. Uninstall them in System > Manage > Extensions."
COM_ALFA_UNINSTALL_LANGUAGE_PACKS_NO_MANIFEST="This language pack does not include a package manifest."
COM_ALFA_UNINSTALL_LANGUAGE_PACKS_FILES_LEFT="Alfa Commerce %1$s uninstalled these language packs, but some files could not be removed: %2$s. Remove the remaining files manually. The maintenance log (com_alfa_maintenance.php) lists the files that could not be deleted."
COM_ALFA_UNINSTALL_LANGUAGE_PACKS_ERROR="Alfa Commerce %1$s did not uninstall its language packs, because looking for them failed: %2$s. Uninstall them in System > Manage > Extensions."

; An Alfa Commerce language pack installed or updated while Joomla's own language of its tag is missing
COM_ALFA_LANGUAGE_PACK_NO_JOOMLA_LANGUAGE="The Alfa Commerce language pack for %1$s is installed, but Joomla's own %1$s language is not installed here (%2$s). Install it in System > Install > Languages: Alfa Commerce shows the pack's texts once Joomla's own language is installed and used."

