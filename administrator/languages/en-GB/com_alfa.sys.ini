; com_alfa: System language file (en-GB)
; Loaded OUTSIDE the running component: the Components admin menu/submenu,
; the Extensions install/uninstall manager, and the "New Menu Item" dialog.
; Runtime page strings belong in com_alfa.ini, not here.

; Extension
COM_ALFA="Alfa Commerce"
COM_ALFA_XML_DESCRIPTION="The smartest, fastest and easiest ecommerce solution for companies, developed with love by Easylogic."

; Installer refusals (script.php preflight)
; A clean install has no com_alfa language on disk when preflight runs, so
; script.php carries the same English wording as a fallback.
COM_ALFA_INSTALL_ERROR_MINIMUM_JOOMLA="Alfa Commerce %1$s requires Joomla %2$s or newer; this site runs Joomla %3$s. Update Joomla first, then install Alfa Commerce again. Nothing was installed and the site was not modified."
COM_ALFA_INSTALL_ERROR_UNTESTED_JOOMLA="Alfa Commerce %1$s is tested on Joomla %2$s only; this site runs Joomla %3$s, which it is not tested on yet. Nothing was installed and the site was not modified."
COM_ALFA_INSTALL_ERROR_MINIMUM_PHP="Alfa Commerce %1$s requires PHP %2$s or newer; this site runs PHP %3$s. Nothing was installed and the site was not modified."
COM_ALFA_INSTALL_ERROR_PHP_EXTENSIONS="Alfa Commerce %1$s requires the PHP extensions %2$s; this site's PHP is missing %3$s. Enable the missing extensions, then install Alfa Commerce again. Nothing was installed and the site was not modified."
COM_ALFA_INSTALL_ERROR_CLEAN_INSTALL_ONLY="Alfa Commerce %1$s requires a clean installation and cannot upgrade the Alfa Commerce %2$s already on this site. Nothing was modified: no file was replaced and no database change was made. Remove the existing installation and install %1$s fresh."
COM_ALFA_INSTALL_ERROR_KEPT_DATA_UNMARKED="Alfa Commerce %1$s requires a clean installation and cannot use the Alfa Commerce tables an earlier version left in this site's database (their names start with %2$s). Nothing was modified: no file was replaced and no database change was made. Back up the database, delete those tables, then install %1$s again."
COM_ALFA_INSTALL_ERROR_KEPT_DATA_SCHEMA="Alfa Commerce %1$s cannot reconnect the Alfa Commerce data kept in this site's database: its tables are at database schema %2$s, and this package installs schema %3$s. Reinstalling does not convert a database. Nothing was modified: no file was replaced and no database change was made. Install Alfa Commerce %2$s to reconnect the data, then update it."
COM_ALFA_INSTALL_COMPLETED_UNFINISHED="Alfa Commerce %1$s found an installation that had stopped before it finished, and completed its database tables; existing tables and rows were left as they were."
COM_ALFA_INSTALL_ERROR_UNFINISHED="Alfa Commerce %1$s found an installation that had stopped before it finished, and could not complete its database tables: the database refused a statement of the installation SQL. No file was replaced. Correct the cause, then install %1$s again."
COM_ALFA_INSTALL_RESET_UNFINISHED="Alfa Commerce is in maintenance after an unfinished Clear everything: run it again in Tools > Reset and clear. The installation steps that write Alfa data were left to it."
COM_ALFA_INSTALL_NOTIFICATIONS_KEYED="Notifications written before this version: %1$d now show in each administrator's language; %2$d keep their text as written."
COM_ALFA_INSTALL_ERROR_RESET_SCHEMA="Alfa Commerce %1$s could not prepare its update over the unfinished Clear everything: %2$s No file was replaced and no table was changed."
COM_ALFA_INSTALL_ERROR_LINK_REPEATS="Alfa Commerce %1$s could not prepare its link tables for the update: %2$s No file was replaced and no table was changed. Correct the cause, then update again."

; The update moves the former shipping Options onto each shipping method (script.php postflight)
COM_ALFA_INSTALL_SHIPPING_OPTIONS_MOVED="Alfa Commerce: each shipping method now holds its own Shipping taxes and Shipping prices entered. %1$d of the %2$d shipping methods named no tax rules of their own and now hold the former Default shipping taxes: %3$s. Every method enters its prices %4$s, as the former Options did. Both Options were removed."
COM_ALFA_INSTALL_SHIPPING_TAXES_NONE="none, so they charge no shipping tax"
COM_ALFA_INSTALL_SHIPPING_TAXES_RULES="tax rules %s"
COM_ALFA_INSTALL_SHIPPING_PRICES_TAX_EXCLUDED="tax excluded"
COM_ALFA_INSTALL_SHIPPING_PRICES_TAX_INCLUDED="tax included"
COM_ALFA_INSTALL_ERROR_SHIPPING_OPTIONS="Alfa Commerce could not move Default shipping taxes and Shipping prices entered onto the shipping methods, and changed none of them: %1$s. Both Options were kept, and the move runs again when Alfa Commerce is installed again. Until then, check the Shipping taxes and Shipping prices entered of every shipping method before taking orders."
COM_ALFA_NOTIFY_SHIPPING_MOVE_FAILED_TITLE="Shipping tax is not applied as configured"
COM_ALFA_NOTIFY_SHIPPING_MOVE_FAILED_MSG="An update could not move Default shipping taxes and Shipping prices entered onto the shipping methods, so both Options were kept. Until the move completes, shipping tax is not applied as they configured it: each shipping method uses only its own Shipping taxes and Shipping prices entered. The move runs again at the next install or update of Alfa Commerce, and this notice goes when it completes. Until then, check the Shipping taxes and Shipping prices entered of every shipping method before taking orders."

; The install repairs the layout choices that 2.0 saved with the template name html (script.php postflight)
COM_ALFA_INSTALL_LAYOUTS_MAPPED="Alfa Commerce: %1$d layout choice(s) saved with the template name html now name their template, so their pages show that template's layout: %2$s."
COM_ALFA_INSTALL_LAYOUTS_LEFT="Alfa Commerce left %1$d layout choice(s) saved with the template name html as they are, because it could not tell which template holds the layout: %2$s. Pick each again in its form; until then its page shows the component's own layout."
COM_ALFA_INSTALL_LAYOUT_LEFT_NONE="no template has %1$s"
COM_ALFA_INSTALL_LAYOUT_LEFT_SEVERAL="the templates %1$s all have %2$s"
COM_ALFA_INSTALL_LAYOUT_LEFT_HTML_FOLDER="this site has a template folder named html"
COM_ALFA_INSTALL_LAYOUT_AT_ITEM="%1$s of item #%2$d"
COM_ALFA_INSTALL_LAYOUT_AT_CATEGORY="%1$s of category #%2$d"
COM_ALFA_INSTALL_LAYOUT_AT_MENU="%1$s of menu item #%2$d"
COM_ALFA_INSTALL_LAYOUT_AT_OPTIONS="%1$s in the Options"
COM_ALFA_INSTALL_ERROR_LAYOUTS="Alfa Commerce could not repair the layout choices saved with the template name html, and changed none of them: %1$s. They are repaired when Alfa Commerce is installed again; until then their pages show the component's own layout."

; The update removes the files earlier versions left in Alfa Commerce's folders (script.php postflight)
COM_ALFA_INSTALL_OBSOLETE_REMOVED="Alfa Commerce %1$s removed these files, which an earlier version left in its folders and this version no longer ships: %2$s."
COM_ALFA_INSTALL_OBSOLETE_FOLDERS="Alfa Commerce %1$s also removed the folders those files leave empty: %2$s."
COM_ALFA_INSTALL_OBSOLETE_KEPT="Alfa Commerce %1$s kept these files, which an earlier version left in its folders and this version no longer ships: their content is not what a release installed, so they stay for you to check in Tools > Security: %2$s."
COM_ALFA_INSTALL_OBSOLETE_FAILED="Alfa Commerce %1$s could not remove these files, which an earlier version left in its folders and this version no longer ships: %2$s. Remove them by hand; Tools > Security lists them until they are gone."
COM_ALFA_INSTALL_OBSOLETE_UNREAD="Alfa Commerce %1$s removed none of the files earlier versions left in its folders: it could not read which files this package installs (%2$s). Tools > Security lists any that remain."
COM_ALFA_INSTALL_OBSOLETE_LANGUAGE_KEPT="Alfa Commerce %1$s kept these language files, which an earlier version installed and this version no longer ships: their content is not what that version installed, so they may be yours. Remove them by hand if you do not need them: %2$s."
COM_ALFA_INSTALL_OBSOLETE_LANGUAGE_FAILED="Alfa Commerce %1$s could not remove these language files, which an earlier version installed and this version no longer ships: %2$s. Remove them by hand."

; The installation and the update remove a language folder inside the component's own folders (script.php postflight)
COM_ALFA_INSTALL_LANGUAGE_FOLDERS_REMOVED="Alfa Commerce %1$s removed these language folders from inside its own folders, with every file in them, because language files belong in Joomla's language folders: %2$s."
COM_ALFA_INSTALL_LANGUAGE_FOLDERS_FAILED="Alfa Commerce %1$s could not remove these language folders from inside its own folders: %2$s. Remove them by hand, because language files belong in Joomla's language folders."

; The uninstall removes every Alfa Commerce language pack through Joomla's installer (script.php uninstall)
COM_ALFA_UNINSTALL_LANGUAGE_PACKS_REMOVED="Alfa Commerce %1$s also uninstalled these language packs, which only work with it: %2$s."
COM_ALFA_UNINSTALL_LANGUAGE_PACKS_FAILED="Alfa Commerce %1$s could not uninstall these language packs: %2$s. Uninstall them in System > Manage > Extensions."
COM_ALFA_UNINSTALL_LANGUAGE_PACKS_NO_MANIFEST="Alfa Commerce %1$s could not uninstall these language packs, because their package manifest is missing and Joomla cannot uninstall them without it either: %2$s. The maintenance log (com_alfa_maintenance.php) has the details."
COM_ALFA_UNINSTALL_LANGUAGE_PACKS_FILES_LEFT="Alfa Commerce %1$s uninstalled these language packs, but some files could not be removed: %2$s. Remove the remaining files manually. The maintenance log (com_alfa_maintenance.php) lists the files that could not be deleted."
COM_ALFA_UNINSTALL_LANGUAGE_PACKS_ERROR="Alfa Commerce %1$s did not uninstall its language packs, because looking for them failed: %2$s. Uninstall them in System > Manage > Extensions."

; An Alfa Commerce language pack installed or updated while Joomla's own language of its tag is missing
COM_ALFA_LANGUAGE_PACK_NO_JOOMLA_LANGUAGE="The Alfa Commerce language pack for %1$s is installed, but Joomla's own %1$s language is not installed here (%2$s). Install it in System > Install > Languages: Alfa Commerce shows the pack's texts once Joomla's own language is installed and used."

