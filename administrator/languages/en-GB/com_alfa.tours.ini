; com_alfa: guided tours language file (en-GB)
; One section per tour: its title and description, then its steps.

; Tour: cart_rules
COM_ALFA_GUIDEDTOUR_CART_RULES_TITLE="Cart rules and coupons"
COM_ALFA_GUIDEDTOUR_CART_RULES_DESC="What happens to the basket: coupon codes, free shipping over an amount, buy-more-save-more, with the caps, the stacking rules and the usage limits that keep a promotion from costing more than it earns."

; Cart rules. One click to open a new one; everything after is reading.

COM_ALFA_GUIDEDTOUR_CART_RULES_STEP_1_TITLE="Cart rules act on the basket"
COM_ALFA_GUIDEDTOUR_CART_RULES_STEP_1_DESC="A discount changes what an item costs. A cart rule changes what the BASKET costs, at checkout, once the shopper has decided what to buy: a coupon code, free shipping over an amount, ten per cent off an order of five or more. Same shop, different moment, and this screen is where that moment is priced. Press Next."

COM_ALFA_GUIDEDTOUR_CART_RULES_STEP_2_TITLE="Where they live"
COM_ALFA_GUIDEDTOUR_CART_RULES_STEP_2_DESC="Cart Rules, in the Alfa menu. Every coupon you have issued and every automatic basket rule is in this one list, which is where you look when a customer says a code did not work."

COM_ALFA_GUIDEDTOUR_CART_RULES_STEP_3_TITLE="Open a new one"
COM_ALFA_GUIDEDTOUR_CART_RULES_STEP_3_DESC="Press New. The only click the tour asks for; nothing is saved unless you save it."

COM_ALFA_GUIDEDTOUR_CART_RULES_STEP_4_TITLE="Your name for it"
COM_ALFA_GUIDEDTOUR_CART_RULES_STEP_4_DESC="The internal name: what you will search for in this list and read in reports. Name it after the campaign and the year, not after the mechanic: \"Black Friday 2026\" ages better than \"10 percent off\"."

COM_ALFA_GUIDEDTOUR_CART_RULES_STEP_5_TITLE="The name the customer reads"
COM_ALFA_GUIDEDTOUR_CART_RULES_STEP_5_DESC="This one appears on the cart line and on the order: \"Welcome offer\", not \"CR-2026-Q1-B\". It is per language, so each shopper sees it in their own, and a clear line here is one fewer question in your inbox when an order total is not what a buyer expected."

COM_ALFA_GUIDEDTOUR_CART_RULES_STEP_6_TITLE="Coupon code, or automatic"
COM_ALFA_GUIDEDTOUR_CART_RULES_STEP_6_DESC="Type a code and the rule only applies when the shopper enters it. Leave it EMPTY and the rule is automatic: it applies to every basket that meets the conditions, with no code at all, which is how free shipping over an amount is normally done. Codes are case-insensitive; keep them short and unambiguous, because they get typed on phones."

COM_ALFA_GUIDEDTOUR_CART_RULES_STEP_7_TITLE="What the discount comes off"
COM_ALFA_GUIDEDTOUR_CART_RULES_STEP_7_DESC="Three genuinely different things. Line items reduces the matching items themselves, so the saving shows against the goods. Order subtotal takes it off the basket as a whole. Shipping cost reduces the delivery charge: the honest way to do \"free shipping\", instead of guessing an amount that matches the courier's price."

COM_ALFA_GUIDEDTOUR_CART_RULES_STEP_8_TITLE="Percent or fixed"
COM_ALFA_GUIDEDTOUR_CART_RULES_STEP_8_DESC="Percent scales with the basket and stays fair across small and large orders. A fixed amount is a promise you can print (\"€10 off\"), but it is also the one that can hand away most of a small order, which is what the cap two steps down is for."

COM_ALFA_GUIDEDTOUR_CART_RULES_STEP_9_TITLE="How much"
COM_ALFA_GUIDEDTOUR_CART_RULES_STEP_9_DESC="The figure the choice above applies: 10 means ten per cent or ten in your store currency. It is stored in the default currency and converted for the shopper, so you always type the number you actually decided on."

COM_ALFA_GUIDEDTOUR_CART_RULES_STEP_10_TITLE="The cap that saves you"
COM_ALFA_GUIDEDTOUR_CART_RULES_STEP_10_DESC="A ceiling on what this rule may ever give away, in money, however large the basket. Twenty per cent off is generous on €50 and expensive on €5,000; a cap turns an unbounded promise into a known cost. Leave it empty only when you have deliberately decided there is no ceiling."

COM_ALFA_GUIDEDTOUR_CART_RULES_STEP_11_TITLE="What it is calculated on"
COM_ALFA_GUIDEDTOUR_CART_RULES_STEP_11_DESC="Whole cart takes the percentage from everything. Matching lines takes it only from the items the rule targets. Cheapest matching line (one unit) is the buy-one-get-one shape: the rule reduces a single unit of the cheapest match, which is how \"3 for 2\" is expressed honestly rather than by approximating a percentage."

COM_ALFA_GUIDEDTOUR_CART_RULES_STEP_12_TITLE="Leave already-reduced goods alone"
COM_ALFA_GUIDEDTOUR_CART_RULES_STEP_12_DESC="Switch this on and items that already carry a catalogue discount are excluded from this rule: the standard \"not valid on sale items\" clause, enforced by the shop rather than by the small print nobody reads."

COM_ALFA_GUIDEDTOUR_CART_RULES_STEP_13_TITLE="Stacking with other rules"
COM_ALFA_GUIDEDTOUR_CART_RULES_STEP_13_DESC="One switch per kind of neighbour, and only the one that matches what this rule discounts is shown: may it sit alongside a line-item rule, another order-level rule, or a shipping rule. Off means it stands alone and the best rule wins. Turning it on is where promotions get expensive by accident: a coupon that combines with a sale and a free-shipping rule can take an order below cost, which is exactly what the cap above exists to bound."

COM_ALFA_GUIDEDTOUR_CART_RULES_STEP_14_TITLE="Priority decides the winner"
COM_ALFA_GUIDEDTOUR_CART_RULES_STEP_14_DESC="When several rules match and they do not combine, priority picks which one applies. Lower runs first. Give your safety rules (the ones with caps and exclusions) a clearer priority than the generous ones, so the cheap outcome is the deliberate one rather than whichever rule happened to be created first."

COM_ALFA_GUIDEDTOUR_CART_RULES_STEP_15_TITLE="How often it may be used"
COM_ALFA_GUIDEDTOUR_CART_RULES_STEP_15_DESC="A total limit across the whole shop, and a limit per customer. Together they are what makes a code safe to publish: one hundred redemptions in total, one each, and a leaked coupon costs you a hundred orders instead of your margin. Counting is done at order placement, so a basket that never checks out never consumes a use."

COM_ALFA_GUIDEDTOUR_CART_RULES_STEP_16_TITLE="Who may use it"
COM_ALFA_GUIDEDTOUR_CART_RULES_STEP_16_DESC="Restrict the rule to user groups (members, wholesale, staff) or to named accounts in the field beside it. A shopper outside the list is told the code is not valid for them rather than silently seeing no discount, which is the difference between a support ticket and none."

COM_ALFA_GUIDEDTOUR_CART_RULES_STEP_17_TITLE="Conditions: when it applies at all"
COM_ALFA_GUIDEDTOUR_CART_RULES_STEP_17_DESC="Open the Conditions tab. Everything so far described WHAT the rule gives; this tab decides WHETHER the basket qualifies in the first place."

COM_ALFA_GUIDEDTOUR_CART_RULES_STEP_18_TITLE="The minimum basket"
COM_ALFA_GUIDEDTOUR_CART_RULES_STEP_18_DESC="The amount a basket must reach before the rule applies: the engine behind \"free shipping over €50\". Two settings sit with it and both matter: whether the minimum is measured including or excluding tax, and what it is measured on. Set them to match the number you advertise, because a shopper who reaches €50 on the price tags and is refused because the rule meant €50 net will not accept the explanation."

COM_ALFA_GUIDEDTOUR_CART_RULES_STEP_19_TITLE="When it runs"
COM_ALFA_GUIDEDTOUR_CART_RULES_STEP_19_DESC="Start and end dates, so a campaign expires on its own. A coupon printed on paper outlives your intentions; a date is what stops it being honoured next year."

COM_ALFA_GUIDEDTOUR_CART_RULES_END_TITLE="Save it, or close the tour"
COM_ALFA_GUIDEDTOUR_CART_RULES_END_DESC="Once saved, the rule is live within its dates. Then try it: put the qualifying items in a basket on the storefront and watch the cart line appear with the customer-facing name you wrote; a rule that reads correctly here and behaves differently in a real basket is the thing worth finding before your customers do. Nothing in this tour has been saved for you. Press <strong>Save</strong> or <strong>Save &amp; Close</strong> to keep what is on this form, or <strong>Complete</strong> to close the tour without saving anything. Either way, the tour ends here."

; Tour: categories
COM_ALFA_GUIDEDTOUR_CATEGORIES_TITLE="Create a category"
COM_ALFA_GUIDEDTOUR_CATEGORIES_DESC="Where items live, and how shoppers browse."

COM_ALFA_GUIDEDTOUR_CATEGORIES_STEP_1_TITLE="Open Categories"
COM_ALFA_GUIDEDTOUR_CATEGORIES_STEP_1_DESC="Categories are the shelves of your shop: they group items, give each group its own landing page and menu item, and drive the breadcrumb a shopper follows. In the menu on the left, click <strong>Categories</strong>."
COM_ALFA_GUIDEDTOUR_CATEGORIES_STEP_2_TITLE="Start a new category"
COM_ALFA_GUIDEDTOUR_CATEGORIES_STEP_2_DESC="The list shows your whole tree; indented rows are children of the row above. Click <strong>New</strong> to add one."
COM_ALFA_GUIDEDTOUR_CATEGORIES_STEP_3_TITLE="Name it"
COM_ALFA_GUIDEDTOUR_CATEGORIES_STEP_3_DESC="The name is what shoppers read on the storefront and what you pick from everywhere else in the admin, so type it in every language your store speaks. The URL alias builds itself from it. Then press Next."
COM_ALFA_GUIDEDTOUR_CATEGORIES_STEP_4_TITLE="Describe it"
COM_ALFA_GUIDEDTOUR_CATEGORIES_STEP_4_DESC="The description sits on the category landing page above its items: the place to say what belongs in this group and why. Search engines read it too, so a couple of real sentences per language pay off. It is optional; press Next."
COM_ALFA_GUIDEDTOUR_CATEGORIES_STEP_5_TITLE="Give it a parent"
COM_ALFA_GUIDEDTOUR_CATEGORIES_STEP_5_DESC="Leave <em>No Parent</em> and this becomes a top-level shelf; pick a parent and it nests under it. Nesting is how you build Clothing -> Trousers -> Chinos, and a listing can be set to include everything below it. Press Next."
COM_ALFA_GUIDEDTOUR_CATEGORIES_STEP_6_TITLE="Give it an image"
COM_ALFA_GUIDEDTOUR_CATEGORIES_STEP_6_DESC="The Image tab holds the category image: the picture used on category grids and menus. A consistent shape across categories keeps listings tidy. Press Next."
COM_ALFA_GUIDEDTOUR_CATEGORIES_STEP_7_TITLE="The category picture"
COM_ALFA_GUIDEDTOUR_CATEGORIES_STEP_7_DESC="Drop an image here, or use the media picker above it. A category image is the tile shoppers see while browsing and the banner at the top of the category page, so a wide, uncluttered picture works far better than a photo of a single item. Leave it empty and the category still works, it just looks like a text link."

COM_ALFA_GUIDEDTOUR_CATEGORIES_END_TITLE="Save it, or close the tour"
COM_ALFA_GUIDEDTOUR_CATEGORIES_END_DESC="Once saved, a published category can hold items immediately, and it becomes a storefront page as soon as a menu item or a parent category points at it. Nothing in this tour has been saved for you. Press <strong>Save</strong> or <strong>Save &amp; Close</strong> to keep what is on this form, or <strong>Complete</strong> to close the tour without saving anything. Either way, the tour ends here."

; Tour: currencies
COM_ALFA_GUIDEDTOUR_CURRENCIES_TITLE="Create a currency"
COM_ALFA_GUIDEDTOUR_CURRENCIES_DESC="The currencies your store trades in."

COM_ALFA_GUIDEDTOUR_CURRENCIES_STEP_1_TITLE="Open Currencies"
COM_ALFA_GUIDEDTOUR_CURRENCIES_STEP_1_DESC="Every price, order and document is expressed in a currency, and the store has one default that everything else converts against. In the menu on the left, click <strong>Currencies</strong>."
COM_ALFA_GUIDEDTOUR_CURRENCIES_STEP_2_TITLE="Start a new currency"
COM_ALFA_GUIDEDTOUR_CURRENCIES_STEP_2_DESC="Click <strong>New</strong>. The list ships with the ISO 4217 set, so most stores only enable what they need rather than adding rows."
COM_ALFA_GUIDEDTOUR_CURRENCIES_STEP_3_TITLE="Name it"
COM_ALFA_GUIDEDTOUR_CURRENCIES_STEP_3_DESC="Name it as your customers know it. The code, symbol and ISO number that go with it decide how amounts are formatted and how many decimals they carry; those digits are what invoices and gateways are reconciled against. Then press Next."

COM_ALFA_GUIDEDTOUR_CURRENCIES_END_TITLE="Save it, or close the tour"
COM_ALFA_GUIDEDTOUR_CURRENCIES_END_DESC="The default currency cannot be deleted or unpublished while it is in use, which keeps existing orders and documents readable. Nothing in this tour has been saved for you. Press <strong>Save</strong> or <strong>Save &amp; Close</strong> to keep what is on this form, or <strong>Complete</strong> to close the tour without saving anything. Either way, the tour ends here."

; Tour: customer_groups
COM_ALFA_GUIDEDTOUR_CUSTOMER_GROUPS_TITLE="Customer groups"
COM_ALFA_GUIDEDTOUR_CUSTOMER_GROUPS_DESC="Different prices and visibility for different people."

COM_ALFA_GUIDEDTOUR_CUSTOMER_GROUPS_STEP_1_TITLE="Open Usergroups"
COM_ALFA_GUIDEDTOUR_CUSTOMER_GROUPS_STEP_1_DESC="Alfa keeps one settings row per Joomla user group, so a shop can treat retail, wholesale, staff and members differently. The groups themselves are created in Joomla; this screen is where each one gets its commercial meaning. In the menu on the left, click <strong>Usergroups</strong>."
COM_ALFA_GUIDEDTOUR_CUSTOMER_GROUPS_STEP_2_TITLE="What the list shows"
COM_ALFA_GUIDEDTOUR_CUSTOMER_GROUPS_STEP_2_DESC="Every Joomla group appears here with its Alfa settings attached, including the column that says whether it carries its own price rules. Rows are created for you as groups appear, which is why there is no New button. Press Next."
COM_ALFA_GUIDEDTOUR_CUSTOMER_GROUPS_STEP_3_TITLE="Open a group"
COM_ALFA_GUIDEDTOUR_CUSTOMER_GROUPS_STEP_3_DESC="Click a group name to open it."
COM_ALFA_GUIDEDTOUR_CUSTOMER_GROUPS_STEP_4_TITLE="What a group controls"
COM_ALFA_GUIDEDTOUR_CUSTOMER_GROUPS_STEP_4_DESC="Switch prices on and this group gets its own answer to what a price looks like: whether to show the base price, the discount amount, the subtotal, the tax, the price including tax, the final total and the full breakdown. That is how a wholesale group can see net prices while retail sees gross, and how a group can be shown no prices at all until they log in. Leave it off and the group simply follows the shop-wide defaults in Options. Press Next."

COM_ALFA_GUIDEDTOUR_CUSTOMER_GROUPS_END_TITLE="Save it, or close the tour"
COM_ALFA_GUIDEDTOUR_CUSTOMER_GROUPS_END_DESC="Put a customer in the group from Joomla Users, and this is what they see from their next visit. Nothing in this tour has been saved for you. Press <strong>Save</strong> or <strong>Save &amp; Close</strong> to keep what is on this form, or <strong>Complete</strong> to close the tour without saving anything. Either way, the tour ends here."

; Tour: customers
COM_ALFA_GUIDEDTOUR_CUSTOMERS_TITLE="Customer records"
COM_ALFA_GUIDEDTOUR_CUSTOMERS_DESC="The people behind your orders."

COM_ALFA_GUIDEDTOUR_CUSTOMERS_STEP_1_TITLE="Open Users"
COM_ALFA_GUIDEDTOUR_CUSTOMERS_STEP_1_DESC="This is the shop side of the people who buy from you: one row per account that has a shop profile. Customers arrive by registering or by checking out, so there is nothing to create here: the screen has no New button. In the menu on the left, click <strong>Users</strong>."
COM_ALFA_GUIDEDTOUR_CUSTOMERS_STEP_2_TITLE="Look someone up"
COM_ALFA_GUIDEDTOUR_CUSTOMERS_STEP_2_DESC="Search matches the username, the email and the internal note, so you can find a customer from whatever the caller gives you. The list itself shows their email, their last visit and that note. Their orders stay on the Orders screen; this one is about the person. Press Next."
COM_ALFA_GUIDEDTOUR_CUSTOMERS_STEP_3_TITLE="Open a customer"
COM_ALFA_GUIDEDTOUR_CUSTOMERS_STEP_3_DESC="Click a username to open the record."
COM_ALFA_GUIDEDTOUR_CUSTOMERS_STEP_4_TITLE="The internal note"
COM_ALFA_GUIDEDTOUR_CUSTOMERS_STEP_4_DESC="The note is a memo for your team: pays by bank transfer, always wants a receipt, awkward delivery address. The customer never sees it. The account itself (name, email, password, group membership) belongs to Joomla and is edited there; what decides the prices this person sees is the customer group they are in. Press Next."

COM_ALFA_GUIDEDTOUR_CUSTOMERS_END_TITLE="Save it, or close the tour"
COM_ALFA_GUIDEDTOUR_CUSTOMERS_END_DESC="To change what a customer pays or is allowed to see, move them into the right group; the <em>Customer groups</em> tour covers what a group can do. Nothing in this tour has been saved for you. Press <strong>Save</strong> or <strong>Save &amp; Close</strong> to keep what is on this form, or <strong>Complete</strong> to close the tour without saving anything. Either way, the tour ends here."

; Tour: discounts
COM_ALFA_GUIDEDTOUR_DISCOUNTS_TITLE="Catalogue discounts"
COM_ALFA_GUIDEDTOUR_DISCOUNTS_DESC="Price changes that apply to items themselves (a seasonal -20%, a members' price), with the rules that decide who gets them, when, and how they stack."

; Catalogue discounts. One click to open a new one; everything after is reading.

COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_1_TITLE="Discounts change the price of things"
COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_1_DESC="A discount acts on the ITEM price: it changes what a shopper sees on the item page and in listings, before anything reaches the cart. That is the difference from a cart rule, which acts on the basket once the shopper is checking out: a summer sale is a discount, \"spend 50 and get free shipping\" is a cart rule. Press Next."

COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_2_TITLE="Where they live"
COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_2_DESC="Discounts, in the Alfa menu. The list shows every rule you have written and whether it is running right now, which is the fastest way to answer \"why is this item cheaper than I expected\"."

COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_3_TITLE="Open a new one"
COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_3_DESC="Press New. The only click the tour asks for: from here you read, and nothing is saved unless you save it yourself."

COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_4_TITLE="What it is called"
COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_4_DESC="The name is yours, not the shopper's: it appears in this list, in reports and on the order line that records why a price was reduced. Name it after the reason (\"Summer sale 2026\", \"Wholesale tier 2\"), because in a year you will be reading it, not writing it."

COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_5_TITLE="How much"
COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_5_DESC="How much this discount takes off. What it means depends on the next field: 20 is either twenty in your currency or twenty per cent. With Type = Percentage, 0 to 100. With Type = Amount, 0 or more; more than the price simply takes the whole price. Never negative: a discount only ever takes money off. Money is always held in the store's default currency and converted for the shopper, so you type your own currency here whatever the buyer sees."

COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_6_TITLE="Amount or percentage"
COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_6_DESC="Percentage scales with the item: the right choice across a whole catalogue, because it stays fair on a €5 item and a €500 one. A fixed amount is right for a specific promise: \"€10 off this range\". Watch the small items with a fixed amount: nothing stops a €10 reduction meeting an €8 item, and the price floor, not your intention, is what protects you."

COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_7_TITLE="Before or after tax"
COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_7_DESC="Before tax reduces the net price and tax is then calculated on the smaller figure: the usual choice, and the one accountants expect. After tax takes the money off the gross price the shopper sees, which is what you want when you have promised a round number at the till: \"€50, tax included\". The two produce different totals to the cent, so pick deliberately rather than by default."

COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_8_TITLE="How it meets other discounts"
COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_8_DESC="Only this discount means the best matching rule wins alone: safest, and what most shops want. Combined lets several apply together, each calculated on the original price. One after another applies them in sequence, each on the price the previous one left, which compounds: two 20% rules in sequence take 36%, not 40%. If an item ever comes out cheaper than you expected, this field is where to look first."

COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_9_TITLE="When it runs"
COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_9_DESC="Start and end dates make a promotion end by itself; the point of writing them is that nobody has to remember to switch the sale off at midnight. Leave them empty for a standing rule such as a trade price. Dates are read in the site's timezone, so a sale that must end at midnight local is safest set to the following morning."

COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_10_TITLE="Which items: categories"
COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_10_DESC="Leave every scope field empty and the rule applies to the whole catalogue. Pick categories and it narrows to them: the common shape of a seasonal sale. The scopes below combine as AND: category Shoes plus manufacturer Acme means Acme shoes only, not every shoe and every Acme item."

COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_11_TITLE="Which items: manufacturer"
COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_11_DESC="Narrow by brand: how a supplier-funded promotion is normally expressed, and how you keep a brand that refuses discounting out of a catalogue-wide sale."

COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_12_TITLE="Which places"
COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_12_DESC="Places narrow the rule geographically: a country, a region, an island group. Use it for prices that genuinely differ by destination rather than for shipping costs, which shipment methods already price on their own."

COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_13_TITLE="Who gets it: user groups"
COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_13_DESC="Restrict the rule to Joomla user groups and you have trade pricing, membership pricing or staff pricing without a second catalogue. A shopper outside the group never sees the reduced price: not on the item page, not in a listing, not in a feed."

COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_14_TITLE="Who gets it: named customers"
COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_14_DESC="Narrower still: specific accounts. Useful for a negotiated price with one client, but a rule that names people is a rule nobody else can maintain; prefer a group whenever more than one customer is meant to have it."

COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_15_TITLE="The badge, on the Advanced tab"
COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_15_DESC="A discount nobody notices sells nothing extra. The Advanced tab decides whether this rule paints a badge on the storefront (the \"-20%\" flash on a listing tile or an item page) and what it looks like. Open it and the next steps walk down it."

COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_16_TITLE="Show it in listings"
COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_16_DESC="Turn the badge on for category and search listings, where a shopper is comparing and a flash is what earns the click. The equivalent switch below it does the same for the item page itself; a shop often wants the first and not the second."

COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_17_TITLE="What it looks like"
COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_17_DESC="Switching the listing badge on reveals a position chooser with three honest slots: the image corner (the classic sale flash), beside the title, or next to the add-to-cart button. The corner is loudest; the add-to-cart is the most persuasive at the moment of decision. They are slots rather than coordinates, so the badge lands correctly in every template, and the equivalent pair below does the same job on the item page itself. One look serves both: set the badge's background and text colours here, or leave them empty to use the template's default badge colour."

COM_ALFA_GUIDEDTOUR_DISCOUNTS_END_TITLE="Save it, or close the tour"
COM_ALFA_GUIDEDTOUR_DISCOUNTS_END_DESC="Once saved, the discount is live within its dates. Open an item it should touch and look at its price rows: they show the price a shopper will actually pay after discounts and tax, the fastest way to prove a new rule does what you meant. Nothing in this tour has been saved for you. Press <strong>Save</strong> or <strong>Save &amp; Close</strong> to keep what is on this form, or <strong>Complete</strong> to close the tour without saving anything. Either way, the tour ends here."

; Tour: document_series
COM_ALFA_GUIDEDTOUR_DOCUMENT_SERIES_TITLE="Document series"
COM_ALFA_GUIDEDTOUR_DOCUMENT_SERIES_DESC="Numbering, and the seller details on the paper."

COM_ALFA_GUIDEDTOUR_DOCUMENT_SERIES_STEP_1_TITLE="Open Sales Documents"
COM_ALFA_GUIDEDTOUR_DOCUMENT_SERIES_STEP_1_DESC="A series is the numbered book a document type is issued from: it decides what the next invoice is called and what the printed paper says about you as the seller. Series are managed from inside the documents area: in the menu on the left, click <strong>Sales Documents</strong>."
COM_ALFA_GUIDEDTOUR_DOCUMENT_SERIES_STEP_2_TITLE="Go to Document Series"
COM_ALFA_GUIDEDTOUR_DOCUMENT_SERIES_STEP_2_DESC="In the toolbar, click <strong>Document Series</strong>. A fresh install has none, and the dashboard checklist will keep reminding you until one exists."
COM_ALFA_GUIDEDTOUR_DOCUMENT_SERIES_STEP_3_TITLE="What a series is"
COM_ALFA_GUIDEDTOUR_DOCUMENT_SERIES_STEP_3_DESC="Each row binds one document type to one numbering rule: its code, the prefix, the next number, how many documents it has issued and whether it is the default for that type. Two branches or two brands issuing the same kind of document run two series over it. Press Next."
COM_ALFA_GUIDEDTOUR_DOCUMENT_SERIES_STEP_4_TITLE="Start a new series"
COM_ALFA_GUIDEDTOUR_DOCUMENT_SERIES_STEP_4_DESC="Click <strong>New</strong>."
COM_ALFA_GUIDEDTOUR_DOCUMENT_SERIES_STEP_5_TITLE="Which type it numbers"
COM_ALFA_GUIDEDTOUR_DOCUMENT_SERIES_STEP_5_DESC="A series belongs to exactly one document type, so its counter can never collide with another kind of paper. Choose carefully: once the series has issued something, this field and the next number lock, because renumbering issued documents is not a thing you may do. Press Next."
COM_ALFA_GUIDEDTOUR_DOCUMENT_SERIES_STEP_6_TITLE="How the number is built"
COM_ALFA_GUIDEDTOUR_DOCUMENT_SERIES_STEP_6_DESC="The prefix, the zero padding and the next number produce what the customer reads, INV-000123. Year scoping restarts the counter each year, which is what most tax regimes expect, and the branch code goes in when you issue from more than one place. Alfa never reuses a number, so set the starting point deliberately. Press Next."
COM_ALFA_GUIDEDTOUR_DOCUMENT_SERIES_STEP_7_TITLE="Your identity on the paper"
COM_ALFA_GUIDEDTOUR_DOCUMENT_SERIES_STEP_7_DESC="Name, VAT number, tax office, activity and address are printed on every document this series issues; they are the legal identity of the seller for those papers. The layout field picks the template that does the printing. Press Next."

COM_ALFA_GUIDEDTOUR_DOCUMENT_SERIES_END_TITLE="Save it, or close the tour"
COM_ALFA_GUIDEDTOUR_DOCUMENT_SERIES_END_DESC="Mark one series as the default for its type and orders will use it automatically when issuing. Nothing in this tour has been saved for you. Press <strong>Save</strong> or <strong>Save &amp; Close</strong> to keep what is on this form, or <strong>Complete</strong> to close the tour without saving anything. Either way, the tour ends here."

; Tour: document_types
COM_ALFA_GUIDEDTOUR_DOCUMENT_TYPES_TITLE="Document types"
COM_ALFA_GUIDEDTOUR_DOCUMENT_TYPES_DESC="Invoices, receipts, credit notes: what they are and what you can change."

COM_ALFA_GUIDEDTOUR_DOCUMENT_TYPES_STEP_1_TITLE="Open Sales Documents"
COM_ALFA_GUIDEDTOUR_DOCUMENT_TYPES_STEP_1_DESC="Document types are managed from inside the documents area. In the menu on the left, click <strong>Sales Documents</strong>."
COM_ALFA_GUIDEDTOUR_DOCUMENT_TYPES_STEP_2_TITLE="Go to Document Types"
COM_ALFA_GUIDEDTOUR_DOCUMENT_TYPES_STEP_2_DESC="In the toolbar, click <strong>Document Types</strong>."
COM_ALFA_GUIDEDTOUR_DOCUMENT_TYPES_STEP_3_TITLE="What lives here"
COM_ALFA_GUIDEDTOUR_DOCUMENT_TYPES_STEP_3_DESC="A document type is the accounting meaning of a document: invoice, retail receipt, credit note, delivery note. Its semantics (which family it belongs to, whether it carries prices, whether it moves stock, whether it needs an original) are what the engine uses to count sales, credit them back and adjust inventory. They arrive with the core or with an extension package and are never typed in by hand, which is why this screen has no New button. Press Next."
COM_ALFA_GUIDEDTOUR_DOCUMENT_TYPES_STEP_4_TITLE="Open a type"
COM_ALFA_GUIDEDTOUR_DOCUMENT_TYPES_STEP_4_DESC="What you can change is how a type presents itself. Click a type name to open it."
COM_ALFA_GUIDEDTOUR_DOCUMENT_TYPES_STEP_5_TITLE="Translate its name"
COM_ALFA_GUIDEDTOUR_DOCUMENT_TYPES_STEP_5_DESC="This name is what pickers, lists and printed documents show, so type it in every language your store issues documents in. The semantics panel on the right stays locked: it defines what the type IS, and changing that would rewrite the meaning of documents already issued. Press Next."
COM_ALFA_GUIDEDTOUR_DOCUMENT_TYPES_STEP_6_TITLE="Icon, colour and order"
COM_ALFA_GUIDEDTOUR_DOCUMENT_TYPES_STEP_6_DESC="An icon class and an accent colour make the type recognisable at a glance in admin lists and badges, and the ordering decides where it sits in the issuing pickers. Press Next."
COM_ALFA_GUIDEDTOUR_DOCUMENT_TYPES_STEP_7_TITLE="Enable or disable"
COM_ALFA_GUIDEDTOUR_DOCUMENT_TYPES_STEP_7_DESC="Disabling a type takes it out of the issuing pickers while leaving every document already issued under it intact and readable; that is how you retire a type you no longer use. Press Next."

COM_ALFA_GUIDEDTOUR_DOCUMENT_TYPES_END_TITLE="Save it, or close the tour"
COM_ALFA_GUIDEDTOUR_DOCUMENT_TYPES_END_DESC="New types arrive by installing a package that registers them; <strong>Sync providers</strong> picks up what an installed package brings. Nothing in this tour has been saved for you. Press <strong>Save</strong> or <strong>Save &amp; Close</strong> to keep what is on this form, or <strong>Complete</strong> to close the tour without saving anything. Either way, the tour ends here."

; Tour: form_field_groups
COM_ALFA_GUIDEDTOUR_FORM_FIELD_GROUPS_TITLE="Create a form field group"
COM_ALFA_GUIDEDTOUR_FORM_FIELD_GROUPS_DESC="Sections that order the checkout form."

COM_ALFA_GUIDEDTOUR_FORM_FIELD_GROUPS_STEP_1_TITLE="Open Form Fields"
COM_ALFA_GUIDEDTOUR_FORM_FIELD_GROUPS_STEP_1_DESC="Groups are the sections a checkout form is split into (contact details, delivery address, invoice details), so a long form reads as a few short ones. They are managed from inside the fields area: in the menu on the left, click <strong>Form Fields</strong>."
COM_ALFA_GUIDEDTOUR_FORM_FIELD_GROUPS_STEP_2_TITLE="Go to Groups"
COM_ALFA_GUIDEDTOUR_FORM_FIELD_GROUPS_STEP_2_DESC="In the toolbar, click <strong>Groups</strong>."
COM_ALFA_GUIDEDTOUR_FORM_FIELD_GROUPS_STEP_3_TITLE="Start a new group"
COM_ALFA_GUIDEDTOUR_FORM_FIELD_GROUPS_STEP_3_DESC="Click <strong>New</strong>."
COM_ALFA_GUIDEDTOUR_FORM_FIELD_GROUPS_STEP_4_TITLE="Title it"
COM_ALFA_GUIDEDTOUR_FORM_FIELD_GROUPS_STEP_4_DESC="The title is the heading shoppers read above the fields in this section, so type it in every language your store speaks. Then press Next."

COM_ALFA_GUIDEDTOUR_FORM_FIELD_GROUPS_END_TITLE="Save it, or close the tour"
COM_ALFA_GUIDEDTOUR_FORM_FIELD_GROUPS_END_DESC="Assign fields to the group from the Form Fields list; checkout renders each group as its own block, in the order you set. Nothing in this tour has been saved for you. Press <strong>Save</strong> or <strong>Save &amp; Close</strong> to keep what is on this form, or <strong>Complete</strong> to close the tour without saving anything. Either way, the tour ends here."

; Tour: form_fields
COM_ALFA_GUIDEDTOUR_FORM_FIELDS_TITLE="Create a form field"
COM_ALFA_GUIDEDTOUR_FORM_FIELDS_DESC="The checkout form is built from these."

COM_ALFA_GUIDEDTOUR_FORM_FIELDS_STEP_1_TITLE="Open Form Fields"
COM_ALFA_GUIDEDTOUR_FORM_FIELDS_STEP_1_DESC="Every box a customer fills at checkout is a form field (name, phone, VAT number, delivery notes), and the order stores what they typed. In the menu on the left, click <strong>Form Fields</strong>."
COM_ALFA_GUIDEDTOUR_FORM_FIELDS_STEP_2_TITLE="Start a new field"
COM_ALFA_GUIDEDTOUR_FORM_FIELDS_STEP_2_DESC="Click <strong>New</strong>."
COM_ALFA_GUIDEDTOUR_FORM_FIELDS_STEP_3_TITLE="Name it"
COM_ALFA_GUIDEDTOUR_FORM_FIELDS_STEP_3_DESC="The field name is its key in the order record and in exports, so keep it short and stable; the label the customer reads is set separately, per language. Then press Next."
COM_ALFA_GUIDEDTOUR_FORM_FIELDS_STEP_4_TITLE="Where it appears"
COM_ALFA_GUIDEDTOUR_FORM_FIELDS_STEP_4_DESC="These switches decide which parts of checkout show the field (the billing address, the shipping address, or both), and its group decides where it sits within them. That is how you ask for a VAT number only where it belongs. Press Next."

COM_ALFA_GUIDEDTOUR_FORM_FIELDS_END_TITLE="Save it, or close the tour"
COM_ALFA_GUIDEDTOUR_FORM_FIELDS_END_DESC="Published fields appear at checkout in their group order, and what customers type lands on the order and on the documents that quote it. Nothing in this tour has been saved for you. Press <strong>Save</strong> or <strong>Save &amp; Close</strong> to keep what is on this form, or <strong>Complete</strong> to close the tour without saving anything. Either way, the tour ends here."

; Tour: item_fields
COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_TITLE="Item fields: where variations come from"
COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_DESC="Size, Colour, Material, Warranty. One walk through what an item field is, the one setting that decides whether it creates variations or just describes the item, and how it reaches the items that should offer it."

; Item fields tour. One click to open a new field; everything after it is reading.

COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_1_TITLE="What an item field is"
COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_1_DESC="An item field is a named list of values that items can draw on: Size with S, M, L; Colour with Red and Blue; Material with cotton and wool. Items do not invent these; they pick from what you define here, which is why a shop can filter on them, report on them and keep them spelled the same way everywhere. Press Next and we will open a new one."

COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_2_TITLE="Where item fields live"
COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_2_DESC="Item Fields, in the Alfa menu on the left. They sit beside Items on purpose: a field is defined once here and then every item in its categories can draw on it, which is why you come here first and to the item second."

COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_3_TITLE="Open a new field"
COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_3_DESC="Press New. It is the only click this tour asks for; after it you just read, and nothing is saved until you decide to save."

COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_4_TITLE="The name"
COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_4_DESC="What buyers see above the choice on the item page: Size, Colour, Warranty. One box per content language, so each shopper reads it in their own. Keep it short: it becomes a label on the item page, a column in your variation grid and a filter in the storefront."

COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_5_TITLE="How the buyer picks it"
COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_5_DESC="The type decides the control on the item page: a dropdown for a long list, radio buttons or swatches when you want every choice visible at a glance, a colour swatch for shades. It changes only how the choice is presented; the values behind it stay the same."

COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_6_TITLE="The setting that decides everything"
COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_6_DESC="Informational is the fork in the road. Left off, this is a choice: the buyer picks a value, and the item can turn those picks into purchasable variations (Red / S with its own SKU, stock and price) or offer them as plain options that only ride along on the order line. Switched on, it is a specification instead: the buyer reads it and never picks it, and it shows up in the item's spec table and in storefront filters. One field is one or the other, never both."

COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_7_TITLE="Which items may use it"
COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_7_DESC="Categories scope the field. Assign Size to Clothing and only items in Clothing can offer it; a book never sees a size dropdown by accident. Leave the scope wide and every item may use it; that is fine for something like Warranty, and messy for something like Shoe size."

COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_8_TITLE="Values: the actual list"
COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_8_DESC="A field with no values does nothing: it is the values that items pick from, and an item's Pricing & Combinations tab stays empty until at least one field has some. Open this tab to look at them."

COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_9_TITLE="Adding and ordering values"
COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_9_DESC="Each row is one value, named per language, and the order you drag them into is the order shoppers see, so S, M, L reads correctly instead of alphabetically. Add every value the shop might ever sell; an item then chooses which of them it actually offers, so one Size list serves shirts that stop at L and trousers that go to XXL."

COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_10_TITLE="Display"
COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_10_DESC="Presentation details for the storefront: how the values are laid out, what shows when nothing is chosen yet, and any per-type settings the field's plugin adds. Sensible defaults are already in place, so this tab is somewhere to come back to, not a hurdle."

COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_11_TITLE="Visibility"
COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_11_DESC="Rules for when the field appears at all: show Sleeve length only once Style is Long sleeve, for instance. Leave it empty and the field is always shown. The rules are evaluated on the server as well as in the browser, so a hidden field can never sneak a value into an order."

COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_END_TITLE="Save it, or close the tour"
COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_END_DESC="Once saved, the field is available to every item in its categories: open one, go to Pricing & Combinations, and the field is there, as a dimension to generate variations from, as an option, or as a specification, depending on the choice you made earlier. Nothing in this tour has been saved for you. Press <strong>Save</strong> or <strong>Save &amp; Close</strong> to keep what is on this form, or <strong>Complete</strong> to close the tour without saving anything. Either way, the tour ends here."

; Tour: joomla_basics
COM_ALFA_GUIDEDTOUR_JOOMLA_BASICS_TITLE="The Joomla settings a shop depends on"
COM_ALFA_GUIDEDTOUR_JOOMLA_BASICS_DESC="Readable addresses, a working mail sender and HTTPS. Three settings that live in Joomla rather than in Alfa, and that a shop cannot trade properly without."

; Global Configuration belongs to Joomla, so the steps point only at what is on
; screen without opening a tab: the active Site tab and the tab buttons.

COM_ALFA_GUIDEDTOUR_JOOMLA_BASICS_STEP_1_TITLE="Three settings, one screen"
COM_ALFA_GUIDEDTOUR_JOOMLA_BASICS_STEP_1_DESC="Alfa runs on Joomla, and three of Joomla's own settings decide whether your shop looks trustworthy and whether its email arrives at all. They are not in Alfa's Options; they are here, in Global Configuration. Press Next."

COM_ALFA_GUIDEDTOUR_JOOMLA_BASICS_STEP_2_TITLE="Readable addresses"
COM_ALFA_GUIDEDTOUR_JOOMLA_BASICS_STEP_2_DESC="Search Engine Friendly URLs turn index.php?option=com_alfa&view=item&id=42 into /shop/red-shirt. Shoppers trust an address they can read, search engines index it far better, and Alfa builds these from the aliases your items already carry, so switching it on costs nothing and changes every link at once. Turn on URL rewriting as well only if your server has the rewrite rules in place."

COM_ALFA_GUIDEDTOUR_JOOMLA_BASICS_STEP_3_TITLE="Mail and HTTPS live behind Server"
COM_ALFA_GUIDEDTOUR_JOOMLA_BASICS_STEP_3_DESC="Open the Server tab for the other two. Mail settings decide how order confirmations leave the building: PHP mail is the default and the least reliable; an SMTP account on your own domain is what stops receipts landing in spam. Force HTTPS is on the same tab: a checkout served over plain HTTP is refused by every modern payment provider, and browsers mark it as unsafe in front of your customer."

COM_ALFA_GUIDEDTOUR_JOOMLA_BASICS_END_TITLE="Save it, or close the tour"
COM_ALFA_GUIDEDTOUR_JOOMLA_BASICS_END_DESC="Saving writes the configuration. If Force HTTPS is new, check that the site loads afterwards before you walk away: a certificate that is not ready yet will lock you out of your own admin. Nothing in this tour has been saved for you. Press <strong>Save</strong> or <strong>Save &amp; Close</strong> to keep what is on this form, or <strong>Complete</strong> to close the tour without saving anything. Either way, the tour ends here."

; Tour: manufacturers
COM_ALFA_GUIDEDTOUR_MANUFACTURERS_TITLE="Create a manufacturer"
COM_ALFA_GUIDEDTOUR_MANUFACTURERS_DESC="Brands your items belong to."

COM_ALFA_GUIDEDTOUR_MANUFACTURERS_STEP_1_TITLE="Open Manufacturers"
COM_ALFA_GUIDEDTOUR_MANUFACTURERS_STEP_1_DESC="A manufacturer is the brand behind an item. Items point at one, and the storefront can filter and group by it. In the menu on the left, click <strong>Manufacturers</strong>."
COM_ALFA_GUIDEDTOUR_MANUFACTURERS_STEP_2_TITLE="Start a new manufacturer"
COM_ALFA_GUIDEDTOUR_MANUFACTURERS_STEP_2_DESC="Click <strong>New</strong>."
COM_ALFA_GUIDEDTOUR_MANUFACTURERS_STEP_3_TITLE="Name it"
COM_ALFA_GUIDEDTOUR_MANUFACTURERS_STEP_3_DESC="The brand name as customers know it: type it in every language your store speaks, since a brand can be spelled differently per market. Then press Next."
COM_ALFA_GUIDEDTOUR_MANUFACTURERS_STEP_4_TITLE="The logo"
COM_ALFA_GUIDEDTOUR_MANUFACTURERS_STEP_4_DESC="A manufacturer is a brand, and a brand is recognised by its mark; the logo lives behind this tab. It appears on the brand page, beside items that carry the brand, and in any brand list the storefront shows. Open it and the next step looks at where the file goes."

COM_ALFA_GUIDEDTOUR_MANUFACTURERS_STEP_5_TITLE="Dropping the logo in"
COM_ALFA_GUIDEDTOUR_MANUFACTURERS_STEP_5_DESC="Drag the file onto this area or pick it from the media library. A logo on a transparent background sits well on any page colour, and one wide image beats a tall one because the storefront scales it into a row. This is optional: a brand with no logo simply shows its name."

COM_ALFA_GUIDEDTOUR_MANUFACTURERS_END_TITLE="Save it, or close the tour"
COM_ALFA_GUIDEDTOUR_MANUFACTURERS_END_DESC="Assign the brand on an item form, and it becomes a filter and a badge on the storefront. Nothing in this tour has been saved for you. Press <strong>Save</strong> or <strong>Save &amp; Close</strong> to keep what is on this form, or <strong>Complete</strong> to close the tour without saving anything. Either way, the tour ends here."

; Tour: menu_account
COM_ALFA_GUIDEDTOUR_MENU_ACCOUNT_TITLE="Menu item: the account page"
COM_ALFA_GUIDEDTOUR_MENU_ACCOUNT_DESC="The page where a customer keeps the details they reuse at checkout. Optional for the shop to run, and the difference between a one off sale and a returning buyer."

COM_ALFA_GUIDEDTOUR_MENU_ACCOUNT_1_TITLE="What you are about to build"
COM_ALFA_GUIDEDTOUR_MENU_ACCOUNT_1_DESC="Every order keeps its own copy of the address it was placed with, which is what makes an old invoice still true years later. This page is the other side of that: the customer's own list, which they pick from at checkout instead of typing everything again. Your shop runs without it; your returning customers notice immediately. Press <strong>Next</strong>."

COM_ALFA_GUIDEDTOUR_MENU_ACCOUNT_2_TITLE="Step 1. Choose the menu"
COM_ALFA_GUIDEDTOUR_MENU_ACCOUNT_2_DESC="This one usually belongs in a <strong>User Menu</strong>, the menu a site shows only to people who are logged in, rather than in the main navigation. If your site has no such menu, the main one is fine: the access level a few steps on keeps guests away."

COM_ALFA_GUIDEDTOUR_MENU_ACCOUNT_3_TITLE="Step 2. Click New"
COM_ALFA_GUIDEDTOUR_MENU_ACCOUNT_3_DESC="Click the green <strong>New</strong> button in the toolbar. The form opens on its <strong>Details</strong> tab, and the next few steps all happen there."

COM_ALFA_GUIDEDTOUR_MENU_ACCOUNT_4_TITLE="Step 3. Type the title"
COM_ALFA_GUIDEDTOUR_MENU_ACCOUNT_4_DESC="Click in the <strong>Title</strong> box and use the customer's words: <em>My account</em>, <em>My details</em>, <em>Address book</em>. Then press <strong>Next</strong>."

COM_ALFA_GUIDEDTOUR_MENU_ACCOUNT_5_TITLE="Step 4. Click Select, here"
COM_ALFA_GUIDEDTOUR_MENU_ACCOUNT_5_DESC="This row is <strong>Menu Item Type</strong>: the empty box and the blue <strong>Select</strong> button beside it. Click <strong>Select</strong>."

COM_ALFA_GUIDEDTOUR_MENU_ACCOUNT_6_TITLE="Step 5. Click Alfa Commerce"
COM_ALFA_GUIDEDTOUR_MENU_ACCOUNT_6_DESC="Headings only until you open one. Click <strong>Alfa Commerce</strong> at the top of the window."

COM_ALFA_GUIDEDTOUR_MENU_ACCOUNT_7_TITLE="Step 6. Click User Info"
COM_ALFA_GUIDEDTOUR_MENU_ACCOUNT_7_DESC="Click <strong>User Info</strong>, described as <em>My saved info</em>. This is Alfa's page and it is not Joomla's user profile: names, passwords and two factor authentication stay entirely with Joomla, untouched by us."

COM_ALFA_GUIDEDTOUR_MENU_ACCOUNT_8_TITLE="Step 7. Confirm the menu"
COM_ALFA_GUIDEDTOUR_MENU_ACCOUNT_8_DESC="Right hand column, same tab. <strong>Menu</strong> decides where it appears. A user menu is the natural home; the main menu works too."

COM_ALFA_GUIDEDTOUR_MENU_ACCOUNT_9_TITLE="Step 8. Registered, not Public"
COM_ALFA_GUIDEDTOUR_MENU_ACCOUNT_9_DESC="Set <strong>Access</strong> to <strong>Registered</strong>. The page already sends a guest to the login screen, so nothing breaks either way, but leaving it Public puts a link in the navigation that only ever bounces the visitor, and that reads as a broken site. <strong>Status</strong> Published."

COM_ALFA_GUIDEDTOUR_MENU_ACCOUNT_10_MONO_TITLE="Step 9. Language"
COM_ALFA_GUIDEDTOUR_MENU_ACCOUNT_10_MONO_DESC="Your site speaks one language, so this item is for <strong>All</strong> languages and there is nothing to choose. That is the Details tab finished."

COM_ALFA_GUIDEDTOUR_MENU_ACCOUNT_10_ML_TITLE="Step 9. Pick this item's language"
COM_ALFA_GUIDEDTOUR_MENU_ACCOUNT_10_ML_DESC="Choose the language this account page is for, and repeat the tour for the others. A customer reading your site in one language should never be handed their details in another. That is the Details tab finished."

COM_ALFA_GUIDEDTOUR_MENU_ACCOUNT_11_TITLE="Everything else lives in these tabs"
COM_ALFA_GUIDEDTOUR_MENU_ACCOUNT_11_DESC="The page works now. What follows is what the other tabs are for, so you know where to come back to. Nothing in them is required."

COM_ALFA_GUIDEDTOUR_MENU_ACCOUNT_12_TITLE="Layouts"
COM_ALFA_GUIDEDTOUR_MENU_ACCOUNT_12_DESC="One picker, for the page itself: what Alfa ships, or an override from your template. <strong>Use Global</strong> follows Alfa's Options and is the right answer until you have a reason."

COM_ALFA_GUIDEDTOUR_MENU_ACCOUNT_13_TITLE="Associations, the tab multilingual sites cannot skip"
COM_ALFA_GUIDEDTOUR_MENU_ACCOUNT_13_DESC="Open <strong>Associations</strong> and point this page at its twin in each other language, so the switcher keeps the customer inside their account instead of throwing them onto the front page. The checklist reports any storefront page whose copies are not associated, and can tie them for you."

COM_ALFA_GUIDEDTOUR_MENU_ACCOUNT_END_TITLE="Save it, or close the tour"
COM_ALFA_GUIDEDTOUR_MENU_ACCOUNT_END_DESC="Once saved, log in on your own storefront and the page lists what that customer has saved. Next, if your shop lets people open an account, run <strong>Menu item: the sign-up page</strong>. Nothing in this tour has been saved for you. Press <strong>Save</strong> or <strong>Save &amp; Close</strong> to keep what is on this form, or <strong>Complete</strong> to close the tour without saving anything. Either way, the tour ends here."

; Tour: menu_cart
COM_ALFA_GUIDEDTOUR_MENU_CART_TITLE="Menu item: the cart page"
COM_ALFA_GUIDEDTOUR_MENU_CART_DESC="One address carries the basket, the checkout and the thank you page, and every payment provider returns your shopper to it. Build it from New to Save."

COM_ALFA_GUIDEDTOUR_MENU_CART_1_TITLE="What you are about to build"
COM_ALFA_GUIDEDTOUR_MENU_CART_1_DESC="The basket, the checkout steps and the page a shopper sees after paying are one Alfa page wearing three layouts, so they need exactly one menu item between them. It is also the address every payment provider returns your customer to, which is why a shop without it cannot finish an order. Press <strong>Next</strong>."

COM_ALFA_GUIDEDTOUR_MENU_CART_2_TITLE="Step 1. Choose the menu"
COM_ALFA_GUIDEDTOUR_MENU_CART_2_DESC="Usually the same menu as your shop page. Plenty of shops keep the cart out of the visible navigation and reach it from the cart module instead; that is fine, the menu item still has to exist, because it is what gives checkout an address."

COM_ALFA_GUIDEDTOUR_MENU_CART_3_TITLE="Step 2. Click New"
COM_ALFA_GUIDEDTOUR_MENU_CART_3_DESC="Click the green <strong>New</strong> button in the toolbar. The form opens on its <strong>Details</strong> tab, and everything in the next few steps is on that one tab."

COM_ALFA_GUIDEDTOUR_MENU_CART_4_TITLE="Step 3. Type the title"
COM_ALFA_GUIDEDTOUR_MENU_CART_4_DESC="Click in the <strong>Title</strong> box and type what your customers call it: <em>Cart</em>, <em>Basket</em>, <em>Checkout</em>. It becomes part of the address they see while paying. Then press <strong>Next</strong>."

COM_ALFA_GUIDEDTOUR_MENU_CART_5_TITLE="Step 4. Click Select, here"
COM_ALFA_GUIDEDTOUR_MENU_CART_5_DESC="This row is <strong>Menu Item Type</strong>: an empty box with a blue <strong>Select</strong> button beside it. Click <strong>Select</strong>."

COM_ALFA_GUIDEDTOUR_MENU_CART_6_TITLE="Step 5. Click Alfa Commerce"
COM_ALFA_GUIDEDTOUR_MENU_CART_6_DESC="The window opens closed: headings only, one per extension. Click the <strong>Alfa Commerce</strong> heading at the top to unfold its types."

COM_ALFA_GUIDEDTOUR_MENU_CART_7_TITLE="Step 6. Click Cart"
COM_ALFA_GUIDEDTOUR_MENU_CART_7_DESC="Click <strong>Cart</strong>, described as <em>Show the cart</em>. There is no separate checkout type to hunt for; this one covers all three stages. The window closes and the form reloads on the Details tab."

COM_ALFA_GUIDEDTOUR_MENU_CART_8_TITLE="Step 7. Confirm the menu"
COM_ALFA_GUIDEDTOUR_MENU_CART_8_DESC="Right hand column, same tab. <strong>Menu</strong> decides where the item appears. If you would rather the cart were not a visible link, put it in a menu no module displays; the page still works, and the cart module still reaches it."

COM_ALFA_GUIDEDTOUR_MENU_CART_9_TITLE="Step 8. Published, and Public"
COM_ALFA_GUIDEDTOUR_MENU_CART_9_DESC="<strong>Access</strong> must stay <strong>Public</strong>. Guests buy too, and an access level here stops them at the checkout door. <strong>Status</strong> Published, and leave <strong>Default Page</strong> off; a cart is never a front page."

COM_ALFA_GUIDEDTOUR_MENU_CART_10_MONO_TITLE="Step 9. Language"
COM_ALFA_GUIDEDTOUR_MENU_CART_10_MONO_DESC="Your site speaks one language, so this item is for <strong>All</strong> languages and there is nothing to choose. That is the Details tab finished."

COM_ALFA_GUIDEDTOUR_MENU_CART_10_ML_TITLE="Step 9. Pick this item's language"
COM_ALFA_GUIDEDTOUR_MENU_CART_10_ML_DESC="Your site is multilingual, so choose the language this cart is for, and repeat the tour for the others. Alfa's checklist wants a cart in every published language: a shopper who switches language mid checkout and finds no cart in the new one has lost their basket. That is the Details tab finished."

COM_ALFA_GUIDEDTOUR_MENU_CART_11_TITLE="Everything else lives in these tabs"
COM_ALFA_GUIDEDTOUR_MENU_CART_11_DESC="The cart works now: you could save and be done. What follows is what the other tabs are for, so you know where to come back to. Nothing in them is required."

COM_ALFA_GUIDEDTOUR_MENU_CART_12_TITLE="Layouts, the checkout's own sections"
COM_ALFA_GUIDEDTOUR_MENU_CART_12_DESC="Click the tab to see them. The cart is built from parts you can swap one at a time: the line items, the form, and the blocks where the shopper picks their details, their payment method and their shipping. Leave every one on <strong>Use Global</strong> until the default checkout is running and you know what you want changed."

COM_ALFA_GUIDEDTOUR_MENU_CART_13_TITLE="Associations, the tab multilingual sites cannot skip"
COM_ALFA_GUIDEDTOUR_MENU_CART_13_DESC="Open <strong>Associations</strong> and point this cart at its twin in each other language. That link is what lets the switcher move a shopper between them; without it they land on the front page, mid purchase. If the other language's cart does not exist yet, save this one, build that one, then come back. The checklist reports unassociated storefront pages and can tie them in one click."

COM_ALFA_GUIDEDTOUR_MENU_CART_END_TITLE="Save it, or close the tour"
COM_ALFA_GUIDEDTOUR_MENU_CART_END_DESC="Once saved, with the shop and the cart published, Alfa counts your storefront as reachable. Next, run <strong>Menu item: the account page</strong> so returning customers keep their details instead of retyping them at every order. Nothing in this tour has been saved for you. Press <strong>Save</strong> or <strong>Save &amp; Close</strong> to keep what is on this form, or <strong>Complete</strong> to close the tour without saving anything. Either way, the tour ends here."

; Tour: menu_register
COM_ALFA_GUIDEDTOUR_MENU_REGISTER_TITLE="Menu item: the sign-up page"
COM_ALFA_GUIDEDTOUR_MENU_REGISTER_DESC="Alfa's own registration page: Joomla's account, plus the shop fields you need from a customer the moment they join."

COM_ALFA_GUIDEDTOUR_MENU_REGISTER_1_TITLE="What you are about to build"
COM_ALFA_GUIDEDTOUR_MENU_REGISTER_1_DESC="Joomla can already register users; what it cannot do is ask for the things a shop needs, like a tax number, a company or the phone number the courier will call. This page wraps Joomla's own registration, so everything it does still happens (activation, emails, captcha, two factor), and puts your shop fields on the same form. If Joomla's own registration is switched off, turn it on first or this page will refuse the submit. Press <strong>Next</strong>."

COM_ALFA_GUIDEDTOUR_MENU_REGISTER_2_TITLE="Step 1. Choose the menu"
COM_ALFA_GUIDEDTOUR_MENU_REGISTER_2_DESC="Wherever a visitor would look for it: often a <strong>User Menu</strong>, or nowhere visible at all, since the login form already links to it. The item still has to exist. With Alfa installed, Joomla's own registration link redirects here, and without a menu item that page has no proper address."

COM_ALFA_GUIDEDTOUR_MENU_REGISTER_3_TITLE="Step 2. Click New"
COM_ALFA_GUIDEDTOUR_MENU_REGISTER_3_DESC="Click the green <strong>New</strong> button in the toolbar. The form opens on its <strong>Details</strong> tab, and the next few steps all happen there."

COM_ALFA_GUIDEDTOUR_MENU_REGISTER_4_TITLE="Step 3. Type the title"
COM_ALFA_GUIDEDTOUR_MENU_REGISTER_4_DESC="Click in the <strong>Title</strong> box: <em>Create account</em>, <em>Register</em>, <em>Sign up</em>. Then press <strong>Next</strong>."

COM_ALFA_GUIDEDTOUR_MENU_REGISTER_5_TITLE="Step 4. Click Select, here"
COM_ALFA_GUIDEDTOUR_MENU_REGISTER_5_DESC="This row is <strong>Menu Item Type</strong>: the empty box and the blue <strong>Select</strong> button beside it. Click <strong>Select</strong>."

COM_ALFA_GUIDEDTOUR_MENU_REGISTER_6_TITLE="Step 5. Click Alfa Commerce"
COM_ALFA_GUIDEDTOUR_MENU_REGISTER_6_DESC="Click the <strong>Alfa Commerce</strong> heading at the top. Joomla's own <strong>Users</strong> group further down also offers a registration type; that one is the plain form, without your shop fields."

COM_ALFA_GUIDEDTOUR_MENU_REGISTER_7_TITLE="Step 6. Click Registration"
COM_ALFA_GUIDEDTOUR_MENU_REGISTER_7_DESC="Click <strong>Registration</strong>, the one under Alfa Commerce. That is the form that carries your fields."

COM_ALFA_GUIDEDTOUR_MENU_REGISTER_8_TITLE="Step 7. Confirm the menu"
COM_ALFA_GUIDEDTOUR_MENU_REGISTER_8_DESC="Right hand column, same tab. <strong>Menu</strong> decides where it appears. Many shops put it in a menu nothing displays, because the login form links to it anyway."

COM_ALFA_GUIDEDTOUR_MENU_REGISTER_9_TITLE="Step 8. Public, or nobody can join"
COM_ALFA_GUIDEDTOUR_MENU_REGISTER_9_DESC="<strong>Access</strong> stays <strong>Public</strong>. The people who need this page do not have an account yet, by definition. <strong>Status</strong> Published, and not the default page."

COM_ALFA_GUIDEDTOUR_MENU_REGISTER_10_MONO_TITLE="Step 9. Language"
COM_ALFA_GUIDEDTOUR_MENU_REGISTER_10_MONO_DESC="Your site speaks one language, so this item is for <strong>All</strong> languages and there is nothing to choose. That is the Details tab finished."

COM_ALFA_GUIDEDTOUR_MENU_REGISTER_10_ML_TITLE="Step 9. Pick this item's language"
COM_ALFA_GUIDEDTOUR_MENU_REGISTER_10_ML_DESC="Choose the language this sign up page is for, and repeat the tour for the others. A form in the wrong language is a customer who does not sign up. That is the Details tab finished."

COM_ALFA_GUIDEDTOUR_MENU_REGISTER_11_TITLE="Everything else lives in these tabs"
COM_ALFA_GUIDEDTOUR_MENU_REGISTER_11_DESC="The page works now. What follows is what the other tabs are for, so you know where to come back to. Nothing in them is required."

COM_ALFA_GUIDEDTOUR_MENU_REGISTER_12_TITLE="Layouts"
COM_ALFA_GUIDEDTOUR_MENU_REGISTER_12_DESC="One picker for the form's layout; <strong>Use Global</strong> follows Alfa's Options. The page shown after a successful sign up is part of the flow rather than a choice: override it as a file if it must say something different."

COM_ALFA_GUIDEDTOUR_MENU_REGISTER_13_TITLE="Associations, the tab multilingual sites cannot skip"
COM_ALFA_GUIDEDTOUR_MENU_REGISTER_13_DESC="Open <strong>Associations</strong> and point this page at its twin in each other language, so a visitor who switches language while signing up stays on the sign up form. The checklist reports the ones that are not associated and can tie them for you."

COM_ALFA_GUIDEDTOUR_MENU_REGISTER_END_TITLE="Save it, or close the tour"
COM_ALFA_GUIDEDTOUR_MENU_REGISTER_END_DESC="Once saved, open the page as a guest and you will see Joomla's account fields with your shop fields among them. Which fields appear, and which are required, is decided under Form Fields: a field's registration flag is what puts it on this page. Nothing in this tour has been saved for you. Press <strong>Save</strong> or <strong>Save &amp; Close</strong> to keep what is on this form, or <strong>Complete</strong> to close the tour without saving anything. Either way, the tour ends here."

; Tour: menu_shop
COM_ALFA_GUIDEDTOUR_MENU_SHOP_TITLE="Menu item: the shop page"
COM_ALFA_GUIDEDTOUR_MENU_SHOP_DESC="Build the page your items live on: the Items type, from New to Save, including the choice that decides whether it is your whole catalogue or one category."

; Order follows the FORM, not the feature list: everything on the Details tab is
; done first (title, type, category, menu, access, language), and only then are the
; other tabs explained as a group. Steps 5 to 7 walk the type window, which is a
; same-origin iframe the tour engine also runs in. The _MONO and _ML pair and the
; association step are seeded per site shape by TourSeeder.

COM_ALFA_GUIDEDTOUR_MENU_SHOP_1_TITLE="What you are about to build"
COM_ALFA_GUIDEDTOUR_MENU_SHOP_1_DESC="The shop page: your item listing, with its filters, its paging and its sort order. Until a menu item points at it, the catalogue has no place in your navigation and no address a search engine can keep. We fill in one screen, top to bottom, and save. Press <strong>Next</strong> to start."

COM_ALFA_GUIDEDTOUR_MENU_SHOP_2_TITLE="Step 1. Choose the menu"
COM_ALFA_GUIDEDTOUR_MENU_SHOP_2_DESC="This dropdown filters the list, and it is also the reminder to decide where the page belongs. Pick the menu your site actually shows, usually <strong>Main Menu</strong>. You can leave it on All Menu Items; the form asks again later, and that answer is the one that counts."

COM_ALFA_GUIDEDTOUR_MENU_SHOP_3_TITLE="Step 2. Click New"
COM_ALFA_GUIDEDTOUR_MENU_SHOP_3_DESC="Click the green <strong>New</strong> button in the toolbar. The empty menu item form opens on its <strong>Details</strong> tab, and everything in the next few steps is on that one tab."

COM_ALFA_GUIDEDTOUR_MENU_SHOP_4_TITLE="Step 3. Type the title"
COM_ALFA_GUIDEDTOUR_MENU_SHOP_4_DESC="Click in the <strong>Title</strong> box and type what shoppers should read in the navigation: <em>Shop</em>, <em>Store</em>, <em>Items</em>. Joomla builds the web address from it, so this becomes part of the URL. Then press <strong>Next</strong>."

COM_ALFA_GUIDEDTOUR_MENU_SHOP_5_TITLE="Step 4. Click Select, here"
COM_ALFA_GUIDEDTOUR_MENU_SHOP_5_DESC="This row is <strong>Menu Item Type</strong>: an empty box, and a blue <strong>Select</strong> button beside it. The type decides what the page shows; everything else on this form only adjusts it. Click <strong>Select</strong> and a window opens."

COM_ALFA_GUIDEDTOUR_MENU_SHOP_6_TITLE="Step 5. Click Alfa Commerce"
COM_ALFA_GUIDEDTOUR_MENU_SHOP_6_DESC="The window lists every page type installed on this site, and it opens closed: one heading per extension, nothing underneath. Click the <strong>Alfa Commerce</strong> heading, at the top, and its types unfold."

COM_ALFA_GUIDEDTOUR_MENU_SHOP_7_TITLE="Step 6. Click Items"
COM_ALFA_GUIDEDTOUR_MENU_SHOP_7_DESC="Click <strong>Items</strong>, the one described as <em>Show a list of Items</em>. Careful not to click <strong>Single Item</strong> just above it; that one is a single item's page. The window closes and the form reloads, back on the Details tab, now carrying the settings this type brings."

COM_ALFA_GUIDEDTOUR_MENU_SHOP_8_TITLE="Step 7. Whole catalogue, or one category"
COM_ALFA_GUIDEDTOUR_MENU_SHOP_8_DESC="Leave <strong>Category</strong> empty and this page shows everything you sell, which is what you want for the main Shop item. Choose a category instead and the page becomes that category: its address, its breadcrumbs and its layouts follow it, which is how a category gets a permanent home in the navigation. This is the page's identity, not a filter; filtering is a tab we come to later."

COM_ALFA_GUIDEDTOUR_MENU_SHOP_9_TITLE="Step 8. Confirm the menu"
COM_ALFA_GUIDEDTOUR_MENU_SHOP_9_DESC="Still the Details tab, right hand column. <strong>Menu</strong> is where this item will appear, and this is the answer that counts, whatever the list was filtered by earlier. A menu no module displays means a page nobody will find, so choose the one your site really shows."

COM_ALFA_GUIDEDTOUR_MENU_SHOP_10_TITLE="Step 9. Published, and Public"
COM_ALFA_GUIDEDTOUR_MENU_SHOP_10_DESC="<strong>Status</strong> must be Published. <strong>Access</strong> stays <strong>Public</strong>, because a shop nobody can browse sells nothing. <strong>Default Page</strong> is on this side too: switch it on if the shop should be the site's front page."

COM_ALFA_GUIDEDTOUR_MENU_SHOP_11_MONO_TITLE="Step 10. Language"
COM_ALFA_GUIDEDTOUR_MENU_SHOP_11_MONO_DESC="Your site speaks one language, so this item is for <strong>All</strong> languages and there is nothing to choose. That is the Details tab finished."

COM_ALFA_GUIDEDTOUR_MENU_SHOP_11_ML_TITLE="Step 10. Pick this item's language"
COM_ALFA_GUIDEDTOUR_MENU_SHOP_11_ML_DESC="Your site is multilingual, so a menu item belongs to one language. Choose the language this shop page is for. You will repeat this tour once per published language, which is what Alfa's checklist means by a reachable storefront. That is the Details tab finished; the tab that links the copies together comes at the end."

COM_ALFA_GUIDEDTOUR_MENU_SHOP_12_TITLE="Everything else lives in these tabs"
COM_ALFA_GUIDEDTOUR_MENU_SHOP_12_DESC="The page already works: you could save now and have a shop. What follows is what the other tabs are for, so you know where to come back to. Nothing in them is required, and every setting in them can stay on <strong>Use Global</strong>, which means it follows Alfa's Options instead of being decided here."

COM_ALFA_GUIDEDTOUR_MENU_SHOP_13_TITLE="Display Options, for this page only"
COM_ALFA_GUIDEDTOUR_MENU_SHOP_13_DESC="Click this tab to see them: the filter bar and its facets, whether subcategories are included, whether items without a picture get a placeholder, how many items fit on a page and how they are sorted. Change only what this page should do differently from the rest of the shop. Page size and sorting are resolved most specific first: the browsed category, then this menu item, then Options, and the shopper's own choice beats all three."

COM_ALFA_GUIDEDTOUR_MENU_SHOP_14_TITLE="Preset Filters, if you want a landing page"
COM_ALFA_GUIDEDTOUR_MENU_SHOP_14_DESC="This tab is how a <em>Sale</em> page or an <em>Under 50</em> page is made from the same type. The filters you set here decide what the page shows before the visitor touches anything, on a clean address with no query string. They are a starting point, not a lock: the moment the shopper changes a filter, their choice is the whole truth of the page. Leave it alone for your main Shop item."

COM_ALFA_GUIDEDTOUR_MENU_SHOP_15_TITLE="Layouts, if the default is not the look you want"
COM_ALFA_GUIDEDTOUR_MENU_SHOP_15_DESC="The listing, its item card, the subcategory block, and the item page a shopper opens from here can each be swapped for another layout, one Alfa ships or one your template provides. The item layouts here are a fallback: an item with its own layout, or a category naming one, keeps it wherever the shopper came from."

COM_ALFA_GUIDEDTOUR_MENU_SHOP_16_TITLE="Associations, the tab multilingual sites cannot skip"
COM_ALFA_GUIDEDTOUR_MENU_SHOP_16_DESC="Open <strong>Associations</strong> and pick this page's twin in each other language. Without it the language switcher has no idea that your English shop and your Greek shop are the same page, so a shopper switching language is dropped on the front page instead. If the other language's shop does not exist yet, save this one, build that one, then come back and link them. Alfa's checklist reports any storefront page whose copies are not associated, and can tie them in one click."

COM_ALFA_GUIDEDTOUR_MENU_SHOP_END_TITLE="Save it, or close the tour"
COM_ALFA_GUIDEDTOUR_MENU_SHOP_END_DESC="Once saved, open your site in another tab and the shop is in the menu. If the menu shows nothing at all, it is the menu module for that menu that is unpublished, not this item. Then run <strong>Menu item: the cart page</strong>, because a shop without a cart cannot take an order. Nothing in this tour has been saved for you. Press <strong>Save</strong> or <strong>Save &amp; Close</strong> to keep what is on this form, or <strong>Complete</strong> to close the tour without saving anything. Either way, the tour ends here."

; Tour: notifications
COM_ALFA_GUIDEDTOUR_NOTIFICATIONS_TITLE="Notifications"
COM_ALFA_GUIDEDTOUR_NOTIFICATIONS_DESC="What the shop is trying to tell you."

COM_ALFA_GUIDEDTOUR_NOTIFICATIONS_STEP_1_TITLE="Open Notifications"
COM_ALFA_GUIDEDTOUR_NOTIFICATIONS_STEP_1_DESC="Alfa watches its own shop and speaks up when something needs a person: a new order landed, an item fell into its low-stock band, you sold more than you had, a renewal charge failed, an invoice could not be issued, setup steps are still missing, or the installed files no longer match the official release. The bell in every other toolbar carries the unread count; this screen is the full history. In the menu on the left, click <strong>Notifications</strong>."
COM_ALFA_GUIDEDTOUR_NOTIFICATIONS_STEP_2_TITLE="Reading an entry"
COM_ALFA_GUIDEDTOUR_NOTIFICATIONS_STEP_2_DESC="Each entry has a severity, the group that raised it (orders, stock, payments, setup, integrity) and its state. Severity tells you whether it can wait; the group tells you which part of the shop to go and look at. Press Next."
COM_ALFA_GUIDEDTOUR_NOTIFICATIONS_STEP_3_TITLE="Active, or everything"
COM_ALFA_GUIDEDTOUR_NOTIFICATIONS_STEP_3_DESC="<strong>Filter Options</strong> switches between what is still active and the whole history, and narrows by group or severity. Search matches the title and the message, which is the quickest way back to something you half remember. Press Next."
COM_ALFA_GUIDEDTOUR_NOTIFICATIONS_STEP_4_TITLE="Clearing it"
COM_ALFA_GUIDEDTOUR_NOTIFICATIONS_STEP_4_DESC="Dismissing an entry archives it: it leaves the active list but stays in the history, so nothing you were told is ever lost. Many entries clear themselves: the ones that describe a state, like a setup step still missing, disappear as soon as the state changes. A list that empties on its own is the shop telling you the problem is fixed. Press Next."

COM_ALFA_GUIDEDTOUR_NOTIFICATIONS_END_TITLE="End of the tour"
COM_ALFA_GUIDEDTOUR_NOTIFICATIONS_END_DESC="Watch the bell; when it turns red, whatever needs you is here with the group that raised it. This tour changed nothing. Press <strong>Complete</strong> to close it."

; Tour: order_statuses
COM_ALFA_GUIDEDTOUR_ORDER_STATUSES_TITLE="Create an order status"
COM_ALFA_GUIDEDTOUR_ORDER_STATUSES_DESC="The states an order moves through."

COM_ALFA_GUIDEDTOUR_ORDER_STATUSES_STEP_1_TITLE="Open Order Statuses"
COM_ALFA_GUIDEDTOUR_ORDER_STATUSES_STEP_1_DESC="A status is where an order stands: pending, paid, shipped, cancelled. It is what you filter the order list by, what the customer sees in their account, and what can trigger a notification email. In the menu on the left, click <strong>Order Statuses</strong>."
COM_ALFA_GUIDEDTOUR_ORDER_STATUSES_STEP_2_TITLE="Start a new status"
COM_ALFA_GUIDEDTOUR_ORDER_STATUSES_STEP_2_DESC="Click <strong>New</strong>."
COM_ALFA_GUIDEDTOUR_ORDER_STATUSES_STEP_3_TITLE="Name it"
COM_ALFA_GUIDEDTOUR_ORDER_STATUSES_STEP_3_DESC="Give it the internal name your team works with, and the customer-facing name shoppers read on their order, both in every language your store speaks. Then press Next."

COM_ALFA_GUIDEDTOUR_ORDER_STATUSES_END_TITLE="Save it, or close the tour"
COM_ALFA_GUIDEDTOUR_ORDER_STATUSES_END_DESC="Moving an order into the status applies whatever you configured for it, and the order history keeps a record of every move. Nothing in this tour has been saved for you. Press <strong>Save</strong> or <strong>Save &amp; Close</strong> to keep what is on this form, or <strong>Complete</strong> to close the tour without saving anything. Either way, the tour ends here."

; Tour: orders
COM_ALFA_GUIDEDTOUR_ORDERS_TITLE="Working with orders"
COM_ALFA_GUIDEDTOUR_ORDERS_DESC="Find an order, read it, and move it forward."

COM_ALFA_GUIDEDTOUR_ORDERS_STEP_1_TITLE="Open Orders"
COM_ALFA_GUIDEDTOUR_ORDERS_STEP_1_DESC="Orders is the screen you live in once the shop is open: every basket that reached checkout is a row here, newest first, with what was bought, what was paid, and how far the delivery has got. Most days you will work entirely from this list. In the menu on the left, click <strong>Orders</strong>."
COM_ALFA_GUIDEDTOUR_ORDERS_STEP_2_TITLE="Find an order"
COM_ALFA_GUIDEDTOUR_ORDERS_STEP_2_DESC="Search matches the customer name, their email, the order reference and the payment method it was placed with, so a phone call that starts with any of those ends here. Typing <em>id:31</em> jumps straight to order 31 instead of searching. Press Next."
COM_ALFA_GUIDEDTOUR_ORDERS_STEP_3_TITLE="Active or trashed"
COM_ALFA_GUIDEDTOUR_ORDERS_STEP_3_DESC="<strong>Filter Options</strong> opens the drawer that switches between active orders and the trash: a trashed order keeps its number and its history, it just leaves the working list. Trashing is reversible from the same drawer; emptying the trash is not. Press Next."
COM_ALFA_GUIDEDTOUR_ORDERS_STEP_4_TITLE="Open a row without leaving"
COM_ALFA_GUIDEDTOUR_ORDERS_STEP_4_DESC="The Quick view button under each order number unfolds a read-only summary of that order: its items with quantities and unit prices, its shipments, its payments with their transaction ids, any discount codes, and the notes. Most questions are answered here without opening the order at all. Press Next."
COM_ALFA_GUIDEDTOUR_ORDERS_STEP_5_TITLE="Paid, and shipped"
COM_ALFA_GUIDEDTOUR_ORDERS_STEP_5_DESC="Two independent states live on every row. The payment pill says Paid, Partial with a percentage, Unpaid, Refunded or Partially refunded; it is computed from the payments actually recorded, not from a label someone set. Beside it the shipment lines and the fulfilment badge say how many lines have physically left. Paid but unfulfilled is your picking list; fulfilled but unpaid is your phone list. Press Next."
COM_ALFA_GUIDEDTOUR_ORDERS_STEP_6_TITLE="Move it along"
COM_ALFA_GUIDEDTOUR_ORDERS_STEP_6_DESC="The status dropdown on the row changes the order the moment you pick a value; there is no Save on this screen and no confirmation, so treat it as a real action. It is the status a customer sees in their account, and it is what can trigger their notification email. Press Next."
COM_ALFA_GUIDEDTOUR_ORDERS_STEP_7_TITLE="Open an order"
COM_ALFA_GUIDEDTOUR_ORDERS_STEP_7_DESC="Click the order number badge: that is the way in. Everything after this is the same order seen from different angles."
COM_ALFA_GUIDEDTOUR_ORDERS_STEP_8_TITLE="Its details"
COM_ALFA_GUIDEDTOUR_ORDERS_STEP_8_DESC="The left column holds who the order is for; the right holds what it is: id, customer account, creation date and the order status. A blank customer means a guest order, and the guest details live in the customer fields beside it. Press Next."
COM_ALFA_GUIDEDTOUR_ORDERS_STEP_9_TITLE="The items"
COM_ALFA_GUIDEDTOUR_ORDERS_STEP_9_DESC="These lines are frozen as they were at checkout (name, variant, quantity, unit price, tax), so a later price change never rewrites an old order. You can still add, edit or remove a line when you agree something with the customer by phone. Press Next."
COM_ALFA_GUIDEDTOUR_ORDERS_STEP_10_TITLE="The money"
COM_ALFA_GUIDEDTOUR_ORDERS_STEP_10_DESC="Payments record what was actually taken: each attempt with its method, amount, state and transaction id, plus refunds. The order counts as paid when the payments add up, which is why partial payments and part refunds each keep their own line rather than moving a single flag. Press Next."
COM_ALFA_GUIDEDTOUR_ORDERS_STEP_11_TITLE="The delivery"
COM_ALFA_GUIDEDTOUR_ORDERS_STEP_11_DESC="Shipments record what has physically left, with carrier and tracking. An order can ship in several parcels, each carrying its own lines, so one back-ordered item does not hold up the rest. Press Next."
COM_ALFA_GUIDEDTOUR_ORDERS_STEP_12_TITLE="Its documents"
COM_ALFA_GUIDEDTOUR_ORDERS_STEP_12_DESC="Invoices, receipts, delivery notes and credit notes are issued here, from the order: pick the type, and Alfa numbers the document from the matching series and files it against this order. That is why the Sales Documents screen is a register of what was issued rather than a place to create paperwork. Press Next."
COM_ALFA_GUIDEDTOUR_ORDERS_STEP_13_TITLE="The history"
COM_ALFA_GUIDEDTOUR_ORDERS_STEP_13_DESC="History is the audit trail: status changes, payments, shipments and documents in order, with who did what and when. When a customer disputes something, this is the tab that answers it. Press Next."

COM_ALFA_GUIDEDTOUR_ORDERS_END_TITLE="Save it, or close the tour"
COM_ALFA_GUIDEDTOUR_ORDERS_END_DESC="Orders arrive by themselves from checkout; <strong>New</strong> is there for the ones you take by phone: save the shell first, then add its items, payments and shipments. Nothing in this tour has been saved for you. Press <strong>Save</strong> or <strong>Save &amp; Close</strong> to keep what is on this form, or <strong>Complete</strong> to close the tour without saving anything. Either way, the tour ends here."

; Tour: payments
COM_ALFA_GUIDEDTOUR_PAYMENTS_TITLE="Create a payment method"
COM_ALFA_GUIDEDTOUR_PAYMENTS_DESC="How checkout takes money."

COM_ALFA_GUIDEDTOUR_PAYMENTS_STEP_1_TITLE="Open Payment Methods"
COM_ALFA_GUIDEDTOUR_PAYMENTS_STEP_1_DESC="A payment method is what the shopper picks at checkout: card, bank transfer, cash on delivery. Each one is a row here, driven by a payment plugin behind it. In the menu on the left, click <strong>Payment Methods</strong>."
COM_ALFA_GUIDEDTOUR_PAYMENTS_STEP_2_TITLE="Start a new method"
COM_ALFA_GUIDEDTOUR_PAYMENTS_STEP_2_DESC="Click <strong>New</strong>."
COM_ALFA_GUIDEDTOUR_PAYMENTS_STEP_3_TITLE="Name it"
COM_ALFA_GUIDEDTOUR_PAYMENTS_STEP_3_DESC="This is the label the shopper reads at checkout. Clear beats clever, and it needs to exist in every language your store speaks. Then press Next."
COM_ALFA_GUIDEDTOUR_PAYMENTS_STEP_4_TITLE="Pick its type"
COM_ALFA_GUIDEDTOUR_PAYMENTS_STEP_4_DESC="The <strong>Type</strong> is the plugin that actually does the work: it decides which settings appear below, how the payment is captured, and what happens on refunds. Change it and the settings underneath change with it. Press Next."

COM_ALFA_GUIDEDTOUR_PAYMENTS_END_TITLE="Save it, or close the tour"
COM_ALFA_GUIDEDTOUR_PAYMENTS_END_DESC="Published methods appear at checkout for the carts they apply to; unpublish one to pull it without losing its settings or the orders that used it. Nothing in this tour has been saved for you. Press <strong>Save</strong> or <strong>Save &amp; Close</strong> to keep what is on this form, or <strong>Complete</strong> to close the tour without saving anything. Either way, the tour ends here."

; Tour: places
COM_ALFA_GUIDEDTOUR_PLACES_TITLE="Countries and states"
COM_ALFA_GUIDEDTOUR_PLACES_DESC="The geography behind tax, shipping and addresses."

COM_ALFA_GUIDEDTOUR_PLACES_STEP_1_TITLE="Open Countries/States"
COM_ALFA_GUIDEDTOUR_PLACES_STEP_1_DESC="Places are the geography your shop trades in: countries, and the regions nested under them. Publishing a country is how you say we sell and ship here; taxes, discounts, payment methods, shipping methods and catalogue visibility can each be limited to a set of places, so this quiet list decides a lot. In the menu on the left, click <strong>Countries/States</strong>."
COM_ALFA_GUIDEDTOUR_PLACES_STEP_2_TITLE="The world, mostly switched off"
COM_ALFA_GUIDEDTOUR_PLACES_STEP_2_DESC="The list ships with the whole world already in it, and almost all of it unpublished; a new shop starts with only its own country live. So the usual job here is not adding rows but publishing the ones you serve. Each place carries its two- and three-letter ISO codes, the codes couriers and gateways speak, and the currency normally used there. Press Next."
COM_ALFA_GUIDEDTOUR_PLACES_STEP_3_TITLE="Add a place"
COM_ALFA_GUIDEDTOUR_PLACES_STEP_3_DESC="Click <strong>New</strong>, for a country of your own, or for a region inside one."
COM_ALFA_GUIDEDTOUR_PLACES_STEP_4_TITLE="Name it"
COM_ALFA_GUIDEDTOUR_PLACES_STEP_4_DESC="This is the name shoppers read in the country selector at checkout and on their address. Then press Next."
COM_ALFA_GUIDEDTOUR_PLACES_STEP_5_TITLE="Its ISO codes"
COM_ALFA_GUIDEDTOUR_PLACES_STEP_5_DESC="The two- and three-letter codes are what integrations match on: a courier quoting a price, a gateway checking a billing country, a tax rule targeting a market. Correct codes make everything downstream line up; invented ones fail silently. Press Next."
COM_ALFA_GUIDEDTOUR_PLACES_STEP_6_TITLE="Currency and parent"
COM_ALFA_GUIDEDTOUR_PLACES_STEP_6_DESC="The currency is the one normally used there. The parent turns this row into a region inside a country, which is what lets you charge one rate on the mainland and another on an island group. Press Next."

COM_ALFA_GUIDEDTOUR_PLACES_END_TITLE="Save it, or close the tour"
COM_ALFA_GUIDEDTOUR_PLACES_END_DESC="To stop serving somewhere, unpublish it rather than delete it: deleting a place also strips it out of every tax, discount, payment and shipping rule that pointed at it. Nothing in this tour has been saved for you. Press <strong>Save</strong> or <strong>Save &amp; Close</strong> to keep what is on this form, or <strong>Complete</strong> to close the tour without saving anything. Either way, the tour ends here."

; Tour: product
COM_ALFA_GUIDEDTOUR_PRODUCT_TITLE="An item, from top to bottom"
COM_ALFA_GUIDEDTOUR_PRODUCT_DESC="One walk through everything an item record holds: what it is called, what identifies it, where it lives, what it costs, how it varies and what it looks like. Nothing is clicked for you and nothing is saved until you say so."

; The single product tour. Every step is a plain Next: the merchant reads, looks,
; and clicks whatever they like; the tour never presses anything on their behalf.

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_1_TITLE="Everything an item holds"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_1_DESC="This walk goes through one item from top to bottom: its name and codes, the category it belongs to, the stock behind it, what it costs, how it varies, and its pictures. We will open a brand-new item to look at, and nothing gets saved unless you decide to save it. Press Next."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_2_TITLE="Where items live"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_2_DESC="Items, in the Alfa menu on the left: this is the list of everything you sell, and where you will come back to find an item, check its stock at a glance or open it for editing. The tour brought you here; from now on you know the way."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_3_TITLE="Open a new item"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_3_DESC="Press New. This is the only thing the tour asks you to click; from here on you just read, and you are free to type, open tabs and click whatever you like while the tour follows along."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_4_TITLE="The name buyers read"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_4_DESC="The item's public name, and the only field that is truly required. One box per content language: the storefront shows each shopper the name in their own language, and the URL alias is generated from it when you save, so a Greek name produces a readable Greek address, not a string of question marks."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_5_TITLE="SKU and the other identifiers"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_5_DESC="The SKU is your own code for this item: what your shelves, your invoices and your supplier call it. Next to it sit GTIN (the barcode number, EAN or UPC) and MPN (the manufacturer's own part number). None is required, but marketplaces and price comparison sites ask for the barcode, and stock counts are far easier to trust when every item carries a code you recognise."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_6_TITLE="Short and full description"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_6_DESC="The short description is the summary that travels: listings, cart lines, the top of the item page. The full description below it is the long story with formatting and images. Both are per language, and both are optional: an item with no description still sells, it just sells less."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_7_TITLE="The category it belongs to"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_7_DESC="This is the one category field you have to fill, and for most items it is the only one you need to touch. It is the item's home: it builds the URL and the breadcrumb the shopper sees, and when you save, Alfa files the item into this category automatically; you do not have to repeat it in the list below. It also decides which item fields the item may use, so an item filed under Clothing can offer Size while one under Books cannot."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_8_TITLE="Extra placements (optional)"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_8_DESC="Leave this alone unless the item genuinely belongs in more than one place, a raincoat that should appear under both Outerwear and Sale, for instance. The home category above is already included, so anything you add here is in addition to it. Extra placements widen where shoppers can find the item, and widen which item fields it may use."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_9_TITLE="Logistics: stock and shipping"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_9_DESC="This tab carries the physical facts: whether you count stock, how many you have, what happens when you run out, and the weight and dimensions the shipping methods price against. Open it if you want to follow along; the next few steps look at the stock side."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_10_TITLE="Do you count this one?"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_10_DESC="Manage stock turns counting on or off for this item. Off means it can always be bought: right for a service, a download or a made-to-order piece. On means every order moves the number, and the storefront stops selling when there is nothing left to sell."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_11_TITLE="How many you have"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_11_DESC="The quantity on hand. You can type it here, but from the day the shop opens it is safer to let it move on its own: orders take stock away, returns and receipts put it back, and every change is written down under Inventory movements so you can see why a number is what it is."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_12_TITLE="What happens at zero"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_12_DESC="When the count reaches nothing you can hide the item, show it as out of stock, or keep selling it as a backorder. Pick the one that matches how you actually trade; a shop that quietly hides sold-out items loses the search traffic those pages had earned."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_13_TITLE="Pricing & Combinations"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_13_DESC="This tab carries the money and the variations, in that order: the price rows first, then (if the item comes in sizes or colours) the variants those choices produce, the options that do not create a variant, and the specs a buyer only reads. Open it and the next steps walk down it."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_14_TITLE="The price rows"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_14_DESC="An item does not have one price, it has rules. Each row is a price with conditions: a quantity range for wholesale steps, a date range for a promotion, and who it applies to: a currency, a country, a user group, a single customer. The storefront picks the most specific row that matches the shopper in front of it, and the row also shows what the buyer ends up paying once tax and any cart discount have been applied."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_15_TITLE="Adding another price"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_15_DESC="Add price gives you another rule. Start with one plain row and no conditions; that is your normal price. Add a second, narrower row when you want something specific: ten or more at a lower unit price, a members' price for one user group, a two-week sale that expires on its own."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_16_TITLE="Variations: the things you actually sell"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_16_DESC="If an item comes in sizes or colours, each purchasable pairing is a variation: Red / S is a different thing to stock, price and photograph than Blue / M. Variations are built from item fields: a field such as Size that carries a list of values. If this section tells you there are none yet, it will also show you where to make one."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_17_TITLE="Generate combinations"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_17_DESC="This builds the grid for you: pick the fields that matter (say Size and Colour) and it creates every pairing at once, keeping the rows that already exist and their data. Each row is then its own stock unit with its own SKU, stock, price and pictures. The button only appears when the item has fields to combine, so if you do not see it there is nothing to build from yet."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_18_TITLE="Options: choices that are not variants"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_18_DESC="Some choices change the order without creating a separate thing to stock: gift wrapping, an engraving font, a warranty extension. Those are options. They come from the same item fields, they can carry a surcharge, and they are remembered on the order line, but they never multiply your inventory."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_19_TITLE="Informational: the specs"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_19_DESC="Material, warranty, country of origin: facts the buyer reads and never picks. Informational fields are the specification table on the item page, and because they are real fields rather than free text, shoppers can filter on them: everything in cotton, everything with a two-year warranty."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_20_TITLE="Images"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_20_DESC="The item gallery lives behind this tab: every picture a shopper will see on the item page and in listings. Open it and the next step looks at where the files go. Downloads, the tab beside it, is a different thing: files a buyer receives after paying, not pictures of the goods."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_21_TITLE="Pictures"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_21_DESC="Drag image files straight onto this area, or use Insert media to pick from the media library. The order you drag them into is the order shoppers see, and the first one becomes the thumbnail the listings use; each image can carry its own description for accessibility and SEO. Variations can have their own gallery too (open a variation row and it has this same drop area), so choosing Red on the item page can change the picture. The Downloads tab that follows is a different thing: files a buyer receives after paying."

COM_ALFA_GUIDEDTOUR_PRODUCT_END_TITLE="Save it, or close the tour"
COM_ALFA_GUIDEDTOUR_PRODUCT_END_DESC="<strong>Save</strong> keeps your work and leaves you on this form, which is what you want while you are still filling things in; <strong>Save &amp; Close</strong> returns to the list. Nothing in this tour has been saved for you. Press <strong>Save</strong> or <strong>Save &amp; Close</strong> to keep what is on this form, or <strong>Complete</strong> to close the tour without saving anything. Either way, the tour ends here."

; Tour: sales_documents
COM_ALFA_GUIDEDTOUR_SALES_DOCUMENTS_TITLE="Sales documents"
COM_ALFA_GUIDEDTOUR_SALES_DOCUMENTS_DESC="The register of what your shop has issued."

COM_ALFA_GUIDEDTOUR_SALES_DOCUMENTS_STEP_1_TITLE="Open Sales Documents"
COM_ALFA_GUIDEDTOUR_SALES_DOCUMENTS_STEP_1_DESC="This is the shop legal archive: every invoice, retail receipt, credit note and delivery note ever issued, across all orders, newest first. It is a register rather than a workbench: documents are issued from an order and numbered by a series, so there is nothing to create here. In the menu on the left, click <strong>Sales Documents</strong>."
COM_ALFA_GUIDEDTOUR_SALES_DOCUMENTS_STEP_2_TITLE="Find a document"
COM_ALFA_GUIDEDTOUR_SALES_DOCUMENTS_STEP_2_DESC="Search matches the printed number, the buyer name and their VAT number, and <em>order:123</em> pulls up everything issued for one order. <strong>Filter Options</strong> adds the document type and the date range when you are reconciling a period. Press Next."
COM_ALFA_GUIDEDTOUR_SALES_DOCUMENTS_STEP_3_TITLE="Reading a row"
COM_ALFA_GUIDEDTOUR_SALES_DOCUMENTS_STEP_3_DESC="A row carries the printed number and its series code, the type, the buyer with their VAT number, the order behind it, the total with and without tax, the issue date, and whether it still stands or has been voided. That number is the identity an accountant will ask about, and it is never reused. Press Next."
COM_ALFA_GUIDEDTOUR_SALES_DOCUMENTS_STEP_4_TITLE="Print, download, void"
COM_ALFA_GUIDEDTOUR_SALES_DOCUMENTS_STEP_4_DESC="The row actions reprint the document exactly as the customer received it, using the layout its series carries, and hand you the PDF. A document that must not stand is voided, never deleted: it keeps its number and stays visible, because a gap in a numbering sequence is what an audit questions. Press Next."
COM_ALFA_GUIDEDTOUR_SALES_DOCUMENTS_STEP_5_TITLE="Where the numbers come from"
COM_ALFA_GUIDEDTOUR_SALES_DOCUMENTS_STEP_5_DESC="<strong>Document Series</strong> is the numbering book behind these rows: prefix, next number, whether it restarts each year, and the seller details printed on the paper. Press Next."
COM_ALFA_GUIDEDTOUR_SALES_DOCUMENTS_STEP_6_TITLE="And what they mean"
COM_ALFA_GUIDEDTOUR_SALES_DOCUMENTS_STEP_6_DESC="<strong>Document Types</strong> holds the accounting meaning of each kind: whether it carries prices, whether it moves stock, whether it credits an earlier document. Press Next."

COM_ALFA_GUIDEDTOUR_SALES_DOCUMENTS_END_TITLE="End of the tour"
COM_ALFA_GUIDEDTOUR_SALES_DOCUMENTS_END_DESC="A fresh shop shows an empty register: issue the first document from an order, and it appears here with its number. This tour changed nothing. Press <strong>Complete</strong> to close it."

; Tour: shipping
COM_ALFA_GUIDEDTOUR_SHIPPING_TITLE="Create a shipping method"
COM_ALFA_GUIDEDTOUR_SHIPPING_DESC="How physical orders reach customers."

COM_ALFA_GUIDEDTOUR_SHIPPING_STEP_1_TITLE="Open Shipment Methods"
COM_ALFA_GUIDEDTOUR_SHIPPING_STEP_1_DESC="A shipping method is an option in the delivery step (courier, pickup point, collect in store) with its own price rules. In the menu on the left, click <strong>Shipment Methods</strong>."
COM_ALFA_GUIDEDTOUR_SHIPPING_STEP_2_TITLE="Start a new method"
COM_ALFA_GUIDEDTOUR_SHIPPING_STEP_2_DESC="Click <strong>New</strong>."
COM_ALFA_GUIDEDTOUR_SHIPPING_STEP_3_TITLE="Name it"
COM_ALFA_GUIDEDTOUR_SHIPPING_STEP_3_DESC="The shopper reads this name next to the delivery price, so say what it means for them (how it arrives, how fast), in every language your store speaks. Then press Next."
COM_ALFA_GUIDEDTOUR_SHIPPING_STEP_4_TITLE="Pick its type"
COM_ALFA_GUIDEDTOUR_SHIPPING_STEP_4_DESC="The <strong>Type</strong> is the plugin behind the method: it decides how the cost is calculated (flat, per weight, per destination or quoted live by a carrier) and which settings appear below. Press Next."

COM_ALFA_GUIDEDTOUR_SHIPPING_END_TITLE="Save it, or close the tour"
COM_ALFA_GUIDEDTOUR_SHIPPING_END_DESC="Published methods are offered for physical carts that match their conditions; digital-only baskets skip the delivery step entirely. Nothing in this tour has been saved for you. Press <strong>Save</strong> or <strong>Save &amp; Close</strong> to keep what is on this form, or <strong>Complete</strong> to close the tour without saving anything. Either way, the tour ends here."

; Tour: stock_locations
COM_ALFA_GUIDEDTOUR_STOCK_LOCATIONS_TITLE="Create a stock location"
COM_ALFA_GUIDEDTOUR_STOCK_LOCATIONS_DESC="Warehouses and shops that hold inventory."

COM_ALFA_GUIDEDTOUR_STOCK_LOCATIONS_STEP_1_TITLE="Open Stock Locations"
COM_ALFA_GUIDEDTOUR_STOCK_LOCATIONS_STEP_1_DESC="A stock location is a real place that holds goods: a warehouse, a shop, a supplier. Stock is counted per location, so you can see what is where and fulfil from the right one. In the menu on the left, click <strong>Stock Locations</strong>."
COM_ALFA_GUIDEDTOUR_STOCK_LOCATIONS_STEP_2_TITLE="Start a new location"
COM_ALFA_GUIDEDTOUR_STOCK_LOCATIONS_STEP_2_DESC="Click <strong>New</strong>."
COM_ALFA_GUIDEDTOUR_STOCK_LOCATIONS_STEP_3_TITLE="Name it"
COM_ALFA_GUIDEDTOUR_STOCK_LOCATIONS_STEP_3_DESC="Name it the way your team refers to it (that name shows on stock figures, inventory movements and fulfilment), in every language your store speaks. Then press Next."

COM_ALFA_GUIDEDTOUR_STOCK_LOCATIONS_END_TITLE="Save it, or close the tour"
COM_ALFA_GUIDEDTOUR_STOCK_LOCATIONS_END_DESC="Once saved, items can hold stock at this location, and every movement in or out is recorded against it. Nothing in this tour has been saved for you. Press <strong>Save</strong> or <strong>Save &amp; Close</strong> to keep what is on this form, or <strong>Complete</strong> to close the tour without saving anything. Either way, the tour ends here."

; Tour: stock_movements
COM_ALFA_GUIDEDTOUR_STOCK_MOVEMENTS_TITLE="Stock movements"
COM_ALFA_GUIDEDTOUR_STOCK_MOVEMENTS_DESC="The ledger behind every stock figure."

COM_ALFA_GUIDEDTOUR_STOCK_MOVEMENTS_STEP_1_TITLE="Open Inventory Movements"
COM_ALFA_GUIDEDTOUR_STOCK_MOVEMENTS_STEP_1_DESC="Stock in Alfa is not a number you overwrite; it is the sum of everything that has moved. This screen is that journal: every time a quantity changed, and why. In the menu on the left, click <strong>Inventory Movements</strong>."
COM_ALFA_GUIDEDTOUR_STOCK_MOVEMENTS_STEP_2_TITLE="Reading a movement"
COM_ALFA_GUIDEDTOUR_STOCK_MOVEMENTS_STEP_2_DESC="A line says when it happened, which item and variant, at which location, whether stock went up or down and by how much, and, most usefully, its source: the order, the delivery note or invoice, the return, or the hand correction someone typed into an item's stock field. Rows are written by what happens in the shop; nothing is typed in here, which is why there is no New button. Press Next."
COM_ALFA_GUIDEDTOUR_STOCK_MOVEMENTS_STEP_3_TITLE="Answering a question"
COM_ALFA_GUIDEDTOUR_STOCK_MOVEMENTS_STEP_3_DESC="When the shelf and the screen disagree, open <strong>Filter Options</strong> and narrow by movement type and by location, then read the lines in order until the number stops making sense. That is also how you prove a shortage came from a sale rather than a miscount. Press Next."
COM_ALFA_GUIDEDTOUR_STOCK_MOVEMENTS_STEP_4_TITLE="Where stock lives"
COM_ALFA_GUIDEDTOUR_STOCK_MOVEMENTS_STEP_4_DESC="<strong>Stock Locations</strong> are the places that hold it: warehouse, shop, supplier. Every movement names one, so you always know not just how much you have but where it is. Press Next."
COM_ALFA_GUIDEDTOUR_STOCK_MOVEMENTS_STEP_5_TITLE="Stock that is spoken for"
COM_ALFA_GUIDEDTOUR_STOCK_MOVEMENTS_STEP_5_DESC="<strong>Stock Reservations</strong> is the other half of the picture: goods held for a basket or an unpaid order. They are still on the shelf, so no movement exists for them, but they are no longer available to sell. Press Next."

COM_ALFA_GUIDEDTOUR_STOCK_MOVEMENTS_END_TITLE="End of the tour"
COM_ALFA_GUIDEDTOUR_STOCK_MOVEMENTS_END_DESC="Treat the journal as the truth: if a figure looks wrong, the answer is a movement you have not read yet. This tour changed nothing. Press <strong>Complete</strong> to close it."

; Tour: stock_reservations
COM_ALFA_GUIDEDTOUR_STOCK_RESERVATIONS_TITLE="Stock reservations"
COM_ALFA_GUIDEDTOUR_STOCK_RESERVATIONS_DESC="Goods promised to a basket or an unpaid order."

COM_ALFA_GUIDEDTOUR_STOCK_RESERVATIONS_STEP_1_TITLE="Open Inventory Movements"
COM_ALFA_GUIDEDTOUR_STOCK_RESERVATIONS_STEP_1_DESC="Reservations sit next to the stock journal. In the menu on the left, click <strong>Inventory Movements</strong>."
COM_ALFA_GUIDEDTOUR_STOCK_RESERVATIONS_STEP_2_TITLE="Go to Stock Reservations"
COM_ALFA_GUIDEDTOUR_STOCK_RESERVATIONS_STEP_2_DESC="In the toolbar, click <strong>Stock Reservations</strong>."
COM_ALFA_GUIDEDTOUR_STOCK_RESERVATIONS_STEP_3_TITLE="What a reservation is"
COM_ALFA_GUIDEDTOUR_STOCK_RESERVATIONS_STEP_3_DESC="A reservation is stock promised to someone but not yet gone: the last unit sitting in a basket, or an order waiting for payment. The goods are still on your shelf, so there is no movement for them, but they are held back from what the storefront offers. Press Next."
COM_ALFA_GUIDEDTOUR_STOCK_RESERVATIONS_STEP_4_TITLE="Held, by what, until when"
COM_ALFA_GUIDEDTOUR_STOCK_RESERVATIONS_STEP_4_DESC="Each row names the item, the location, how much is held, what is holding it and when the hold expires. Expiry is what stops abandoned baskets from freezing your catalogue: when it passes, the stock is available again. A reservation that becomes a sale turns into a real movement instead. Press Next."

COM_ALFA_GUIDEDTOUR_STOCK_RESERVATIONS_END_TITLE="End of the tour"
COM_ALFA_GUIDEDTOUR_STOCK_RESERVATIONS_END_DESC="When an item shows as unavailable while the shelf is full, this screen is usually the answer. This tour changed nothing. Press <strong>Complete</strong> to close it."

; Tour: store_options
COM_ALFA_GUIDEDTOUR_STORE_OPTIONS_TITLE="Your business details"
COM_ALFA_GUIDEDTOUR_STORE_OPTIONS_DESC="The name customers see, the address your email is sent from, the currency you price in, and where uploaded pictures are kept: the settings everything else assumes."

; Options tour. This screen belongs to com_config, so the steps only point at
; things visible without opening anything: first-tab fields and the tab buttons.

COM_ALFA_GUIDEDTOUR_STORE_OPTIONS_STEP_1_TITLE="Where the basics live"
COM_ALFA_GUIDEDTOUR_STORE_OPTIONS_STEP_1_DESC="This is the Options screen; you reach it from the Options button on any Alfa screen. Four things here are worth getting right before you open: what you are called, where your email comes from, what you price in, and where uploaded pictures are kept. Everything else has a sensible default. Press Next."

COM_ALFA_GUIDEDTOUR_STORE_OPTIONS_STEP_2_TITLE="The name customers see"
COM_ALFA_GUIDEDTOUR_STORE_OPTIONS_STEP_2_DESC="Your public name. It heads the emails buyers receive, appears on invoices and receipts, and titles the dashboard you just came from. Use the name customers would recognise, not the legal entity; the legal details belong on the document templates."

COM_ALFA_GUIDEDTOUR_STORE_OPTIONS_STEP_3_TITLE="Where your email comes from"
COM_ALFA_GUIDEDTOUR_STORE_OPTIONS_STEP_3_DESC="The address order confirmations are sent from and replies come back to. Use a real, monitored mailbox on your own domain: an address that bounces, or one at a free provider, is the most common reason order emails land in spam."

COM_ALFA_GUIDEDTOUR_STORE_OPTIONS_STEP_4_TITLE="The currency you price in"
COM_ALFA_GUIDEDTOUR_STORE_OPTIONS_STEP_4_DESC="Open the Currency tab to set the default. Every price you type is stored in it, every total is calculated in it, and every report counts in it, so it is the one setting worth deciding before you enter a single price rather than after. Additional currencies are added under Currencies in the Alfa menu."

COM_ALFA_GUIDEDTOUR_STORE_OPTIONS_STEP_5_TITLE="Where pictures are kept"
COM_ALFA_GUIDEDTOUR_STORE_OPTIONS_STEP_5_DESC="The Images tab decides the folder uploads are written to, the thumbnail sizes generated for listings, and the placeholder shown when an item has no picture. If the checklist told you the media folder is not writable, this tab is where you see which folder it means."

COM_ALFA_GUIDEDTOUR_STORE_OPTIONS_STEP_6_TITLE="Who may do what"
COM_ALFA_GUIDEDTOUR_STORE_OPTIONS_STEP_6_DESC="Permissions maps every Alfa action onto Joomla's user groups: who can edit items, who can refund, who may read search analytics. Worth a visit the day you give someone else an account; until then the defaults keep everything with administrators."

COM_ALFA_GUIDEDTOUR_STORE_OPTIONS_END_TITLE="Save it, or close the tour"
COM_ALFA_GUIDEDTOUR_STORE_OPTIONS_END_DESC="Saving writes the settings; <strong>Save &amp; Close</strong> also returns you where you came from. Nothing in this tour has been saved for you. Press <strong>Save</strong> or <strong>Save &amp; Close</strong> to keep what is on this form, or <strong>Complete</strong> to close the tour without saving anything. Either way, the tour ends here."

; Tour: storefront_menu
COM_ALFA_GUIDEDTOUR_STOREFRONT_MENU_TITLE="Putting the shop on the site"
COM_ALFA_GUIDEDTOUR_STOREFRONT_MENU_DESC="Which menu item type builds which page, which ones your shop actually needs, and which tour to run for each. Read this one first; it creates nothing."

; The chooser. It explains and points at the four builders; it creates nothing, and
; every anchor is on the menu items list.

COM_ALFA_GUIDEDTOUR_STOREFRONT_MENU_STEP_1_TITLE="A page exists when a menu item points at it"
COM_ALFA_GUIDEDTOUR_STOREFRONT_MENU_STEP_1_DESC="Your items are real the moment you save them, but shoppers reach them through a menu item, and that is also what gives a page the stable address search engines keep. This tour builds nothing. It shows which type makes which page, so the four tours after it can each build one, click by click. Press <strong>Next</strong>."

COM_ALFA_GUIDEDTOUR_STOREFRONT_MENU_STEP_2_TITLE="Menus first"
COM_ALFA_GUIDEDTOUR_STOREFRONT_MENU_STEP_2_DESC="Everything you create goes into one of these. Pick the menu your site actually shows, usually <strong>Main Menu</strong>; an item in a menu no module displays is a page nobody will find. The customer pages often belong somewhere else, in a user menu, and Alfa lets you send them there separately."

COM_ALFA_GUIDEDTOUR_STOREFRONT_MENU_STEP_3_TITLE="The catalogue types"
COM_ALFA_GUIDEDTOUR_STOREFRONT_MENU_STEP_3_DESC="<strong>Items</strong> is the shop: an item listing with filters, paging and sorting. Leave its Category empty for everything you sell, or name one and the page becomes that category. <strong>Single Item</strong> is one item's own page. <strong>Manufacturers</strong> lists your brands and <strong>Single Manufacturer</strong> is one brand's page. <strong>Blank Page</strong> is an Alfa page with no content of its own, there to carry modules."

COM_ALFA_GUIDEDTOUR_STOREFRONT_MENU_STEP_4_TITLE="The customer types"
COM_ALFA_GUIDEDTOUR_STOREFRONT_MENU_STEP_4_DESC="<strong>Cart</strong> is the basket, the checkout and the thank you page at one address, and every payment provider returns the shopper there. <strong>User Info</strong> is the details a customer saves and reuses at checkout. <strong>Registration</strong> is Alfa's sign up page: Joomla's account form plus the shop fields you need the moment someone joins."

COM_ALFA_GUIDEDTOUR_STOREFRONT_MENU_STEP_5_TITLE="Two you must have, two you should"
COM_ALFA_GUIDEDTOUR_STOREFRONT_MENU_STEP_5_DESC="<strong>Items</strong> and <strong>Cart</strong>, published, in every language your site speaks: that is what Alfa's checklist means by a reachable storefront, and it is the only part that blocks. The account page and the sign up page are listed separately as advice, so forgetting them is visible without being an error. On a multilingual site the checklist also watches whether the copies are associated, because a page without its twins throws the shopper onto the front page when they switch language."

COM_ALFA_GUIDEDTOUR_STOREFRONT_MENU_STEP_6_TITLE="Build them one at a time, or all at once"
COM_ALFA_GUIDEDTOUR_STOREFRONT_MENU_STEP_6_DESC="<strong>New</strong> is where each one starts, and the tours below walk you through it. If you would rather not, the setup panel builds them for you: it asks which menu they should go in, creates only what is missing, and on a multilingual site makes one per language and associates them."

COM_ALFA_GUIDEDTOUR_STOREFRONT_MENU_END_TITLE="End of the tour"
COM_ALFA_GUIDEDTOUR_STOREFRONT_MENU_END_DESC="Four tours follow this one. Each builds a single page and points at its own entry in the type window: <strong>Menu item: the shop page</strong>, <strong>the cart page</strong>, <strong>the account page</strong>, <strong>the sign-up page</strong>. Start with the shop. This tour changed nothing. Press <strong>Complete</strong> to close it."

; Tour: taxes
COM_ALFA_GUIDEDTOUR_TAXES_TITLE="Create a tax"
COM_ALFA_GUIDEDTOUR_TAXES_DESC="Rates applied to prices and documents."

COM_ALFA_GUIDEDTOUR_TAXES_STEP_1_TITLE="Open Taxes"
COM_ALFA_GUIDEDTOUR_TAXES_STEP_1_DESC="A tax is a rate plus the rule for who it applies to. Alfa uses it to turn a net price into the final price a customer sees, and to print the tax breakdown on documents. In the menu on the left, click <strong>Taxes</strong>."
COM_ALFA_GUIDEDTOUR_TAXES_STEP_2_TITLE="Start a new tax"
COM_ALFA_GUIDEDTOUR_TAXES_STEP_2_DESC="Click <strong>New</strong>."
COM_ALFA_GUIDEDTOUR_TAXES_STEP_3_TITLE="Name it"
COM_ALFA_GUIDEDTOUR_TAXES_STEP_3_DESC="This name appears on the price breakdown and on invoices: something a buyer and an accountant both recognise, in every language your store speaks. Then press Next."

COM_ALFA_GUIDEDTOUR_TAXES_END_TITLE="Save it, or close the tour"
COM_ALFA_GUIDEDTOUR_TAXES_END_DESC="Set the rate and target it at categories, manufacturers, countries or user groups; every price on the storefront and every document line follows it from that moment on. Nothing in this tour has been saved for you. Press <strong>Save</strong> or <strong>Save &amp; Close</strong> to keep what is on this form, or <strong>Complete</strong> to close the tour without saving anything. Either way, the tour ends here."

; Tour: tools
COM_ALFA_GUIDEDTOUR_TOOLS_TITLE="Tools"
COM_ALFA_GUIDEDTOUR_TOOLS_DESC="The maintenance drawer."

COM_ALFA_GUIDEDTOUR_TOOLS_STEP_1_TITLE="Open Tools"
COM_ALFA_GUIDEDTOUR_TOOLS_STEP_1_DESC="Tools is the maintenance workbench: run-this-now jobs that keep the plumbing in order rather than anything you sell. Re-run the setup checklist, clean up media whose item is gone, catch Joomla users up into the Alfa tables after an import, create missing translation tables, rebuild prepared price data, reseed the guided tours. In the menu on the left, click <strong>Tools</strong>."
COM_ALFA_GUIDEDTOUR_TOOLS_STEP_2_TITLE="How it is organised"
COM_ALFA_GUIDEDTOUR_TOOLS_STEP_2_DESC="The tabs group the jobs by what they touch: media, database sync, translations, search and so on. What you see depends on which Alfa plugins are installed: every card is contributed by the core or by an extension, so the drawer grows with your shop rather than being a fixed list. Press Next."
COM_ALFA_GUIDEDTOUR_TOOLS_STEP_3_TITLE="Running a job"
COM_ALFA_GUIDEDTOUR_TOOLS_STEP_3_DESC="Each card explains what its action touches before you run it, and every action reports what it did rather than working silently. Prefer a tool over editing data by hand: it knows the order things must happen in, and it leaves a trace you can read afterwards. Press Next."
COM_ALFA_GUIDEDTOUR_TOOLS_STEP_4_TITLE="Who may open it"
COM_ALFA_GUIDEDTOUR_TOOLS_STEP_4_DESC="Tools sits behind its own permission: not a hidden menu item but a real gate, so someone without it gets refused even with the direct link. If a colleague cannot see Tools in the menu, that is why. Press Next."

COM_ALFA_GUIDEDTOUR_TOOLS_END_TITLE="End of the tour"
COM_ALFA_GUIDEDTOUR_TOOLS_END_DESC="When something looks stale rather than broken (counts, media, translations, tours), look here before anywhere else. This tour changed nothing. Press <strong>Complete</strong> to close it."

; Tour: welcome
COM_ALFA_GUIDEDTOUR_WELCOME_TITLE="Welcome to Alfa Commerce"
COM_ALFA_GUIDEDTOUR_WELCOME_DESC="A one-minute orientation of your store home."

COM_ALFA_GUIDEDTOUR_WELCOME_STEP_1_TITLE="Welcome"
COM_ALFA_GUIDEDTOUR_WELCOME_STEP_1_DESC="This is your store home. In a minute you will know what the checklist is telling you, how the left menu is organised, and where every hands-on tutorial lives."
COM_ALFA_GUIDEDTOUR_WELCOME_STEP_2_TITLE="The setup checklist"
COM_ALFA_GUIDEDTOUR_WELCOME_STEP_2_DESC="The card lists what a working shop still needs: a store identity, a currency, tax, a checkout form, a storefront menu, a first category and item. Required rows block selling; recommended and optional ones make the shop better. Each row opens the exact screen in a dialog, and some can be created for you. When everything passes, the card shrinks to a quiet line. Press Next."
COM_ALFA_GUIDEDTOUR_WELCOME_STEP_3_TITLE="The left menu"
COM_ALFA_GUIDEDTOUR_WELCOME_STEP_3_DESC="The menu is grouped by what you do: the catalogue (categories, items, brands, fields) at the top, then sales (orders, statuses, documents, returns), then the selling rules (cart rules, discounts, taxes), then inventory (stock locations and movements), and finally configuration (payment and shipment methods, currencies, countries, users). Press Next."
COM_ALFA_GUIDEDTOUR_WELCOME_STEP_4_TITLE="The toolbar"
COM_ALFA_GUIDEDTOUR_WELCOME_STEP_4_DESC="Every screen carries its actions in this toolbar: New and the list actions on the left, then Options for component-wide settings, the <strong>Help</strong> button that starts the tutorial for the screen you are on, and the notification bell. Press Next."
COM_ALFA_GUIDEDTOUR_WELCOME_STEP_5_TITLE="Where the tours live"
COM_ALFA_GUIDEDTOUR_WELCOME_STEP_5_DESC="Open <strong>Take a Tour</strong> in the top bar on any Alfa page for the full list of hands-on tutorials: items, variations, pricing, payments, shipping and more. Every screen also offers its own from the Help button in its toolbar, any time you want it again."

COM_ALFA_GUIDEDTOUR_WELCOME_END_TITLE="End of the tour"
COM_ALFA_GUIDEDTOUR_WELCOME_END_DESC="That is your store home: the checklist says what the shop still needs, the menu leads to every screen, and the <strong>Help</strong> button on each screen starts its own tour. This tour changed nothing. Press <strong>Complete</strong> to close it."
