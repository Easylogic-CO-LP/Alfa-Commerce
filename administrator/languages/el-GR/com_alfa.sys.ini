; com_alfa: System language file (el-GR)
; Joomla reads the en-GB file first and this one over it: a key not translated here keeps its en-GB text.

; The notice when an update could not move the former shipping Options onto the shipping methods (script.php)
COM_ALFA_NOTIFY_SHIPPING_MOVE_FAILED_TITLE="Ο φόρος αποστολής δεν εφαρμόζεται όπως ρυθμίστηκε"
COM_ALFA_NOTIFY_SHIPPING_MOVE_FAILED_MSG="Μια ενημέρωση δεν μπόρεσε να μεταφέρει στους τρόπους αποστολής τις δύο Επιλογές αποστολής, τους Προεπιλεγμένους φόρους αποστολής και το αν οι τιμές αποστολής καταχωρούνται με ή χωρίς φόρο, οπότε κρατήθηκαν και οι δύο. Μέχρι να ολοκληρωθεί η μεταφορά, ο φόρος αποστολής δεν εφαρμόζεται όπως ορίζουν αυτές οι Επιλογές: κάθε τρόπος αποστολής χρησιμοποιεί μόνο τους δικούς του Φόρους αποστολής και τη δική του ρύθμιση για το αν οι τιμές του καταχωρούνται με ή χωρίς φόρο. Η μεταφορά εκτελείται ξανά στην επόμενη εγκατάσταση ή ενημέρωση του Alfa Commerce, και αυτή η ειδοποίηση αποσύρεται μόλις η μεταφορά ολοκληρωθεί. Μέχρι τότε, ελέγξτε σε κάθε τρόπο αποστολής τους Φόρους αποστολής και το πώς καταχωρούνται οι τιμές του, πριν δεχτείτε παραγγελίες."

