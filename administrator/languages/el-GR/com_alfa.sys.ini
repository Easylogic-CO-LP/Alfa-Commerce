COM_ALFA_INSTALL_LAYOUTS_LEFT="Το Alfa Commerce άφησε όπως ήταν %1$d επιλογή(ές) διάταξης, αποθηκευμένες με όνομα προτύπου html, επειδή δεν μπόρεσε να κρίνει σε ποιο πρότυπο ανήκει η διάταξη: %2$s. Επιλέξτε την καθεμία ξανά στη φόρμα της. Μέχρι τότε η σελίδα της εμφανίζει τη διάταξη της ίδιας της εφαρμογής."
COM_ALFA_INSTALL_LAYOUT_LEFT_NONE="κανένα πρότυπο δεν έχει το %1$s"
