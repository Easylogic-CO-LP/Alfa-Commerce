COM_ALFA_PAYMENT_REFUND_UNRECONCILED_FIXED="Ο πάροχος πληρωμών ολοκλήρωσε την επιστροφή #%1$d, αλλά τα βιβλία δεν μπόρεσαν να την καταχωρίσουν: τα χρήματα μετακινήθηκαν, γι' αυτό δεν ορίζεται εδώ ως αποτυχημένη ή ακυρωμένη και το ποσό της δεν αλλάζει. Τη λήγει η αναφορά της %2$s στην πληρωμή: Καταχώριση αυτής της επιστροφής, συμφωνία με υπάρχουσα επιστροφή, ή επίλυση ως διπλή ή άκυρη αναφορά."
COM_ALFA_PAYMENT_REFUND_REQUEST_FIXED="Η επιστροφή #%1$d είναι αίτημα επιστροφής που έστειλε η πύλη πληρωμής της και δεν έχει ολοκληρωθεί ακόμη: δεν ολοκληρώνεται εδώ και η αναφορά και το ποσό της δεν αλλάζουν εδώ. Την καταχωρίζει η πύλη της όταν την επιβεβαιώσει ο πάροχος πληρωμών. Μια αναφορά επιστροφής του παρόχου στην πληρωμή περνά από την Καταχώριση αυτής της επιστροφής, τη συμφωνία με υπάρχουσα επιστροφή ή την επίλυση ως διπλή ή άκυρη αναφορά. Μπορεί ακόμη να οριστεί ως αποτυχημένη ή ακυρωμένη όταν ο πάροχος δείξει ότι δεν επιστράφηκε τίποτα."
COM_ALFA_PAYMENT_REFUND_PENDING_FIXED="Η επιστροφή #%1$d εκκρεμεί στον πάροχο πληρωμών: το ποσό και η αναφορά της δεν αλλάζουν όσο ο πάροχος μπορεί ακόμη να την ολοκληρώσει. Αν είναι λάθος, ορίστε την ως αποτυχημένη ή ακυρωμένη και καταχωρίστε νέα επιστροφή."
COM_ALFA_PAYMENT_REFUND_GATEWAY_SETTLES="Η επιστροφή #%1$d εκκρεμεί στον πάροχο πληρωμών: την ολοκληρώνει μόνο η επιβεβαίωση του παρόχου, μέσω του προσθέτου πληρωμής του. Αν ο πάροχος δεν θα την ολοκληρώσει, ορίστε την ως αποτυχημένη ή ακυρωμένη. Μια επιστροφή που αναφέρει ο πάροχος περνά από την Καταχώριση αυτής της επιστροφής στην αναφορά επιστροφών του παρόχου της πληρωμής."
COM_ALFA_PAYMENT_METHOD_FIXED="Η πληρωμή #%1$d κρατά τον τρόπο πληρωμής της όσο την αναφέρουν επιστροφές ή εγγραφές του παρόχου που δεν είναι αποτυχημένες ή ακυρωμένες (%2$s): τις ολοκληρώνει το πρόσθετο που πήρε την πληρωμή. Ο τρόπος της αλλάζει μόνο όταν αυτές είναι αποτυχημένες ή ακυρωμένες."
COM_ALFA_PAYMENT_METHOD_GATEWAY_FIXED="Η πληρωμή #%1$d έγινε μέσω του προσθέτου πληρωμών %2$s: κρατά τον τρόπο πληρωμής της, ώστε οι μεταγενέστερες επιστροφές και ειδοποιήσεις του προσθέτου να τη βρίσκουν."
COM_ALFA_PAYMENT_PROVIDER_ID_FIXED="Η πληρωμή #%1$d έγινε μέσω του προσθέτου πληρωμών %2$s: ο κωδικός συναλλαγής του παρόχου (%3$s) δεν διαγράφεται ούτε αλλάζει, ώστε οι επιστροφές και οι ειδοποιήσεις του προσθέτου να τη βρίσκουν. Η κατάστασή της μπορεί ακόμη να οριστεί ως εκκρεμής ή ακυρωμένη."
COM_ALFA_ORDER_DELETE_REFUND_RESERVED="Δεν διαγράφηκε τίποτα: η παραγγελία #%1$d έχει επιστροφή που δεν έχει ολοκληρωθεί ακόμη, %2$s. Δεσμεύει το ποσό της (αίτημα επιστροφής σε εξέλιξη, επιστροφή που κρατά ο πάροχος πληρωμών, ή επιστροφή που ο πάροχος ολοκλήρωσε και τα βιβλία δεν την έχουν ακόμη καταχωρίσει). Ολοκληρώστε ή αποδεσμεύστε την πρώτα, ή περάστε την αναφορά της στην πληρωμή από την Καταχώριση αυτής της επιστροφής, τη συμφωνία με υπάρχουσα επιστροφή ή την επίλυση ως διπλή ή άκυρη αναφορά."
