COM_ALFA_CLEAR_RESUME_DESC="Διορθώστε την αιτία και εκτελέστε την ξανά. Η εκκαθάριση του πυρήνα ξεκινά πάλι από το πρώτο της βήμα: τα δεδομένα του πυρήνα έχουν ήδη διαγραφεί και οι πίνακές του φτιάχνονται ξανά από την αρχή. Οι επεκτάσεις που έχουν ήδη εκκαθαριστεί δεν καλούνται ξανά. Στο μεταξύ το Alfa Commerce ή μια επέκταση μπορεί να ενημερωθεί, να απεγκατασταθεί ή να εγκατασταθεί ξανά από τη Διαχείριση επεκτάσεων του Joomla."
