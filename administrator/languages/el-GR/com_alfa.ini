; Alfa Commerce: Greek texts of Reset to default and Clear everything (Tools, Reset and clear), of the refund block and of Record this refund, of the price editor of a product not saved yet, of the notes of the combination generator and of the Options and Informational values popups, and of a shipping method's own taxes and price entry.
; Every other text of the component is read from the en-GB file, which Joomla loads first.

COM_ALFA_ACCESS_DATA_CLEAR="Διαγραφή δεδομένων Alfa"
COM_ALFA_ACCESS_DATA_CLEAR_DESC="Επιτρέπει στους χρήστες αυτής της ομάδας να εκτελούν την Πλήρη εκκαθάριση στα Εργαλεία (διαγράφονται οι πίνακες του πυρήνα της Alfa και τα αρχεία των αγορών, κάθε εγκατεστημένο πρόσθετο της Alfa διαγράφει τα δικά του δεδομένα, και δημιουργείται ξανά μια νέα εγκατάσταση του Alfa Commerce) και να διαγράφουν τα δεδομένα μιας επέκτασης στα Εργαλεία, Επεκτάσεις. Δεν δίνεται σε καμία ομάδα: μόνο ένας Super User μπορεί να το κάνει, μέχρι να το δώσει σε άλλους."
COM_ALFA_TOOLS_TAB_DATA="Επαναφορά και εκκαθάριση"
COM_ALFA_TOOLS_RESET_DESC="Επαναφέρει τις Επιλογές της Alfa στις τιμές που γράφει μια εγκατάσταση και ξαναφτιάχνει από αυτές την εμφάνιση τιμών κάθε ομάδας πελατών. Η επόμενη σελίδα δείχνει κάθε ρύθμιση που θα αλλάξει, πριν αλλάξει οτιδήποτε. Δεν αγγίζει κατάλογο, πελάτες, παραγγελίες, παραστατικά, πληρωμές, απόθεμα ή άλλα δεδομένα, ούτε αρχεία."
COM_ALFA_TOOLS_RESET_BTN="Επαναφορά προεπιλογών"
COM_ALFA_TOOLS_RESET_NOT_PERMITTED="Η Επαναφορά προεπιλογών χρειάζεται το δικαίωμα των Εργαλείων και το δικαίωμα Ρύθμισης του Alfa Commerce."
COM_ALFA_TOOLS_CLEAR_DESC="Διαγράφει τους πίνακες του πυρήνα της Alfa και τα αρχεία των αγορών, εκτελεί τη Διαγραφή δεδομένων κάθε εγκατεστημένου πρόσθετου της Alfa που την υποστηρίζει και φτιάχνει ξανά μια νέα εγκατάσταση του Alfa Commerce: η Alfa και οι επεκτάσεις της μένουν εγκατεστημένες στις εκδόσεις τους, χωρίς κανένα προηγούμενο δεδομένο του καταστήματος. Η επόμενη σελίδα δείχνει ακριβώς τι θα διαγραφεί και, για κάθε πρόσθετο της Alfa, αν υποστηρίζει τη Διαγραφή δεδομένων και, όταν το πρόσθετο το περιγράφει, τι διαγράφει και τι κρατά."
COM_ALFA_TOOLS_CLEAR_BTN="Πλήρης εκκαθάριση"
COM_ALFA_TOOLS_CLEAR_NOT_PERMITTED="Η Πλήρης εκκαθάριση χρειάζεται το δικαίωμα διαγραφής δεδομένων Alfa, που το δίνει ένας Super User."

COM_ALFA_RESET_TITLE="Επαναφορά προεπιλογών"
COM_ALFA_RESET_INTRO_TITLE="Το κατάστημα και τα δεδομένα του μένουν, οι ρυθμίσεις επιστρέφουν στις προεπιλογές"
COM_ALFA_RESET_INTRO_DESC="Οι Επιλογές της Alfa παίρνουν ξανά τις τιμές που γράφει μια εγκατάσταση αυτής της έκδοσης, μια Επιλογή χωρίς τιμή εγκατάστασης αφαιρείται και παίρνει την ενσωματωμένη προεπιλογή της. Ο χώρος των αρχείων αγορών μένει εκεί που είναι, ο προορισμός παράδοσης κρατά την αντιστοίχιση που έχει το κατάστημα και η καταγραφή των στοιχείων μενού που δημιούργησε η εγκατάσταση διατηρείται. Κάθε ομάδα πελατών παίρνει την προεπιλεγμένη εμφάνιση τιμών και ακολουθεί ξανά τις Επιλογές του καταστήματος. Τίποτε άλλο δεν αλλάζει: ούτε κατάλογος, πελάτες, παραγγελίες, παραστατικά, πληρωμές, απόθεμα ή ιστορικό, ούτε αρχεία, προγραμματισμένες εργασίες, ξεναγήσεις, δικαιώματα ή ρυθμίσεις άλλων επεκτάσεων."
COM_ALFA_RESET_NOTHING="Όλες οι ρυθμίσεις έχουν ήδη την προεπιλογή τους. Δεν υπάρχει κάτι για επαναφορά."
