COM_ALFA_CLEAR_EXTENSION_FAILED="Το Alfa Commerce δεν μπόρεσε να επιβεβαιώσει ότι διαγράφηκαν όλα τα δεδομένα της επέκτασης %s. Κάποιες εγγραφές της βάσης δεδομένων ή κάποια αρχεία μπορεί να έχουν μείνει. Μπορείτε να ενημερώσετε ή να απεγκαταστήσετε την επέκταση κανονικά. Η πλήρης διαγραφή των δεδομένων που έμειναν μπορεί να χρειαστεί το δικό της εργαλείο εκκαθάρισης, χειροκίνητη εκκαθάριση της βάσης δεδομένων ή των αρχείων, ή βοήθεια από τον δημιουργό της επέκτασης."
