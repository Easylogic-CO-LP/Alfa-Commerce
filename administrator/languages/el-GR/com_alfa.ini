COM_ALFA_CLEAR_TITLE="Πλήρης εκκαθάριση"
COM_ALFA_CLEAR_WARNING_TITLE="Διαγράφει κάθε δεδομένο καταστήματος που κρατά το Alfa Commerce"
COM_ALFA_CLEAR_WARNING_DESC="Τα δεδομένα του πυρήνα διαγράφονται οριστικά: ο κατάλογος, οι πελάτες, οι παραγγελίες, τα παραστατικά, οι πληρωμές μαζί με τους τρόπους πληρωμής και αποστολής, το πιστωτικό υπόλοιπο πελατών, το απόθεμα και το ιστορικό του, τα καλάθια, οι ρυθμίσεις που φυλάσσονται σε πίνακες της Alfa, οι μεταφράσεις και τα αρχεία των αγορών. Κάθε εγκατεστημένο πρόσθετο της Alfa που αναφέρεται παρακάτω διαγράφει τα δικά του δεδομένα με τη δική του Διαγραφή δεδομένων. Το Alfa Commerce και κάθε επέκταση μένουν εγκατεστημένα: ο πυρήνας φτιάχνει ξανά τους πίνακές του όπως μια νέα εγκατάσταση. Τα δεδομένα του Joomla, οι χρήστες και τα δικαιώματα μένουν. Πάρτε πρώτα αντίγραφο ασφαλείας του ιστότοπου. Όσο εκτελείται, το κατάστημα απαντά ότι βρίσκεται σε συντήρηση."
