COM_ALFA_REFUND_RESERVATIONS_INTRO="Κάθε ποσό παρακάτω είναι δεσμευμένο: μένει εκτός από όσα μπορεί ακόμη να επιστρέψει αυτή η παραγγελία μέχρι να ολοκληρωθεί η επιστροφή του (τότε καταχωρίζεται μία φορά) ή να αποτύχει ή να ακυρωθεί (τότε αποδεσμεύεται). Δεν είναι ακόμη επιστραμμένα χρήματα στα βιβλία και δεν κάνει ποτέ μια πληρωμή επιστραμμένη, γι' αυτό η Καταχώριση αυτής της επιστροφής περιμένει τον πάροχο. Μια νέα επιστροφή μπορεί να ξεκινήσει για όσα απομένουν, και σε μια πληρωμή για όχι περισσότερα από όσα απομένουν σε αυτήν."
