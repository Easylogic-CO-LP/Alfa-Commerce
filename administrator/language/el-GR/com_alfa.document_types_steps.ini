COM_ALFA_GUIDEDTOUR_DOCUMENT_TYPES_END_TITLE="Αποθήκευση ή κλείσιμο της ξενάγησης"
COM_ALFA_GUIDEDTOUR_DOCUMENT_TYPES_END_DESC="Νέοι τύποι έρχονται με την εγκατάσταση ενός πακέτου που τους καταχωρεί. Το <strong>Sync providers</strong> παραλαμβάνει ό,τι φέρνει ένα εγκατεστημένο πακέτο. Η ξενάγηση δεν αποθήκευσε τίποτα για εσάς. Πατήστε <strong>Εφαρμογή</strong> ή <strong>Αποθήκευση &amp; Κλείσιμο</strong> για να κρατήσετε ό,τι υπάρχει σε αυτή τη φόρμα, ή <strong>Ολοκλήρωση</strong> για να κλείσετε την ξενάγηση χωρίς να αποθηκευτεί τίποτα. Σε κάθε περίπτωση, η ξενάγηση τελειώνει εδώ."
