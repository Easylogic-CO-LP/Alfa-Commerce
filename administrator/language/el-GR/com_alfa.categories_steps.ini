COM_ALFA_GUIDEDTOUR_CATEGORIES_END_TITLE="Αποθήκευση ή κλείσιμο της ξενάγησης"
COM_ALFA_GUIDEDTOUR_CATEGORIES_END_DESC="Μόλις αποθηκευτεί, μια δημοσιευμένη κατηγορία μπορεί να περιέχει προϊόντα αμέσως, και γίνεται σελίδα του καταστήματος μόλις τη δείξει ένα στοιχείο μενού ή μια γονική κατηγορία. Η ξενάγηση δεν αποθήκευσε τίποτα για εσάς. Πατήστε <strong>Εφαρμογή</strong> ή <strong>Αποθήκευση &amp; Κλείσιμο</strong> για να κρατήσετε ό,τι υπάρχει σε αυτή τη φόρμα, ή <strong>Ολοκλήρωση</strong> για να κλείσετε την ξενάγηση χωρίς να αποθηκευτεί τίποτα. Σε κάθε περίπτωση, η ξενάγηση τελειώνει εδώ."
