COM_ALFA_GUIDEDTOUR_TOOLS_END_TITLE="Τέλος της ξενάγησης"
COM_ALFA_GUIDEDTOUR_TOOLS_END_DESC="Όταν κάτι φαίνεται παλιό αλλά όχι χαλασμένο (μετρήσεις, πολυμέσα, μεταφράσεις, ξεναγήσεις), ψάξτε εδώ πριν από οπουδήποτε αλλού. Η ξενάγηση δεν άλλαξε τίποτα. Πατήστε <strong>Ολοκλήρωση</strong> για να την κλείσετε."
