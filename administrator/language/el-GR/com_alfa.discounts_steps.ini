COM_ALFA_GUIDEDTOUR_DISCOUNTS_END_TITLE="Αποθήκευση ή κλείσιμο της ξενάγησης"
COM_ALFA_GUIDEDTOUR_DISCOUNTS_END_DESC="Μόλις αποθηκευτεί, η έκπτωση ισχύει μέσα στις ημερομηνίες της. Ανοίξτε ένα προϊόν που πρέπει να επηρεάζει και δείτε τις γραμμές τιμών του: δείχνουν την τιμή που θα πληρώσει πραγματικά ο αγοραστής μετά τις εκπτώσεις και τον φόρο, ο γρηγορότερος τρόπος να βεβαιωθείτε ότι ένας νέος κανόνας κάνει αυτό που θέλατε. Η ξενάγηση δεν αποθήκευσε τίποτα για εσάς. Πατήστε <strong>Εφαρμογή</strong> ή <strong>Αποθήκευση &amp; Κλείσιμο</strong> για να κρατήσετε ό,τι υπάρχει σε αυτή τη φόρμα, ή <strong>Ολοκλήρωση</strong> για να κλείσετε την ξενάγηση χωρίς να αποθηκευτεί τίποτα. Σε κάθε περίπτωση, η ξενάγηση τελειώνει εδώ."
