COM_ALFA_GUIDEDTOUR_MENU_REGISTER_END_TITLE="Αποθήκευση ή κλείσιμο της ξενάγησης"
COM_ALFA_GUIDEDTOUR_MENU_REGISTER_END_DESC="Μόλις αποθηκευτεί, ανοίξτε τη σελίδα ως επισκέπτης και θα δείτε τα πεδία λογαριασμού του Joomla μαζί με τα πεδία του καταστήματός σας. Ποια πεδία εμφανίζονται, και ποια είναι υποχρεωτικά, ορίζεται στα Form Fields: η σήμανση εγγραφής ενός πεδίου είναι αυτή που το βάζει σε αυτή τη σελίδα. Η ξενάγηση δεν αποθήκευσε τίποτα για εσάς. Πατήστε <strong>Εφαρμογή</strong> ή <strong>Αποθήκευση &amp; Κλείσιμο</strong> για να κρατήσετε ό,τι υπάρχει σε αυτή τη φόρμα, ή <strong>Ολοκλήρωση</strong> για να κλείσετε την ξενάγηση χωρίς να αποθηκευτεί τίποτα. Σε κάθε περίπτωση, η ξενάγηση τελειώνει εδώ."
