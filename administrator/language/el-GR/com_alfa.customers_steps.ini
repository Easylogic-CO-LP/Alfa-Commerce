COM_ALFA_GUIDEDTOUR_CUSTOMERS_END_TITLE="Αποθήκευση ή κλείσιμο της ξενάγησης"
COM_ALFA_GUIDEDTOUR_CUSTOMERS_END_DESC="Για να αλλάξετε τι πληρώνει ένας πελάτης ή τι του επιτρέπεται να βλέπει, μετακινήστε τον στη σωστή ομάδα. Η ξενάγηση <em>Customer groups</em> εξηγεί τι μπορεί να κάνει μια ομάδα. Η ξενάγηση δεν αποθήκευσε τίποτα για εσάς. Πατήστε <strong>Εφαρμογή</strong> ή <strong>Αποθήκευση &amp; Κλείσιμο</strong> για να κρατήσετε ό,τι υπάρχει σε αυτή τη φόρμα, ή <strong>Ολοκλήρωση</strong> για να κλείσετε την ξενάγηση χωρίς να αποθηκευτεί τίποτα. Σε κάθε περίπτωση, η ξενάγηση τελειώνει εδώ."
