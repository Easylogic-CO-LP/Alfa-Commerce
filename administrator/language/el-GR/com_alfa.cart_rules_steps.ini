COM_ALFA_GUIDEDTOUR_CART_RULES_END_TITLE="Αποθήκευση ή κλείσιμο της ξενάγησης"
COM_ALFA_GUIDEDTOUR_CART_RULES_END_DESC="Μόλις αποθηκευτεί, ο κανόνας ισχύει μέσα στις ημερομηνίες του. Μετά δοκιμάστε τον: βάλτε τα προϊόντα που πληρούν τις προϋποθέσεις σε ένα καλάθι στο κατάστημα και δείτε τη γραμμή του καλαθιού με το όνομα που γράψατε για τον πελάτη. Ένας κανόνας που διαβάζεται σωστά εδώ αλλά συμπεριφέρεται αλλιώς σε πραγματικό καλάθι είναι ακριβώς αυτό που αξίζει να βρείτε πριν από τους πελάτες σας. Η ξενάγηση δεν αποθήκευσε τίποτα για εσάς. Πατήστε <strong>Εφαρμογή</strong> ή <strong>Αποθήκευση &amp; Κλείσιμο</strong> για να κρατήσετε ό,τι υπάρχει σε αυτή τη φόρμα, ή <strong>Ολοκλήρωση</strong> για να κλείσετε την ξενάγηση χωρίς να αποθηκευτεί τίποτα. Σε κάθε περίπτωση, η ξενάγηση τελειώνει εδώ."
