COM_ALFA_GUIDEDTOUR_PLACES_END_TITLE="Αποθήκευση ή κλείσιμο της ξενάγησης"
COM_ALFA_GUIDEDTOUR_PLACES_END_DESC="Για να σταματήσετε να εξυπηρετείτε μια περιοχή, αποδημοσιεύστε την αντί να τη διαγράψετε: η διαγραφή την αφαιρεί και από κάθε κανόνα φόρου, έκπτωσης, πληρωμής και αποστολής που την αφορούσε. Η ξενάγηση δεν αποθήκευσε τίποτα για εσάς. Πατήστε <strong>Εφαρμογή</strong> ή <strong>Αποθήκευση &amp; Κλείσιμο</strong> για να κρατήσετε ό,τι υπάρχει σε αυτή τη φόρμα, ή <strong>Ολοκλήρωση</strong> για να κλείσετε την ξενάγηση χωρίς να αποθηκευτεί τίποτα. Σε κάθε περίπτωση, η ξενάγηση τελειώνει εδώ."
