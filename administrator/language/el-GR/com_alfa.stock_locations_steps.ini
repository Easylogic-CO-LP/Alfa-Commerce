COM_ALFA_GUIDEDTOUR_STOCK_LOCATIONS_END_TITLE="Αποθήκευση ή κλείσιμο της ξενάγησης"
COM_ALFA_GUIDEDTOUR_STOCK_LOCATIONS_END_DESC="Μόλις αποθηκευτεί, τα προϊόντα μπορούν να έχουν απόθεμα σε αυτή την τοποθεσία, και κάθε κίνηση εισόδου ή εξόδου καταγράφεται σε αυτήν. Η ξενάγηση δεν αποθήκευσε τίποτα για εσάς. Πατήστε <strong>Εφαρμογή</strong> ή <strong>Αποθήκευση &amp; Κλείσιμο</strong> για να κρατήσετε ό,τι υπάρχει σε αυτή τη φόρμα, ή <strong>Ολοκλήρωση</strong> για να κλείσετε την ξενάγηση χωρίς να αποθηκευτεί τίποτα. Σε κάθε περίπτωση, η ξενάγηση τελειώνει εδώ."
