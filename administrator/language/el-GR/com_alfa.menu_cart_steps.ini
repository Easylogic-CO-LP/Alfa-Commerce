COM_ALFA_GUIDEDTOUR_MENU_CART_END_TITLE="Αποθήκευση ή κλείσιμο της ξενάγησης"
COM_ALFA_GUIDEDTOUR_MENU_CART_END_DESC="Μόλις αποθηκευτεί, με το κατάστημα και το καλάθι δημοσιευμένα, το Alfa θεωρεί το κατάστημά σας προσβάσιμο. Στη συνέχεια, ξεκινήστε την ξενάγηση <strong>Menu item: the account page</strong>, ώστε οι πελάτες που επιστρέφουν να κρατούν τα στοιχεία τους αντί να τα πληκτρολογούν σε κάθε παραγγελία. Η ξενάγηση δεν αποθήκευσε τίποτα για εσάς. Πατήστε <strong>Εφαρμογή</strong> ή <strong>Αποθήκευση &amp; Κλείσιμο</strong> για να κρατήσετε ό,τι υπάρχει σε αυτή τη φόρμα, ή <strong>Ολοκλήρωση</strong> για να κλείσετε την ξενάγηση χωρίς να αποθηκευτεί τίποτα. Σε κάθε περίπτωση, η ξενάγηση τελειώνει εδώ."
