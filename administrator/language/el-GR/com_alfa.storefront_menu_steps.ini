COM_ALFA_GUIDEDTOUR_STOREFRONT_MENU_END_TITLE="Τέλος της ξενάγησης"
COM_ALFA_GUIDEDTOUR_STOREFRONT_MENU_END_DESC="Ακολουθούν τέσσερις ξεναγήσεις. Η καθεμία φτιάχνει μία σελίδα και δείχνει τη δική της επιλογή στο παράθυρο τύπων: <strong>Menu item: the shop page</strong>, <strong>the cart page</strong>, <strong>the account page</strong>, <strong>the sign-up page</strong>. Ξεκινήστε από το κατάστημα. Η ξενάγηση δεν άλλαξε τίποτα. Πατήστε <strong>Ολοκλήρωση</strong> για να την κλείσετε."
