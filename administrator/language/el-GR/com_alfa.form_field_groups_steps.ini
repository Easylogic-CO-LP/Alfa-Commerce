COM_ALFA_GUIDEDTOUR_FORM_FIELD_GROUPS_END_TITLE="Αποθήκευση ή κλείσιμο της ξενάγησης"
COM_ALFA_GUIDEDTOUR_FORM_FIELD_GROUPS_END_DESC="Αντιστοιχίστε πεδία στην ομάδα από τη λίστα Form Fields. Το ταμείο εμφανίζει κάθε ομάδα ως ξεχωριστό μπλοκ, με τη σειρά που ορίζετε. Η ξενάγηση δεν αποθήκευσε τίποτα για εσάς. Πατήστε <strong>Εφαρμογή</strong> ή <strong>Αποθήκευση &amp; Κλείσιμο</strong> για να κρατήσετε ό,τι υπάρχει σε αυτή τη φόρμα, ή <strong>Ολοκλήρωση</strong> για να κλείσετε την ξενάγηση χωρίς να αποθηκευτεί τίποτα. Σε κάθε περίπτωση, η ξενάγηση τελειώνει εδώ."
