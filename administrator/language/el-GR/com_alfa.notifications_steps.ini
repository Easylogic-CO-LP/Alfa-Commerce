COM_ALFA_GUIDEDTOUR_NOTIFICATIONS_END_TITLE="Τέλος της ξενάγησης"
COM_ALFA_GUIDEDTOUR_NOTIFICATIONS_END_DESC="Προσέχετε το καμπανάκι: όταν γίνει κόκκινο, ό,τι χρειάζεται την προσοχή σας είναι εδώ, μαζί με την ομάδα που το ανέφερε. Η ξενάγηση δεν άλλαξε τίποτα. Πατήστε <strong>Ολοκλήρωση</strong> για να την κλείσετε."
