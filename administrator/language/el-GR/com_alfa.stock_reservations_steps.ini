COM_ALFA_GUIDEDTOUR_STOCK_RESERVATIONS_END_TITLE="Τέλος της ξενάγησης"
COM_ALFA_GUIDEDTOUR_STOCK_RESERVATIONS_END_DESC="Όταν ένα προϊόν εμφανίζεται μη διαθέσιμο ενώ το ράφι είναι γεμάτο, η απάντηση συνήθως βρίσκεται σε αυτή την οθόνη. Η ξενάγηση δεν άλλαξε τίποτα. Πατήστε <strong>Ολοκλήρωση</strong> για να την κλείσετε."
