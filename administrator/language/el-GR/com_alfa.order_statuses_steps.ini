COM_ALFA_GUIDEDTOUR_ORDER_STATUSES_END_TITLE="Αποθήκευση ή κλείσιμο της ξενάγησης"
COM_ALFA_GUIDEDTOUR_ORDER_STATUSES_END_DESC="Όταν μια παραγγελία μπαίνει σε αυτή την κατάσταση, εφαρμόζεται ό,τι ρυθμίσατε γι' αυτήν, και το ιστορικό της παραγγελίας κρατά κάθε αλλαγή. Η ξενάγηση δεν αποθήκευσε τίποτα για εσάς. Πατήστε <strong>Εφαρμογή</strong> ή <strong>Αποθήκευση &amp; Κλείσιμο</strong> για να κρατήσετε ό,τι υπάρχει σε αυτή τη φόρμα, ή <strong>Ολοκλήρωση</strong> για να κλείσετε την ξενάγηση χωρίς να αποθηκευτεί τίποτα. Σε κάθε περίπτωση, η ξενάγηση τελειώνει εδώ."
