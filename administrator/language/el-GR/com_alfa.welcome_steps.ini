COM_ALFA_GUIDEDTOUR_WELCOME_END_TITLE="Τέλος της ξενάγησης"
COM_ALFA_GUIDEDTOUR_WELCOME_END_DESC="Αυτή είναι η αρχική σελίδα του καταστήματός σας: η λίστα ελέγχου λέει τι χρειάζεται ακόμη το κατάστημα, το μενού οδηγεί σε κάθε οθόνη, και το κουμπί <strong>Help</strong> κάθε οθόνης ξεκινά τη δική της ξενάγηση. Η ξενάγηση δεν άλλαξε τίποτα. Πατήστε <strong>Ολοκλήρωση</strong> για να την κλείσετε."
