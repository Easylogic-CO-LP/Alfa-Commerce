COM_ALFA_GUIDEDTOUR_FORM_FIELDS_END_TITLE="Αποθήκευση ή κλείσιμο της ξενάγησης"
COM_ALFA_GUIDEDTOUR_FORM_FIELDS_END_DESC="Τα δημοσιευμένα πεδία εμφανίζονται στο ταμείο με τη σειρά της ομάδας τους, και ό,τι πληκτρολογούν οι πελάτες καταγράφεται στην παραγγελία και στα παραστατικά που την αναφέρουν. Η ξενάγηση δεν αποθήκευσε τίποτα για εσάς. Πατήστε <strong>Εφαρμογή</strong> ή <strong>Αποθήκευση &amp; Κλείσιμο</strong> για να κρατήσετε ό,τι υπάρχει σε αυτή τη φόρμα, ή <strong>Ολοκλήρωση</strong> για να κλείσετε την ξενάγηση χωρίς να αποθηκευτεί τίποτα. Σε κάθε περίπτωση, η ξενάγηση τελειώνει εδώ."
