COM_ALFA_GUIDEDTOUR_SALES_DOCUMENTS_END_TITLE="Τέλος της ξενάγησης"
COM_ALFA_GUIDEDTOUR_SALES_DOCUMENTS_END_DESC="Ένα νέο κατάστημα δείχνει κενό μητρώο: εκδώστε το πρώτο παραστατικό από μια παραγγελία, και θα εμφανιστεί εδώ με τον αριθμό του. Η ξενάγηση δεν άλλαξε τίποτα. Πατήστε <strong>Ολοκλήρωση</strong> για να την κλείσετε."
