COM_ALFA_GUIDEDTOUR_MENU_SHOP_END_TITLE="Αποθήκευση ή κλείσιμο της ξενάγησης"
COM_ALFA_GUIDEDTOUR_MENU_SHOP_END_DESC="Μόλις αποθηκευτεί, ανοίξτε τον ιστότοπο σε άλλη καρτέλα και το κατάστημα είναι στο μενού. Αν το μενού δεν δείχνει τίποτα, είναι η ενότητα αυτού του μενού που δεν είναι δημοσιευμένη, όχι αυτό το στοιχείο. Μετά ξεκινήστε την ξενάγηση <strong>Menu item: the cart page</strong>, γιατί ένα κατάστημα χωρίς καλάθι δεν μπορεί να δεχτεί παραγγελία. Η ξενάγηση δεν αποθήκευσε τίποτα για εσάς. Πατήστε <strong>Εφαρμογή</strong> ή <strong>Αποθήκευση &amp; Κλείσιμο</strong> για να κρατήσετε ό,τι υπάρχει σε αυτή τη φόρμα, ή <strong>Ολοκλήρωση</strong> για να κλείσετε την ξενάγηση χωρίς να αποθηκευτεί τίποτα. Σε κάθε περίπτωση, η ξενάγηση τελειώνει εδώ."
