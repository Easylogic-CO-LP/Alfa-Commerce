COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_END_TITLE="Αποθήκευση ή κλείσιμο της ξενάγησης"
COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_END_DESC="Μόλις αποθηκευτεί, το πεδίο είναι διαθέσιμο σε κάθε προϊόν των κατηγοριών του: ανοίξτε ένα, πηγαίνετε στην καρτέλα Pricing & Combinations, και το πεδίο είναι εκεί, ως διάσταση για παραλλαγές, ως επιλογή ή ως προδιαγραφή, ανάλογα με την επιλογή που κάνατε νωρίτερα. Η ξενάγηση δεν αποθήκευσε τίποτα για εσάς. Πατήστε <strong>Εφαρμογή</strong> ή <strong>Αποθήκευση &amp; Κλείσιμο</strong> για να κρατήσετε ό,τι υπάρχει σε αυτή τη φόρμα, ή <strong>Ολοκλήρωση</strong> για να κλείσετε την ξενάγηση χωρίς να αποθηκευτεί τίποτα. Σε κάθε περίπτωση, η ξενάγηση τελειώνει εδώ."
