COM_ALFA_GUIDEDTOUR_TAXES_END_TITLE="Αποθήκευση ή κλείσιμο της ξενάγησης"
COM_ALFA_GUIDEDTOUR_TAXES_END_DESC="Ορίστε τον συντελεστή και στοχεύστε τον σε κατηγορίες, κατασκευαστές, χώρες ή ομάδες χρηστών. Από εκείνη τη στιγμή κάθε τιμή στο κατάστημα και κάθε γραμμή παραστατικού τον ακολουθεί. Η ξενάγηση δεν αποθήκευσε τίποτα για εσάς. Πατήστε <strong>Εφαρμογή</strong> ή <strong>Αποθήκευση &amp; Κλείσιμο</strong> για να κρατήσετε ό,τι υπάρχει σε αυτή τη φόρμα, ή <strong>Ολοκλήρωση</strong> για να κλείσετε την ξενάγηση χωρίς να αποθηκευτεί τίποτα. Σε κάθε περίπτωση, η ξενάγηση τελειώνει εδώ."
