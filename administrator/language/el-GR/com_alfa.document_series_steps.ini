COM_ALFA_GUIDEDTOUR_DOCUMENT_SERIES_END_TITLE="Αποθήκευση ή κλείσιμο της ξενάγησης"
COM_ALFA_GUIDEDTOUR_DOCUMENT_SERIES_END_DESC="Ορίστε μία σειρά ως προεπιλογή για τον τύπο της, και οι παραγγελίες θα τη χρησιμοποιούν αυτόματα στην έκδοση. Η ξενάγηση δεν αποθήκευσε τίποτα για εσάς. Πατήστε <strong>Εφαρμογή</strong> ή <strong>Αποθήκευση &amp; Κλείσιμο</strong> για να κρατήσετε ό,τι υπάρχει σε αυτή τη φόρμα, ή <strong>Ολοκλήρωση</strong> για να κλείσετε την ξενάγηση χωρίς να αποθηκευτεί τίποτα. Σε κάθε περίπτωση, η ξενάγηση τελειώνει εδώ."
