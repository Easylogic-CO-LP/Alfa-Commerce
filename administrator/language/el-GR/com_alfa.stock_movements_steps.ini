COM_ALFA_GUIDEDTOUR_STOCK_MOVEMENTS_END_DESC="Θεωρήστε το ημερολόγιο ως την αλήθεια: αν ένας αριθμός φαίνεται λάθος, η απάντηση είναι μια κίνηση που δεν έχετε διαβάσει ακόμη. Η ξενάγηση δεν άλλαξε τίποτα. Πατήστε <strong>Ολοκλήρωση</strong> για να την κλείσετε."
