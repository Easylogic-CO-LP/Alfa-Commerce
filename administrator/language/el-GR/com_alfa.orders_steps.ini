COM_ALFA_GUIDEDTOUR_ORDERS_END_TITLE="Αποθήκευση ή κλείσιμο της ξενάγησης"
COM_ALFA_GUIDEDTOUR_ORDERS_END_DESC="Οι παραγγελίες έρχονται μόνες τους από το ταμείο. Το <strong>Νέο</strong> υπάρχει για όσες παίρνετε τηλεφωνικά: αποθηκεύστε πρώτα το κέλυφος και μετά προσθέστε προϊόντα, πληρωμές και αποστολές. Η ξενάγηση δεν αποθήκευσε τίποτα για εσάς. Πατήστε <strong>Εφαρμογή</strong> ή <strong>Αποθήκευση &amp; Κλείσιμο</strong> για να κρατήσετε ό,τι υπάρχει σε αυτή τη φόρμα, ή <strong>Ολοκλήρωση</strong> για να κλείσετε την ξενάγηση χωρίς να αποθηκευτεί τίποτα. Σε κάθε περίπτωση, η ξενάγηση τελειώνει εδώ."
