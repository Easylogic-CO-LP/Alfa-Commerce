COM_ALFA_GUIDEDTOUR_MENU_ACCOUNT_END_TITLE="Αποθήκευση ή κλείσιμο της ξενάγησης"
COM_ALFA_GUIDEDTOUR_MENU_ACCOUNT_END_DESC="Μόλις αποθηκευτεί, συνδεθείτε στο δικό σας κατάστημα και η σελίδα δείχνει ό,τι έχει κρατήσει ο πελάτης. Στη συνέχεια, αν το κατάστημά σας επιτρέπει τη δημιουργία λογαριασμού, ξεκινήστε την ξενάγηση <strong>Menu item: the sign-up page</strong>. Η ξενάγηση δεν αποθήκευσε τίποτα για εσάς. Πατήστε <strong>Εφαρμογή</strong> ή <strong>Αποθήκευση &amp; Κλείσιμο</strong> για να κρατήσετε ό,τι υπάρχει σε αυτή τη φόρμα, ή <strong>Ολοκλήρωση</strong> για να κλείσετε την ξενάγηση χωρίς να αποθηκευτεί τίποτα. Σε κάθε περίπτωση, η ξενάγηση τελειώνει εδώ."
