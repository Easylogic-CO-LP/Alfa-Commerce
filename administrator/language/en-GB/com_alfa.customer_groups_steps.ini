COM_ALFA_GUIDEDTOUR_CUSTOMER_GROUPS_STEP_1_TITLE="Open Usergroups"
COM_ALFA_GUIDEDTOUR_CUSTOMER_GROUPS_STEP_1_DESC="Alfa keeps one settings row per Joomla user group, so a shop can treat retail, wholesale, staff and members differently. The groups themselves are created in Joomla; this screen is where each one gets its commercial meaning. In the menu on the left, click <strong>Usergroups</strong>."
COM_ALFA_GUIDEDTOUR_CUSTOMER_GROUPS_STEP_2_TITLE="What the list shows"
COM_ALFA_GUIDEDTOUR_CUSTOMER_GROUPS_STEP_2_DESC="Every Joomla group appears here with its Alfa settings attached, including the column that says whether it carries its own price rules. Rows are created for you as groups appear, which is why there is no New button. Press Next."
COM_ALFA_GUIDEDTOUR_CUSTOMER_GROUPS_STEP_3_TITLE="Open a group"
COM_ALFA_GUIDEDTOUR_CUSTOMER_GROUPS_STEP_3_DESC="Click a group name to open it."
COM_ALFA_GUIDEDTOUR_CUSTOMER_GROUPS_STEP_4_TITLE="What a group controls"
COM_ALFA_GUIDEDTOUR_CUSTOMER_GROUPS_STEP_4_DESC="Switch prices on and this group gets its own answer to what a price looks like: whether to show the base price, the discount amount, the subtotal, the tax, the price including tax, the final total and the full breakdown. That is how a wholesale group can see net prices while retail sees gross, and how a group can be shown no prices at all until they log in. Leave it off and the group simply follows the shop-wide defaults in Options. Press Next."
COM_ALFA_GUIDEDTOUR_CUSTOMER_GROUPS_STEP_5_TITLE="Save it"
COM_ALFA_GUIDEDTOUR_CUSTOMER_GROUPS_STEP_5_DESC="Click <strong>Save &amp; Close</strong>, or finish without saving; nothing is written either way until you save."
COM_ALFA_GUIDEDTOUR_CUSTOMER_GROUPS_STEP_6_TITLE="Done"
COM_ALFA_GUIDEDTOUR_CUSTOMER_GROUPS_STEP_6_DESC="That is the whole flow. Put a customer in the group from Joomla Users, and this is what they see from their next visit."
