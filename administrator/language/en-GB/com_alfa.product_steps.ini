; The single product tour. Every step is a plain Next: the merchant reads, looks,
; and clicks whatever they like; the tour never presses anything on their behalf.

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_1_TITLE="Everything a product holds"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_1_DESC="This walk goes through one product from top to bottom: its name and codes, the category it belongs to, the stock behind it, what it costs, how it varies, and its pictures. We will open a brand-new product to look at, and nothing gets saved unless you decide to save it. Press Next."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_2_TITLE="Where products live"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_2_DESC="Items, in the Alfa menu on the left: this is the list of everything you sell, and where you will come back to find a product, check its stock at a glance or open it for editing. The tour brought you here; from now on you know the way."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_3_TITLE="Open a new product"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_3_DESC="Press New. This is the only thing the tour asks you to click; from here on you just read, and you are free to type, open tabs and click whatever you like while the tour follows along."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_4_TITLE="The name buyers read"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_4_DESC="The product's public name, and the only field that is truly required. One box per content language: the storefront shows each shopper the name in their own language, and the URL alias is generated from it when you save, so a Greek name produces a readable Greek address, not a string of question marks."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_5_TITLE="SKU and the other identifiers"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_5_DESC="The SKU is your own code for this product: what your shelves, your invoices and your supplier call it. Next to it sit GTIN (the barcode number, EAN or UPC) and MPN (the manufacturer's own part number). None is required, but marketplaces and price comparison sites ask for the barcode, and stock counts are far easier to trust when every product carries a code you recognise."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_6_TITLE="Short and full description"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_6_DESC="The short description is the summary that travels: listings, cart lines, the top of the product page. The full description below it is the long story with formatting and images. Both are per language, and both are optional: a product with no description still sells, it just sells less."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_7_TITLE="The category it belongs to"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_7_DESC="This is the one category field you have to fill, and for most products it is the only one you need to touch. It is the product's home: it builds the URL and the breadcrumb the shopper sees, and when you save, Alfa files the product into this category automatically; you do not have to repeat it in the list below. It also decides which item fields the product may use, so a product filed under Clothing can offer Size while one under Books cannot."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_8_TITLE="Extra placements (optional)"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_8_DESC="Leave this alone unless the product genuinely belongs in more than one place, a raincoat that should appear under both Outerwear and Sale, for instance. The home category above is already included, so anything you add here is in addition to it. Extra placements widen where shoppers can find the product, and widen which item fields it may use."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_9_TITLE="Logistics: stock and shipping"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_9_DESC="This tab carries the physical facts: whether you count stock, how many you have, what happens when you run out, and the weight and dimensions the shipping methods price against. Open it if you want to follow along; the next few steps look at the stock side."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_10_TITLE="Do you count this one?"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_10_DESC="Manage stock turns counting on or off for this product. Off means it can always be bought: right for a service, a download or a made-to-order piece. On means every order moves the number, and the storefront stops selling when there is nothing left to sell."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_11_TITLE="How many you have"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_11_DESC="The quantity on hand. You can type it here, but from the day the shop opens it is safer to let it move on its own: orders take stock away, returns and receipts put it back, and every change is written down under Inventory movements so you can see why a number is what it is."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_12_TITLE="What happens at zero"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_12_DESC="When the count reaches nothing you can hide the product, show it as out of stock, or keep selling it as a backorder. Pick the one that matches how you actually trade; a shop that quietly hides sold-out products loses the search traffic those pages had earned."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_13_TITLE="Pricing & Combinations"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_13_DESC="This tab carries the money and the variations, in that order: the price rows first, then (if the product comes in sizes or colours) the variants those choices produce, the options that do not create a variant, and the specs a buyer only reads. Open it and the next steps walk down it."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_14_TITLE="The price rows"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_14_DESC="A product does not have one price, it has rules. Each row is a price with conditions: a quantity range for wholesale steps, a date range for a promotion, and who it applies to: a currency, a country, a user group, a single customer. The storefront picks the most specific row that matches the shopper in front of it, and the row also shows what the buyer ends up paying once tax and any cart discount have been applied."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_15_TITLE="Adding another price"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_15_DESC="Add price gives you another rule. Start with one plain row and no conditions; that is your normal price. Add a second, narrower row when you want something specific: ten or more at a lower unit price, a members' price for one user group, a two-week sale that expires on its own."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_16_TITLE="Variations: the things you actually sell"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_16_DESC="If a product comes in sizes or colours, each purchasable pairing is a variation: Red / S is a different thing to stock, price and photograph than Blue / M. Variations are built from item fields: a field such as Size that carries a list of values. If this section tells you there are none yet, it will also show you where to make one."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_17_TITLE="Generate combinations"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_17_DESC="This builds the grid for you: pick the fields that matter (say Size and Colour) and it creates every pairing at once, keeping the rows that already exist and their data. Each row is then its own stock unit with its own SKU, stock, price and pictures. The button only appears when the product has fields to combine, so if you do not see it there is nothing to build from yet."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_18_TITLE="Options: choices that are not variants"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_18_DESC="Some choices change the order without creating a separate thing to stock: gift wrapping, an engraving font, a warranty extension. Those are options. They come from the same item fields, they can carry a surcharge, and they are remembered on the order line, but they never multiply your inventory."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_19_TITLE="Informational: the specs"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_19_DESC="Material, warranty, country of origin: facts the buyer reads and never picks. Informational fields are the specification table on the product page, and because they are real fields rather than free text, shoppers can filter on them: everything in cotton, everything with a two-year warranty."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_20_TITLE="Images"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_20_DESC="The product gallery lives behind this tab: every picture a shopper will see on the product page and in listings. Open it and the next step looks at where the files go. Downloads, the tab beside it, is a different thing: files a buyer receives after paying, not pictures of the goods."

COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_21_TITLE="Pictures"
COM_ALFA_GUIDEDTOUR_PRODUCT_STEP_21_DESC="Drag image files straight onto this area, or use Insert media to pick from the media library. The order you drag them into is the order shoppers see, and the first one becomes the thumbnail the listings use; each image can carry its own description for accessibility and SEO. Variations can have their own gallery too (open a variation row and it has this same drop area), so choosing Red on the product page can change the picture. The Downloads tab that follows is a different thing: files a buyer receives after paying."

COM_ALFA_GUIDEDTOUR_PRODUCT_END_TITLE="Save it, or close the tour"
COM_ALFA_GUIDEDTOUR_PRODUCT_END_DESC="<strong>Save</strong> keeps your work and leaves you on this form, which is what you want while you are still filling things in; <strong>Save &amp; Close</strong> returns to the list. Nothing in this tour has been saved for you. Press <strong>Save</strong> or <strong>Save &amp; Close</strong> to keep what is on this form, or <strong>Complete</strong> to close the tour without saving anything. Either way, the tour ends here."
