; Catalogue discounts. One click to open a new one; everything after is reading.

COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_1_TITLE="Discounts change the price of things"
COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_1_DESC="A discount acts on the PRODUCT price: it changes what a shopper sees on the product page and in listings, before anything reaches the cart. That is the difference from a cart rule, which acts on the basket once the shopper is checking out: a summer sale is a discount, \"spend 50 and get free shipping\" is a cart rule. Press Next."

COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_2_TITLE="Where they live"
COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_2_DESC="Discounts, in the Alfa menu. The list shows every rule you have written and whether it is running right now, which is the fastest way to answer \"why is this product cheaper than I expected\"."

COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_3_TITLE="Open a new one"
COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_3_DESC="Press New. The only click the tour asks for: from here you read, and nothing is saved unless you save it yourself."

COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_4_TITLE="What it is called"
COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_4_DESC="The name is yours, not the shopper's: it appears in this list, in reports and on the order line that records why a price was reduced. Name it after the reason (\"Summer sale 2026\", \"Wholesale tier 2\"), because in a year you will be reading it, not writing it."

COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_5_TITLE="How much"
COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_5_DESC="How much this discount takes off. What it means depends on the next field: 20 is either twenty in your currency or twenty per cent. With Type = Percentage, 0 to 100. With Type = Amount, 0 or more; more than the price simply takes the whole price. Never negative: a discount only ever takes money off. Money is always held in the store's default currency and converted for the shopper, so you type your own currency here whatever the buyer sees."

COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_6_TITLE="Amount or percentage"
COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_6_DESC="Percentage scales with the product: the right choice across a whole catalogue, because it stays fair on a €5 item and a €500 one. A fixed amount is right for a specific promise: \"€10 off this range\". Watch the small items with a fixed amount: nothing stops a €10 reduction meeting an €8 product, and the price floor, not your intention, is what protects you."

COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_7_TITLE="Before or after tax"
COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_7_DESC="Before tax reduces the net price and tax is then calculated on the smaller figure: the usual choice, and the one accountants expect. After tax takes the money off the gross price the shopper sees, which is what you want when you have promised a round number at the till: \"€50, tax included\". The two produce different totals to the cent, so pick deliberately rather than by default."

COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_8_TITLE="How it meets other discounts"
COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_8_DESC="Only this discount means the best matching rule wins alone: safest, and what most shops want. Combined lets several apply together, each calculated on the original price. One after another applies them in sequence, each on the price the previous one left, which compounds: two 20% rules in sequence take 36%, not 40%. If a product ever comes out cheaper than you expected, this field is where to look first."

COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_9_TITLE="When it runs"
COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_9_DESC="Start and end dates make a promotion end by itself; the point of writing them is that nobody has to remember to switch the sale off at midnight. Leave them empty for a standing rule such as a trade price. Dates are read in the site's timezone, so a sale that must end at midnight local is safest set to the following morning."

COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_10_TITLE="Which products: categories"
COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_10_DESC="Leave every scope field empty and the rule applies to the whole catalogue. Pick categories and it narrows to them: the common shape of a seasonal sale. The scopes below combine as AND: category Shoes plus manufacturer Acme means Acme shoes only, not every shoe and every Acme product."

COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_11_TITLE="Which products: manufacturer"
COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_11_DESC="Narrow by brand: how a supplier-funded promotion is normally expressed, and how you keep a brand that refuses discounting out of a catalogue-wide sale."

COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_12_TITLE="Which places"
COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_12_DESC="Places narrow the rule geographically: a country, a region, an island group. Use it for prices that genuinely differ by destination rather than for shipping costs, which shipment methods already price on their own."

COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_13_TITLE="Who gets it: user groups"
COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_13_DESC="Restrict the rule to Joomla user groups and you have trade pricing, membership pricing or staff pricing without a second catalogue. A shopper outside the group never sees the reduced price: not on the product page, not in a listing, not in a feed."

COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_14_TITLE="Who gets it: named customers"
COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_14_DESC="Narrower still: specific accounts. Useful for a negotiated price with one client, but a rule that names people is a rule nobody else can maintain; prefer a group whenever more than one customer is meant to have it."

COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_15_TITLE="The badge, on the Advanced tab"
COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_15_DESC="A discount nobody notices sells nothing extra. The Advanced tab decides whether this rule paints a badge on the storefront (the \"-20%\" flash on a listing tile or a product page) and what it looks like. Open it and the next steps walk down it."

COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_16_TITLE="Show it in listings"
COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_16_DESC="Turn the badge on for category and search listings, where a shopper is comparing and a flash is what earns the click. The equivalent switch below it does the same for the product page itself; a shop often wants the first and not the second."

COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_17_TITLE="What it looks like"
COM_ALFA_GUIDEDTOUR_DISCOUNTS_STEP_17_DESC="Turn the badge on for category and search listings, where a shopper is comparing and a flash is what earns the click. Switching it on reveals a position chooser with three honest slots: the image corner (the classic sale flash), beside the title, or next to the add-to-cart button. The corner is loudest; the add-to-cart is the most persuasive at the moment of decision. They are slots rather than coordinates, so the badge lands correctly in every template, and the equivalent pair below does the same job on the product page itself."

COM_ALFA_GUIDEDTOUR_DISCOUNTS_END_TITLE="Save it, or close the tour"
COM_ALFA_GUIDEDTOUR_DISCOUNTS_END_DESC="Once saved, the discount is live within its dates. Open a product it should touch and look at its price rows: they show the price a shopper will actually pay after discounts and tax, the fastest way to prove a new rule does what you meant. Nothing in this tour has been saved for you. Press <strong>Save</strong> or <strong>Save &amp; Close</strong> to keep what is on this form, or <strong>Complete</strong> to close the tour without saving anything. Either way, the tour ends here."
