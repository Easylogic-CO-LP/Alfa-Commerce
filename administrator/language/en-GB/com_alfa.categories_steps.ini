COM_ALFA_GUIDEDTOUR_CATEGORIES_STEP_1_TITLE="Open Categories"
COM_ALFA_GUIDEDTOUR_CATEGORIES_STEP_1_DESC="Categories are the shelves of your shop: they group products, give each group its own landing page and menu item, and drive the breadcrumb a shopper follows. In the menu on the left, click <strong>Categories</strong>."
COM_ALFA_GUIDEDTOUR_CATEGORIES_STEP_2_TITLE="Start a new category"
COM_ALFA_GUIDEDTOUR_CATEGORIES_STEP_2_DESC="The list shows your whole tree; indented rows are children of the row above. Click <strong>New</strong> to add one."
COM_ALFA_GUIDEDTOUR_CATEGORIES_STEP_3_TITLE="Name it"
COM_ALFA_GUIDEDTOUR_CATEGORIES_STEP_3_DESC="The name is what shoppers read on the storefront and what you pick from everywhere else in the admin, so type it in every language your store speaks. The URL alias builds itself from it. Then press Next."
COM_ALFA_GUIDEDTOUR_CATEGORIES_STEP_4_TITLE="Describe it"
COM_ALFA_GUIDEDTOUR_CATEGORIES_STEP_4_DESC="The description sits on the category landing page above its products: the place to say what belongs in this group and why. Search engines read it too, so a couple of real sentences per language pay off. It is optional; press Next."
COM_ALFA_GUIDEDTOUR_CATEGORIES_STEP_5_TITLE="Give it a parent"
COM_ALFA_GUIDEDTOUR_CATEGORIES_STEP_5_DESC="Leave <em>No Parent</em> and this becomes a top-level shelf; pick a parent and it nests under it. Nesting is how you build Clothing -> Trousers -> Chinos, and a listing can be set to include everything below it. Press Next."
COM_ALFA_GUIDEDTOUR_CATEGORIES_STEP_6_TITLE="Give it an image"
COM_ALFA_GUIDEDTOUR_CATEGORIES_STEP_6_DESC="The Media tab holds the category image: the picture used on category grids and menus. A consistent shape across categories keeps listings tidy. Press Next."
COM_ALFA_GUIDEDTOUR_CATEGORIES_STEP_7_TITLE="The category picture"
COM_ALFA_GUIDEDTOUR_CATEGORIES_STEP_7_DESC="Drop an image here, or use the media picker above it. A category image is the tile shoppers see while browsing and the banner at the top of the category page, so a wide, uncluttered picture works far better than a product shot. Leave it empty and the category still works, it just looks like a text link."

COM_ALFA_GUIDEDTOUR_CATEGORIES_END_TITLE="Save it, or close the tour"
COM_ALFA_GUIDEDTOUR_CATEGORIES_END_DESC="Once saved, a published category can hold products immediately, and it becomes a storefront page as soon as a menu item or a parent category points at it. Nothing in this tour has been saved for you. Press <strong>Save</strong> or <strong>Save &amp; Close</strong> to keep what is on this form, or <strong>Complete</strong> to close the tour without saving anything. Either way, the tour ends here."
