; Item fields tour. One click to open a new field; everything after it is reading.

COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_1_TITLE="What an item field is"
COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_1_DESC="An item field is a named list of values that products can draw on: Size with S, M, L; Colour with Red and Blue; Material with cotton and wool. Products do not invent these; they pick from what you define here, which is why a shop can filter on them, report on them and keep them spelled the same way everywhere. Press Next and we will open a new one."

COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_2_TITLE="Where item fields live"
COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_2_DESC="Item Fields, in the Alfa menu on the left. They sit beside Items on purpose: a field is defined once here and then every product in its categories can draw on it, which is why you come here first and to the product second."

COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_3_TITLE="Open a new field"
COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_3_DESC="Press New. It is the only click this tour asks for; after it you just read, and nothing is saved until you decide to save."

COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_4_TITLE="The name"
COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_4_DESC="What buyers see above the choice on the product page: Size, Colour, Warranty. One box per content language, so each shopper reads it in their own. Keep it short: it becomes a label on the product page, a column in your variation grid and a filter in the storefront."

COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_5_TITLE="How the buyer picks it"
COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_5_DESC="The type decides the control on the product page: a dropdown for a long list, radio buttons or swatches when you want every choice visible at a glance, a colour swatch for shades. It changes only how the choice is presented; the values behind it stay the same."

COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_6_TITLE="The setting that decides everything"
COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_6_DESC="Informational is the fork in the road. Left off, this is a choice: the buyer picks a value, and the product can turn those picks into purchasable variations (Red / S with its own SKU, stock and price) or offer them as plain options that only ride along on the order line. Switched on, it is a specification instead: the buyer reads it and never picks it, and it shows up in the product's spec table and in storefront filters. One field is one or the other, never both."

COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_7_TITLE="Which products may use it"
COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_7_DESC="Categories scope the field. Assign Size to Clothing and only products in Clothing can offer it; a book never sees a size dropdown by accident. Leave the scope wide and every product may use it; that is fine for something like Warranty, and messy for something like Shoe size."

COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_8_TITLE="Values: the actual list"
COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_8_DESC="A field with no values does nothing: it is the values that products pick from, and a product's Pricing & Combinations tab stays empty until at least one field has some. Open this tab to look at them."

COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_9_TITLE="Adding and ordering values"
COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_9_DESC="Each row is one value, named per language, and the order you drag them into is the order shoppers see, so S, M, L reads correctly instead of alphabetically. Add every value the shop might ever sell; a product then chooses which of them it actually offers, so one Size list serves shirts that stop at L and trousers that go to XXL."

COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_10_TITLE="Display"
COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_10_DESC="Presentation details for the storefront: how the values are laid out, what shows when nothing is chosen yet, and any per-type settings the field's plugin adds. Sensible defaults are already in place, so this tab is somewhere to come back to, not a hurdle."

COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_11_TITLE="Visibility"
COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_11_DESC="Rules for when the field appears at all: show Sleeve length only once Style is Long sleeve, for instance. Leave it empty and the field is always shown. The rules are evaluated on the server as well as in the browser, so a hidden field can never sneak a value into an order."

COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_12_TITLE="Save, then use it"
COM_ALFA_GUIDEDTOUR_ITEM_FIELDS_STEP_12_DESC="Save the field and it becomes available to every product in its categories: open one, go to Pricing & Combinations, and the field is there: as a dimension to generate variations from, as an option, or as a specification, depending on the choice you made earlier. Nothing in this tour has been saved for you."
