PLG_CONSOLE_ALFAINVENTORY="Console - Alfa Inventory"
PLG_CONSOLE_ALFAINVENTORY_XML_DESCRIPTION="Adds the alfa:inventory:audit console command, a read-only check of the Alfa Commerce stock figures against the stock records."
PLG_CONSOLE_ALFAINVENTORY_AUDIT_DESCRIPTION="Reports stock figures that disagree with the stock records, stock held where it cannot be sold, stock records that no longer match the catalogue, and order lines whose stock no longer has an identity to move against. Order lines sold on an item itself before it had combinations are listed for information. Read-only: nothing is changed or repaired."
PLG_CONSOLE_ALFAINVENTORY_AUDIT_OPTION_ITEM="Audit only these item ids (repeat the option or separate ids with commas). Without it the whole catalogue is audited."
PLG_CONSOLE_ALFAINVENTORY_AUDIT_OPTION_JSON="Print the report as JSON."
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CLEAN="No inconsistency found."
PLG_CONSOLE_ALFAINVENTORY_AUDIT_FOUND="%d inconsistencies found. Nothing was changed; review and repair them on the Inventory audit page."
PLG_CONSOLE_ALFAINVENTORY_AUDIT_FOUND_1="1 inconsistency found. Nothing was changed; review and repair it on the Inventory audit page."
PLG_CONSOLE_ALFAINVENTORY_AUDIT_SCANNED="%1$d stock units and %2$d stock records checked."
PLG_CONSOLE_ALFAINVENTORY_AUDIT_INVALID_ITEM="The item option takes positive item ids; '%s' is not one."
