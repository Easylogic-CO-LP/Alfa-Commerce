PLG_CONSOLE_ALFAINVENTORY_AUDIT_HEADING_DETAIL="Details"
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_ARCHIVED_STOCK="Stock held on an archived combination or item"
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_ARCHIVED_STOCK_DESC="A stock record of an archived combination, or of an archived item or any of its combinations, still holds a quantity or a reservation. The stock is real, for example returned against an order, but it is never offered or sold: an archived combination or item is kept only so that the orders whose lines move their stock against it can still be fulfilled, cancelled and returned. An archived combination's stock is not counted in its item's stock figures. It can be written off here with a reason once no reservation, pending stock effect or open order line still needs it."
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_EXCESS_RESERVATION="Order line reserving more than it still needs"
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_EXCESS_RESERVATION_DESC="The open reservations of this order line hold more stock than the line still needs. In a status that deducts stock, a line needs what its order still has to deduct itself on the item or variant the line sells now: what was ordered, less what a delivery note or another document already has out for it and the order itself has not put back, less what the order itself has out for it there. Stock the order itself has out on a variant the line no longer sells does not change that, and a reservation on such a variant is not needed at all. A cancelled order needs nothing. Nothing converts the reservation beyond that: it keeps the stock reserved, lowers what is available for sale and, on stock reserved beyond what is on hand, is served before later orders. The order's own stock reconciliation releases it when one of the order's lines is changed (its quantity or its variant) or removed, when the order's owed stock movement is applied (see Pending stock effects), or when the order moves into a status that deducts stock from one that does not. Saving the order without changing a line, or moving it between two statuses that both deduct stock, does not release it. Lines of an order whose status keeps stock reserved are not judged here. It is listed for review only; nothing is released here."
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_HISTORICAL_PARENT_LINE="Order line whose stock moves against the item itself"
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_HISTORICAL_PARENT_LINE_DESC="This order line moves its stock against the item itself: it was sold on the item itself, or it was resolved here to move its stock against the item itself. Its fulfilment, cancellation and returns act on the item's own stock; a line that was not a stock claim when it was placed (see Stock claim when placed) is fulfilled without deducting stock. While the item has combinations, that stock is not offered for sale; for an item without combinations, it is the stock the item is sold from. It is listed for information; nothing needs repair."
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_INTEGRITY_HOLD="Unavailable until its stock figures are repaired"
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_INTEGRITY_HOLD_DESC="A return or cancellation recorded stock on this unit while its figures showed stock with no stock records behind them. The recorded stock is real, but the unit is not offered for sale until its figures are repaired here; repairing them ends the hold."
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_LEDGER_MISSING="Stock figure without stock records"
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_LEDGER_MISSING_DESC="The item or combination tracks stock and shows a stock figure, but has no stock records behind it. It cannot be bought and its stock cannot change until its figures are repaired."
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_ORPHAN_RESERVATION="Open reservation on a removed item or combination"
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_ORPHAN_RESERVATION_DESC="An open reservation names an item or combination that no longer exists, or a combination that belongs to another item. It is listed for review only; it clears when its order releases it or when it expires."
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_ORPHAN_STOCK_ROW="Stock record with no matching item or combination"
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_ORPHAN_STOCK_ROW_DESC="A stock record whose item no longer exists, or whose combination no longer exists or belongs to another item. It is not counted for sale and is listed for review only. If its item still exists, that item cannot be deleted or archived while the record holds stock."
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_PHYSICAL_MISMATCH="Stock figure differs from the stock records"
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_PHYSICAL_MISMATCH_DESC="The quantity on hand shown for the item or combination is not the total of its stock records. For an item with combinations it is the total over all of its combinations except archived ones. Sales follow the stock records. Until the figure is repaired, the item's stock tracking and combinations cannot be changed and the item cannot be deleted or archived."
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_RESERVATION_QUEUE="Stock reserved beyond what is on hand"
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_RESERVATION_QUEUE_DESC="The open reservations on this stock record hold more than it has on hand, as backorders allow. They are served in the order listed: first reserved, first served, unless an administrator served an order first. Each shows how much the stock on hand covers and how much waits for stock. A shipment never takes stock that covers a reservation listed before its own: an order shipped out of turn is refused until stock arrives, the orders before it ship or are lowered, or an administrator serves it first here. It is listed for information; nothing needs repair."
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_RESERVED_MISMATCH="Reserved quantity differs from the open reservations"
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_RESERVED_MISMATCH_DESC="The reserved quantity on a stock record is not what the open reservations at that location hold, or open reservations name a location where the unit has no stock record, or its open reservations hold more than it has on hand while the item or variant denies backorders. It is listed for review only; while it differs, this stock cannot be written off or removed."
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_RESOLVED_LINE="Order line whose stock moves against another stock identity"
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_RESOLVED_LINE_DESC="The combination this order line was sold as no longer exists, and a resolution recorded here binds the line to another stock identity of the same item. Its fulfilment, cancellation and returns act on that stock identity; a line that was not a stock claim when it was placed (see Stock claim when placed) is fulfilled without deducting stock. Until stock is reserved or moved for the line on that stock identity after the resolution was recorded, the resolution can be corrected here; every earlier resolution is kept. It is listed for information; nothing needs repair."
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_RETIRED_LEDGER_UNBALANCED="Movement history without a stock record"
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_RETIRED_LEDGER_UNBALANCED_DESC="Stock movements were recorded for an item or combination at a location that has no stock record for it, and they do not add up to zero. The quantity they record is not held in any stock record."
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_SALABLE_MISMATCH="Available figure differs from the stock records"
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_SALABLE_MISMATCH_DESC="The quantity available for sale shown for the item or combination is not what its stock records leave for sale: on hand minus reserved, at enabled locations. For an item with combinations it is the total over its published combinations that track stock. Sales follow the stock records. Until the figure is repaired, the item's stock tracking and combinations cannot be changed and the item cannot be deleted or archived."
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_SHORT_DEDUCTION="Order line short of its stock deduction"
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_SHORT_DEDUCTION_DESC="The order is in a status that deducts stock, yet less stock has left for this order line than was ordered: what the order, a delivery note or another document took out for it, on any item or variant, less what was put back to undo a delivery. Stock that came back by a return or a credit note is not counted as missing. No stock movement is still owed for the order: an owed movement deducts the rest, or is refused, when it is applied. Lines that were not placed as a stock claim are not judged here, nor are lines of a cancelled order, of an order whose status keeps stock reserved or of an order without a status. The order deducts only its own share of a line: what was ordered, less what a delivery note or another document has out for it and the order itself has not put back, less what the order itself already has out for it on the item or variant the line sells now. Its stock reconciliation deducts that share, if the stock allows it, when one of the order's lines is added, changed (its quantity or its variant) or removed, or when the order moves into a status that deducts stock from one that does not. Saving the order without changing a line, or moving it between two statuses that both deduct stock, deducts nothing. Stock a delivery note or another document took out for the line no longer counts as out once the order itself has put it back, as a cancellation does: the order's share then includes that part again, on the item or variant the line sells now. It is listed for review only; nothing is changed here."
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_STRANDED_PARENT="Stock held on an item with combinations"
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_STRANDED_PARENT_DESC="A stock record held on the item itself rather than on one of its combinations. Once an item has combinations only their stock is sold, so these units are excluded from availability. The combinations cannot be changed and the item cannot be deleted or archived until this stock is cleared: reservations on it must be released and pending order stock effects on it applied before the quantity on hand can be written off. Open order lines that were stock claims when placed and whose stock moves against the item itself are fulfilled from this stock, so it cannot be written off while any of them still needs it."
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_UNEXPLAINED_QUANTITY="Quantity not explained by stock movements"
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_UNEXPLAINED_QUANTITY_DESC="The quantity on a stock record differs from the total of its recorded stock movements. Stock entered before movements were recorded appears here. It is listed for review only."
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_UNRESOLVED_LINE="Order line without a stock identity"
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_UNRESOLVED_LINE_DESC="The item or combination this order line was sold as no longer exists, and no resolution is recorded for it. Its order's stock movements are refused until a stock identity is recorded for the line here. When the item itself no longer exists, none can be recorded, and the line stays unresolved. Nothing is mapped automatically: the line's stock moves only against the stock identity recorded for it here, with a reason."
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_UNTRACKED_CLAIM_LINE="Open order line placed as a stock claim on a unit that no longer tracks stock"
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_UNTRACKED_CLAIM_LINE_DESC="This open order line was placed while its item or combination tracked stock and still has quantity to deliver, but the item or combination no longer tracks stock. The line keeps the stock tracking it was placed with: fulfilling it deducts the stock records the item or combination still holds, and nothing is reserved for it. Stock tracking cannot be switched off while such a line is open, and an order that was closed or in the trash when tracking was switched off is refused every status that keeps stock reserved until tracking is switched back on. A line listed here therefore comes from an order whose stock movement is still owed, from a tracking switch saved at the moment its order was reopened, or from data recorded outside the item screens. It is listed for review only: switch tracking back on with the quantity on hand, or complete or cancel the order."
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_UNTRACKED_PROJECTION="Stock figure differs while tracking is off"
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_UNTRACKED_PROJECTION_DESC="The item or combination does not track stock, but its stock figures disagree with its stock records. The figures are only displayed; repairing them sets them to what the stock records say. Until then the item's stock tracking and combinations cannot be changed and the item cannot be deleted or archived."
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_UNTRACKED_STOCK="Stock kept while tracking is off"
PLG_CONSOLE_ALFAINVENTORY_AUDIT_CATEGORY_UNTRACKED_STOCK_DESC="A stock record still holds a quantity or a reservation although its item or combination no longer tracks stock. The item or combination is sold without a stock limit, so this stock is not counted for sale."
