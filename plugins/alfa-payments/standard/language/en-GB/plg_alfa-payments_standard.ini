; The order-status fields use the shared COM_ALFA_PAYMENT_SETTINGS_STATUS_* keys of com_alfa.ini.

; Setup checkup
PLG_ALFA_PAYMENTS_STANDARD_CHECKUP_STATUSES_TITLE="Order statuses set"
PLG_ALFA_PAYMENTS_STANDARD_CHECKUP_STATUSES_HELP="Standard moves an order only through these three settings below:<ul class='mb-0 ps-3'><li><strong>Order status when paid</strong>: where the order goes when you press Mark as Paid on its payment.</li><li><strong>Order status when cancelled</strong>: where it goes when you cancel its pending payment.</li><li><strong>Order status when fully refunded</strong>: where it goes when its payment is refunded in full.</li></ul>Choose all three and save. Without them a paid order does not move: it keeps the status it was placed with, and nothing tied to a status change (stock, downloads, status emails) runs."
PLG_ALFA_PAYMENTS_STANDARD_CHECKUP_STATUSES_MISSING="Not chosen yet: %s."
PLG_ALFA_PAYMENTS_STANDARD_CHECKUP_PUBLISHED_TITLE="Method published"
PLG_ALFA_PAYMENTS_STANDARD_CHECKUP_PUBLISHED_HELP="Shoppers can choose this method only while it is published. Set its Status to Published and save, or publish it in the Payment Methods list."
PLG_ALFA_PAYMENTS_STANDARD_CHECKUP_PAID_TITLE="First payment recorded"
PLG_ALFA_PAYMENTS_STANDARD_CHECKUP_PAID_HELP="<ol class='mb-0 ps-3'><li>Place a test order with this method.</li><li>Open the order in the admin and, in its Payments section, press Mark as Paid on its payment.</li><li>This step turns green once that payment is recorded as paid.</li></ol>"
PLG_ALFA_PAYMENTS_STANDARD_CHECKUP_PAID_PROOF="Payment #%1$d on order #%2$d, %3$s."
PLG_ALFA_PAYMENTS_STANDARD_CHECKUP_REFUND_TITLE="First refund recorded"
PLG_ALFA_PAYMENTS_STANDARD_CHECKUP_REFUND_HELP="<ol class='mb-0 ps-3'><li>Open a paid test order in the admin and go to its Payments section.</li><li>Press Refund or Partial Refund on the paid payment and confirm.</li><li>This step turns green once the refund is recorded.</li></ol>"
PLG_ALFA_PAYMENTS_STANDARD_CHECKUP_REFUND_PROOF="Refund #%1$d on order #%2$d, %3$s."

; Params tab
PLG_ALFA_PAYMENTS_STANDARD_FIELDSET_SETTINGS="Standard settings"
PLG_ALFA_PAYMENTS_STANDARD_SECTION_STATUSES="Order status automation"
PLG_ALFA_PAYMENTS_STANDARD_SECTION_STATUSES_DESC="<strong>How this works.</strong> When a payment of this method changes (you press Mark as paid, the provider confirms or reserves it, or a full refund is recorded), Alfa moves the order to the status you choose below. That order status then does everything it is set up to do in Order statuses: stock, download access, documents, and the customer and admin emails.<ul><li><strong>No change</strong> keeps the order where it is.</li><li>Only a change counts: a new payment attempt, or one the customer can still retry, never moves the order.</li><li>Only a full refund moves the order; a partial refund does not.</li><li>An order in a cancelled status is never moved out automatically.</li><li>It works one way: changing an order's status by hand never marks its payment paid or refunded; use the payment's own buttons for that. A status marked as requiring payment refuses an order that is not fully paid.</li><li>Releasing a reservation is only recorded on the payment; it never moves the order. <strong>Cancelled</strong> and <strong>failed</strong> apply when staff mark a payment cancelled or failed by hand: a payment page the customer left or a declined attempt never moves the order.</li></ul>"
PLG_ALFA_PAYMENTS_STANDARD_STATUS_ON_COMPLETED_LABEL="Order status when paid"
PLG_ALFA_PAYMENTS_STANDARD_STATUS_ON_COMPLETED_DESC="When a payment of this method is completed, move the order to the status chosen here. An attempt the customer can still retry never moves the order. A status you set on a payment by hand does."
PLG_ALFA_PAYMENTS_STANDARD_STATUS_ON_CANCELLED_LABEL="Order status when cancelled"
PLG_ALFA_PAYMENTS_STANDARD_STATUS_ON_CANCELLED_DESC="When a payment of this method is cancelled, move the order to the status chosen here. An attempt the customer can still retry never moves the order. A status you set on a payment by hand does."
PLG_ALFA_PAYMENTS_STANDARD_STATUS_ON_REFUNDED_LABEL="Order status when fully refunded"
PLG_ALFA_PAYMENTS_STANDARD_STATUS_ON_REFUNDED_DESC="When a payment of this method is refunded in full, move the order to the status chosen here. An attempt the customer can still retry never moves the order. A status you set on a payment by hand does."
