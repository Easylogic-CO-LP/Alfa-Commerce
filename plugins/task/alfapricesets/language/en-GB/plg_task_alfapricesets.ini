PLG_TASK_ALFAPRICESETS="Task - Alfa list prices for customer groups"
PLG_TASK_ALFAPRICESETS_XML_DESCRIPTION="Scheduler task that prepares the list prices of new combinations of customer groups, so that the catalogue sorts and filters every customer by the price they are charged."
PLG_TASK_ALFAPRICESETS_PREPARE_TITLE="Alfa - Prepare list prices for customer groups"
PLG_TASK_ALFAPRICESETS_PREPARE_DESC="Prepares the list prices of the combinations of customer groups that a customer, a group or a pricing rule brought in, a chunk of products at a time. A run that stops is resumed where it stopped, and only one runs at a time. Until a combination is prepared its customers see every product at its correct price, but a price filter, &quot;on sale&quot; and &quot;save at least&quot; show them no product, the price slider is hidden and sorting by price follows the catalogue order (by product). A product whose price cannot be computed is left out of the combination and named in the task's log; saving the product prices it again."
PLG_TASK_ALFAPRICESETS_SECONDS_LABEL="Seconds per run"
PLG_TASK_ALFAPRICESETS_SECONDS_DESC="How long one run may work. While combinations still wait after it, the task is due again and runs at the scheduler's next trigger: the next page view with the lazy scheduler, or the next cron run. Keep it below the time limit of the requests that run your scheduled tasks."
