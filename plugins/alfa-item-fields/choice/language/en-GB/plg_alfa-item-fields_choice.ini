PLG_ALFA_ITEM_FIELDS_CHOICE_SWATCH_IMAGE_LABEL="Swatch image"
PLG_ALFA_ITEM_FIELDS_CHOICE_SWATCH_IMAGE_DESC="Optional texture/pattern image used instead of the flat color."
PLG_ALFA_ITEM_FIELDS_CHOICE_SWATCH_COLORS_LABEL="Swatch colours"
PLG_ALFA_ITEM_FIELDS_CHOICE_SWATCH_COLORS_DESC="The canonical colours this value represents. One row for a plain colour, two for a two-tone value such as Blue/Red, more for anything else. The colour code is the identity the filter groups by; the row order is the order the swatch paints."
PLG_ALFA_ITEM_FIELDS_CHOICE_SWATCH_CODE_LABEL="Colour"
PLG_ALFA_ITEM_FIELDS_CHOICE_SWATCH_LABEL_LABEL="Name"
PLG_ALFA_ITEM_FIELDS_CHOICE_SWATCH_LABEL_DESC="Optional. Shown as the filter group name; the first value that names a colour wins. Falls back to the colour code."
PLG_ALFA_ITEM_FIELDS_CHOICE_FILTER_GROUP_LABEL="Group by colour in filters"
PLG_ALFA_ITEM_FIELDS_CHOICE_FILTER_GROUP_DESC="Offer one filter entry per colour instead of one per value, so Blue, Blue Metallic and Navy Blue collapse into a single Blue. A value carrying several colours is offered under each. Filter modules always follow this setting."
