PLG_ALFA_ITEM_FIELDS_CHOICE="Alfa Item Fields - Choice"
PLG_ALFA_ITEM_FIELDS_CHOICE_XML_DESCRIPTION="Choice item field for Alfa Commerce: pool values rendered as dropdown, radio, buttons or swatches, configurable per surface (item page, filters, listings)."
PLG_ALFA_ITEM_FIELDS_CHOICE_FIELDSET_SETTINGS="Display"
PLG_ALFA_ITEM_FIELDS_CHOICE_FIELDSET_VALUE="Swatch"
PLG_ALFA_ITEM_FIELDS_CHOICE_RENDER_AS_LABEL="Show on item page as"
PLG_ALFA_ITEM_FIELDS_CHOICE_RENDER_AS_DESC="How the buyer picks a value on the item page. Every selector layout is listed: the plugin's own item-&lt;name&gt;.php layouts first, then, grouped under their template, the ones a site template adds as html/plg_alfa-item-fields_choice/item-&lt;name&gt;.php. A template's layout is drawn only on the pages that template renders. Text labels draws no selector, so it is offered on listings only. The layout receives field, values, selected, available, inStock and unavailableMode, plus inputName and reloadScope: the plugin declares the selector (sel[] for a variant field, opt[] for an option) and the layout must draw its input with the inputName it is given."
PLG_ALFA_ITEM_FIELDS_CHOICE_FILTER_RENDER_AS_LABEL="Show in filters as"
PLG_ALFA_ITEM_FIELDS_CHOICE_FILTER_RENDER_AS_DESC="How this field renders in the shop filters module, independent of the item page look."
PLG_ALFA_ITEM_FIELDS_CHOICE_LISTING_RENDER_AS_LABEL="Show on listings as"
PLG_ALFA_ITEM_FIELDS_CHOICE_LISTING_RENDER_AS_DESC="How this field renders on category/listing cards when 'Show on listings' is enabled. 'Same as item page' follows 'Show on item page as'. The list holds the same selector layouts as the item page, a template's own layouts grouped under it and drawn only on the pages that template renders, and a layout receives the same data on the card. 'Text labels' lists the values without a selector: when the buyer must pick this field, the card button becomes 'Choose options' and opens the item page. Does not apply to informational fields, which always render as a specification row."
PLG_ALFA_ITEM_FIELDS_CHOICE_LISTING_INHERIT="Same as item page"
